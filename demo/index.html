<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Leutenheim — démo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Interface rétro : police à gros pixels, angles droits, cadres biseautés, pas d'arrondis ni de transparences douces. */
  :root {
    --ink: #e8dcc0; --dim: #9c8f74; --gold: #e0b040; --panel: #1b1612; --panel-hi: #5a4a2a; --panel-lo: #0c0906;
    --btn: #3b2f20; --btn-hi: #7a6238; --btn-lo: #17110a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #070605; color: var(--ink);
    font-family: "VT323", "Courier New", ui-monospace, monospace; font-size: 18px; line-height: 1.1; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas, button, .card { outline: none; }
  /* Format téléphone partout : largeur d'un téléphone (420 px au plus), toute la hauteur disponible (900 px au plus).
     Sur PC, la colonne ne dépend plus de la hauteur de la fenêtre : les menus gardent toujours la même largeur. */
  .col { position: relative; width: min(100%, 420px); height: min(calc(100vh - 12px), 900px); height: min(calc(100dvh - 12px), 900px); display: flex; flex-direction: column; gap: 6px; }
  [hidden] { display: none !important; }

  /* Cadre biseauté commun aux panneaux. */
  .panel, .hp, #menu, #bag, #detail, #over {
    border: 3px solid var(--panel-hi); box-shadow: inset 0 0 0 2px var(--panel-lo), 0 0 0 2px var(--panel-lo); }

  /* Jauges de vie et d'expérience, avec le bouton du menu à leur droite. */
  .gauges { display: flex; gap: 6px; align-items: stretch; }
  .gauges-col { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #alarm-badge { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 2px; background: none; box-shadow: none; }
  #alarm-bell svg { width: 30px; height: 30px; display: block; }
  .alarm-bar { display: block; width: 30px; height: 5px; background: #281e14; }
  #alarm-fill { display: block; height: 100%; width: 0; }
  @keyframes bang-blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.25); } }
  /* Tout le bouton du héros clignote quand un choix l'attend (Thomas : pas seulement le « ! »). */
  @keyframes hero-blink { 0%, 100% { background-color: #3a2e1c; box-shadow: inset 0 0 0 2px var(--gold); } 50% { background-color: #8a6a26; box-shadow: inset 0 0 0 3px #ffd75e; } }
  #power.off { filter: grayscale(1) brightness(0.6); }
  #open-bag.pending { animation: hero-blink 0.9s ease-in-out infinite; }
  #floor-badge { flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; color: var(--gold); font-size: 30px; line-height: 1; }
  #floor-icon svg { width: 30px; height: 30px; display: block; }
  #open-menu { flex: none; width: 46px; padding: 4px; display: flex; align-items: center; justify-content: center; }
  #open-menu svg { height: 26px; width: auto; }
  #hud-text { font-size: 19px; text-align: center; letter-spacing: 0.04em; color: var(--gold); text-transform: uppercase; }
  .hp { position: relative; height: 18px; background: #2a0c10; padding: 0; }
  /* Petites animations : la barre de vie tressaute et blanchit quand on est blessé, la jauge d'expérience
     s'illumine quand on en gagne, et les deux jauges glissent vers leur nouvelle valeur par crans. */
  #hp-fill, #xp-fill { transition: width 0.3s steps(6); }
  .hp.hit { animation: hpHit 0.36s steps(6); }
  @keyframes hpHit { 0% { transform: translateX(0); filter: brightness(2.4); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); filter: brightness(1.6); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(2px); filter: brightness(1.2); } 100% { transform: none; filter: none; } }
  .hp.xp.gain { animation: xpGain 0.5s steps(6); }
  @keyframes xpGain { 0% { filter: brightness(2.6); transform: scaleY(1.7); } 60% { filter: brightness(1.6); transform: scaleY(1.2); } 100% { filter: none; transform: none; } }
  .frame.hurt::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 6px rgba(208, 58, 68, 0.85); animation: hurt 0.32s steps(4) forwards; }
  @keyframes hurt { to { opacity: 0; } }
  .hp span { position: absolute; inset: 0; text-align: center; font-size: 16px; line-height: 12px; color: #fff; text-shadow: 1px 1px 0 #000; text-transform: uppercase; }
  .hp.xp { height: 14px; background: #0c1626; }
  .hp.xp span { font-size: 14px; line-height: 8px; color: #cfe6ff; }
  #xp-fill { height: 100%; width: 0; background: repeating-linear-gradient(to right, #3a7bd0 0 6px, #24508e 6px 8px); }
  #hp-fill { height: 100%; width: 100%; background: repeating-linear-gradient(to right, #c8323c 0 6px, #8e1f28 6px 8px); }
  /* La carte prend toute la hauteur qui reste entre les jauges et le panneau du dé. */
  .frame { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; background: #070605; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; image-rendering: pixelated; }

  /* Boutons : pavés biseautés, texte en capitales. */
  button { font: inherit; font-size: 19px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); cursor: pointer; white-space: nowrap;
    background: var(--btn); border: 0; border-radius: 0; padding: 7px 10px;
    box-shadow: inset 2px 2px 0 var(--btn-hi), inset -2px -2px 0 var(--btn-lo), 0 0 0 2px var(--panel-lo); }
  button:active { box-shadow: inset -2px -2px 0 var(--btn-hi), inset 2px 2px 0 var(--btn-lo), 0 0 0 2px var(--panel-lo); transform: translateY(1px); }
  button.active { background: #6b4a12; color: #fff3c8; }
  button.ghost { background: #241c14; color: var(--dim); }

  .overlay { position: absolute; inset: 0; background: #0d0a08; display: flex; flex-direction: column;
    align-items: center; justify-content: center; justify-content: safe center; gap: 12px; text-align: center; padding: 16px;
    overflow-x: hidden; overflow-y: auto; }
  #over { inset: 18% 8%; background: #140808; border-color: #7a2a2a; font-size: 22px; }
  #hero-status { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; z-index: 1; }
  #hero-status button { width: 30px; height: 30px; padding: 2px; display: flex; background: #1a140e; box-shadow: inset 0 0 0 2px #4a3e2a; }
  #hero-status svg { width: 100%; height: 100%; }
  #status-pop.right { left: auto; right: 6px; }
  #status-pop { position: absolute; top: 42px; left: 6px; z-index: 1; width: min(260px, 80%); padding: 8px; background: #241c14; box-shadow: inset 0 0 0 2px var(--gold); font-size: 17px; color: var(--dim); }
  #status-pop b { display: block; color: #fff3c8; font-weight: normal; font-size: 20px; text-transform: uppercase; }
  #test-tools { position: absolute; bottom: 8px; left: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #test-tools button { padding: 4px 8px; font-size: 18px; }
  #recenter { position: absolute; top: 8px; right: 8px; padding: 6px; display: flex; }
  #recenter:active { transform: translateY(1px); }
  /* Roue d'actions : cinq boutons en couronne autour du héros, le reste de la carte assombri. */
  #wheel { position: absolute; inset: 0; z-index: 3; background: rgba(8, 6, 12, 0.4); }
  #wheel button { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; padding: 6px; display: flex; }
  #wheel button svg { width: 100%; height: 100%; }
  #wheel button.off { filter: grayscale(1) brightness(0.6); }
  #recenter svg { width: 28px; height: 28px; }
  #door-actions { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 8px; align-items: stretch; }
  .door-choices { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #door-actions button { background: #4a2f12; }
  /* La croix : renoncer à la porte sans rien tenter, et garder la main (utile si un ennemi arrive). */
  #door-actions #door-cancel { flex: none; width: 52px; padding: 8px; background: var(--btn); display: flex; align-items: center; justify-content: center; }
  #door-cancel svg { width: 100%; height: 100%; }

  /* Dés et journal. */
  /* Objet au sol sous le héros : une languette qui sort de derrière le panneau, au-dessus du dé, pour le ramasser
     (un objet à la fois) ou lire sa fiche. Elle recouvre le bas de la carte et ne déplace rien. */
  .panel-wrap { position: relative; flex: none; }
  .panel-wrap .panel { position: relative; z-index: 1; }
  #here { position: absolute; left: 0; bottom: 100%; z-index: 0; display: flex; align-items: center; gap: 6px; height: 50px; max-width: 100%;
    padding: 4px 6px; background: var(--panel); border: 3px solid var(--panel-hi); border-bottom: none; box-shadow: inset 0 0 0 2px var(--panel-lo);
    transform: translateY(100%); transition: transform 0.2s steps(5); pointer-events: none; }
  #here.open { transform: translateY(0); pointer-events: auto; }
  #here-icon { width: 34px; height: 34px; flex: none; background: #0c0906; padding: 2px; }
  #here-icon svg { width: 100%; height: 100%; }
  #here-name { font-size: 18px; color: #fff3c8; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #here button { width: 38px; height: 38px; padding: 3px; flex: none; font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  #here button svg { width: 100%; height: 100%; }
  /* Taille FIXE : ni la hauteur du panneau ni la largeur de la zone du dé ne bougent, quel que soit le texte
     du journal ou le nombre de dés. Le journal trop long est coupé par le haut ; le second dé (avantage ou
     désavantage) se loge en petit dans le coin du premier au lieu d'élargir la zone. */
  .panel { display: flex; gap: 8px; align-items: stretch; height: 100px; flex: none; overflow: hidden; background: var(--panel); padding: 6px; }
  .dice { flex: 0 0 84px; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 0; cursor: pointer; }
  /* Un ennemi au contact : le dé s'entoure d'or, le toucher frappe au corps à corps. */
  .dice.ready { box-shadow: inset 0 0 0 2px var(--gold); }
  .dice.ready #die-who { color: var(--gold); }
  .dice-row { display: flex; align-items: center; justify-content: center; gap: 2px; width: 84px; height: 58px; flex: none; }
  /* Deux dés (avantage ou désavantage) : côte à côte, plus petits, dans la même zone. Le dé écarté s'estompe. */
  .dice-row.pair .die { width: 41px; height: 41px; font-size: 20px; }
  /* Dé à 20 faces vu de face, sans image : un hexagone (::before) dont les six secteurs sont ombrés différemment,
     et par-dessus un grand triangle (::after) découpé en quatre faces ; le chiffre s'inscrit sur la face centrale. */
  .die { --edge: #5a4a30; --face: #3a2e1c; --side: #2a2114; --low: #1c160c; --rim-a: #241c10; --rim-b: #17110a;
    position: relative; isolation: isolate; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
    font-size: 27px; color: var(--dim); text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
    filter: drop-shadow(1px 0 0 var(--edge)) drop-shadow(-1px 0 0 var(--edge)) drop-shadow(0 1px 0 var(--edge)) drop-shadow(0 -1px 0 var(--edge)); }
  .die::before, .die::after { content: ""; position: absolute; inset: 0; z-index: -1; }
  .die::before { clip-path: polygon(50% 0, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
    background: conic-gradient(var(--rim-a) 0 60deg, var(--rim-b) 0 120deg, var(--rim-a) 0 180deg, var(--rim-b) 0 240deg, var(--rim-a) 0 300deg, var(--rim-b) 0); }
  .die::after { clip-path: polygon(6.7% 25%, 93.3% 25%, 50% 100%);
    background: linear-gradient(to bottom, transparent 62.5%, var(--low) 0),
      linear-gradient(300deg, transparent 59.15%, var(--side) 0), linear-gradient(60deg, transparent 59.15%, var(--low) 0), var(--face); }
  .die.hit { --edge: #5fd38d; color: #8ff0b4; --face: #1f4a30; --side: #17382a; --low: #102a1e; }
  .die.miss { --edge: #8a8070; color: #d8ccb0; --face: #4a4334; --side: #383225; --low: #26221a; }
  .die.crit { --edge: var(--gold); color: #fff3c8; --face: #8a6410; --side: #6a4a0c; --low: #4a3408; --rim-a: #3a2a08; --rim-b: #2a1e06; }
  .die.foe { --rim-a: #3a1016; --rim-b: #2a0c10; }
  .die.rolling { --edge: #fff; color: #fff; --face: #6a5a40; --side: #4a3e2a; --low: #32291a; animation: roll 0.16s steps(4) infinite; }
  .die.land { animation: land 0.2s steps(3); }
  .die.dropped { opacity: 0.35; transform: scale(0.85); --edge: #4a3e2a; color: var(--dim); }
  @keyframes roll { 0% { transform: rotate(-14deg); } 25% { transform: rotate(10deg) translateY(-4px); }
    50% { transform: rotate(-8deg); } 75% { transform: rotate(12deg) translateY(3px); } 100% { transform: rotate(-14deg); } }
  @keyframes land { 0% { transform: scale(1.5); } 60% { transform: scale(0.9); } 100% { transform: scale(1); } }
  #die-who { font-size: 13px; line-height: 12px; color: var(--dim); height: 24px; width: 84px; overflow: hidden; text-align: center; text-transform: uppercase; }
  #die-who.advantage { color: var(--gold); }
  #die-who.disadvantage { color: #ff6b7a; }
  #log { flex: 1; min-width: 0; min-height: 0; overflow: hidden; font-size: 16px; line-height: 1.05; color: var(--dim); display: flex; flex-direction: column; justify-content: flex-end; }
  #log div { flex: none; }
  #log div:last-child { color: var(--ink); }

  .bar { display: flex; align-items: stretch; gap: 5px; flex: none; height: 48px; }
  .bar button { flex: 1; padding: 8px 4px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .bar button { min-height: 0; height: 100%; font-size: 20px; white-space: nowrap; overflow: hidden; }
  .bar button svg { height: 28px; width: auto; flex: none; }

  /* Menus. */
  #menu { z-index: 2; }
  #menu section { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #menu h1 { margin: 0; font-size: min(56px, 11vw); font-weight: 400; letter-spacing: 0.08em; color: var(--gold); text-shadow: 3px 3px 0 #5a3a08; }
  #menu h2, #bag h2 { margin: 0 0 4px; font-size: 32px; font-weight: 400; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 2px 2px 0 #5a3a08; }
  #menu h3 { margin: 6px 0 0; font-size: 18px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); align-self: flex-start; }
  #menu p { margin: 0 0 14px; font-size: 18px; color: var(--dim); }
  #menu section > button, #detail > button { width: min(250px, 80%); padding: 10px; font-size: 22px; }
  #seed { font-size: 15px; color: #6a5f4a; margin-top: 8px; }
  /* minmax(0, 1fr) : les trois cases se partagent la largeur, même si un mot est long (sinon elles débordent). */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
  .card { position: relative; background: var(--panel); padding: 26px 4px 8px; min-height: 108px; cursor: pointer; text-align: center;
    border: 3px solid #4a3e2a; box-shadow: inset 0 0 0 2px var(--panel-lo); }
  .card.selected { border-color: var(--gold); background: #2a2010; }
  .card.locked { filter: grayscale(1) brightness(0.6); cursor: default; }
  /* Le nom tient sur une ligne même sur un petit téléphone (« MAGICIEN », « GUERRIER »). */
  .card-name { font-size: min(22px, 5vw); color: #fff3c8; margin-bottom: 2px; text-transform: uppercase; white-space: nowrap; }
  .card-info { font-size: min(16px, 4vw); color: var(--dim); }
  .card-soon { font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin-top: 2px; }
  .card .more { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; padding: 0; font-size: 22px; line-height: 1; }
  #detail { z-index: 3; }
  #detail-body { display: flex; flex-direction: column; gap: 4px; font-size: 18px; text-align: left; max-width: 310px; }
  #detail-body div:first-child { color: var(--dim); margin-bottom: 4px; }

  /* Sac : cases en creux, objets en gros pixels. */
  #bag { z-index: 2; }
  #bag-grid { --cols: 6; --rows: 4; position: relative; width: min(100%, 318px); aspect-ratio: var(--cols) / var(--rows);
    background-color: #0c0906; border: 3px solid var(--panel-hi); box-shadow: inset 0 0 0 2px var(--panel-lo); cursor: pointer;
    background-image: linear-gradient(to right, #2e261a 2px, transparent 2px), linear-gradient(to bottom, #2e261a 2px, transparent 2px);
    background-size: calc(100% / var(--cols)) calc(100% / var(--rows)); }
  .bag-item { position: absolute; padding: 5px; background: #241c14; box-shadow: inset 2px 2px 0 #4a3e2a, inset -2px -2px 0 #0c0906;
    display: flex; align-items: center; justify-content: center; }
  .bag-item svg { width: 100%; height: 100%; }
  .bag-item.spent svg { filter: grayscale(1) brightness(0.55); opacity: 0.6; }
  .bag-item.equipped { box-shadow: inset 0 0 0 2px #5fd38d; }
  .bag-item.selected { background: #3a2c14; box-shadow: inset 0 0 0 2px var(--gold); }
  .bag-count { position: absolute; right: 4px; bottom: 0; font-size: 20px; color: #fff; text-shadow: 2px 2px 0 #000; }
  /* Ce que le héros porte : amulette, heaume et artefact en haut, arme, armure, arc en bas. */
  #bag { gap: 6px; justify-content: flex-start; padding-top: 10px; }
  #bag h3 { margin: 2px 0 0; font-size: 18px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }
  #doll { display: grid; grid-template-columns: repeat(3, 76px); grid-template-areas: "amulet hat artifact" "melee armor ranged"; gap: 4px 10px; }
  .slot { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .slot-amulet { grid-area: amulet; } .slot-hat { grid-area: hat; } .slot-armor { grid-area: armor; }
  .slot-artifact { grid-area: artifact; } .slot-melee { grid-area: melee; } .slot-ranged { grid-area: ranged; }
  .slot-box { width: 64px; height: 64px; padding: 4px; background: #0c0906; border: 3px solid var(--panel-hi);
    box-shadow: inset 2px 2px 0 #000; display: flex; align-items: center; justify-content: center; }
  .slot-box svg { height: 100%; width: auto; max-width: 100%; }
  .slot.empty .slot-box { border-color: #3a3020; }
  .slot.selected .slot-box { border-color: var(--gold); background: #3a2c14; }
  .slot-box svg.ghost { opacity: 0.2; filter: grayscale(1) brightness(1.7); }
  /* Fiche d'objet : la même dans l'équipement et quand on trouve quelque chose. */
  /* Encyclopédie : toutes les fiches d'objets, rangées par genre, dans une liste qui défile. */
  #screen-codex { height: 100%; min-height: 0; }
  #codex-tabs { display: flex; gap: 6px; width: 100%; }
  #codex-tabs button { flex: 1; padding: 6px 2px; font-size: 18px; }
  #codex-tabs button.active { background: #4a3408; color: #fff3c8; border-color: var(--gold); }
  .codex-glyph { width: 40px; height: 40px; }
  #codex-list { flex: 1; min-height: 0; overflow-y: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-right: 2px; }
  #codex-list h3 { align-self: stretch; border-bottom: 2px solid var(--panel-hi); }
  .codex-empty { font-size: 16px; color: var(--dim); align-self: flex-start; }
  .item-card { display: flex; gap: 8px; text-align: left; width: min(100%, 318px); background: var(--panel); padding: 6px;
    border: 3px solid var(--panel-hi); box-shadow: inset 0 0 0 2px var(--panel-lo); }
  .item-card-icon { flex: 0 0 64px; height: 84px; background: #0c0906; box-shadow: inset 2px 2px 0 #000; padding: 4px; display: flex; align-items: center; justify-content: center; }
  .item-card-icon svg { max-width: 100%; max-height: 100%; }
  .item-card-body { flex: 1; min-width: 0; }
  .item-card-name { color: #fff3c8; font-size: 22px; text-transform: uppercase; }
  .item-card-kind { color: var(--gold); font-size: 15px; text-transform: uppercase; margin-bottom: 2px; }
  .item-card-stats { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; font-size: 17px; color: var(--dim); }
  .item-card-value { color: var(--ink); }
  .item-card-desc { font-size: 15px; color: var(--dim); margin-top: 3px; }
  #found { z-index: 2; background: rgba(13,10,8,0.92); }
  #found h2 { margin: 0; font-size: 32px; font-weight: 400; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 2px 2px 0 #5a3a08; }
  #found button { width: 220px; padding: 10px; font-size: 22px; }
  .hero-tabs { display: flex; width: min(100%, 318px); margin-right: 44px; }
  .hero-close { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; padding: 0; font-size: 26px; line-height: 1; z-index: 3; }
  #bag .slot-box { width: 56px; height: 56px; }
  #doll { grid-template-areas: "amulet hat artifact" "melee armor ranged" "quiver bag ." !important; }
  .slot-quiver { grid-area: quiver; } .slot-bag { grid-area: bag; grid-column: auto; }
  .slot-box .slot-count { position: absolute; right: 2px; bottom: -4px; font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #000; }
  .slot-box { position: relative; }
  #bag-grid { max-height: 30vh; }
  #bag-info { min-height: 0; }

    unlock() {

    tone(from, to, duration, wave, volume, delay = 0) {
      const ctx = this.ctx;
      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t + duration);
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(1e-3, t + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.02);
    }
    noise(duration, volume, cutoff, delay = 0) {
      const ctx = this.ctx;
      const t = ctx.currentTime + delay;
      const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = cutoff;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(1e-3, t + duration);
      src.connect(filter).connect(gain).connect(ctx.destination);
      src.start(t);
    }
    /** Bruit filtré à bande étroite (passe-bande) : un claquement de bois, une braise qui éclate. */

      const ctx = this.ctx;
      const t = ctx.currentTime + delay;
      const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-6 * i / length);
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = freq;
      filter.Q.value = q;
      const gain = ctx.createGain();
      gain.gain.value = volume;
      src.connect(filter).connect(gain).connect(ctx.destination);
      src.start(t);

     * proximité d'une cheminée allumée en vue. Un souffle grave à peine audible, des petits claquements de bois

          this.noise(0.9, 0.012 * level, 260 + Math.random() * 120);
        }
        this.fireDebt += dt * 55e-4 * level * (0.3 + 1.4 * Math.random());
        while (this.fireDebt >= 1) {

          const burst = Math.random() < 0.3 ? 2 + Math.floor(Math.random() * 3) : 1;

            this.tone(1175, 1175, 0.16, "sine", 0.13, 0.08);

  function rollDice(rng, dice, critical = false) {
    let total = dice.bonus;
    const count = critical ? dice.count * 2 : dice.count;
    for (let i = 0; i < count; i++) total += rng.int(1, dice.sides);
    return Math.max(1, total);
  }
  function diceLabel(d) {
    return `${d.count}d${d.sides}${d.bonus > 0 ? `+${d.bonus}` : d.bonus < 0 ? d.bonus : ""}`;
  }

      return true;
    }
    /** Passer un tour sur place. */
    /** Ce qui traîne sur la case du héros, dans l'ordre où on le ramassera. */

    /** Ordre : ramasser le premier objet de la case (un seul à la fois ; cela prend un tour). */

      this.shotTarget = null;
      this.waiting = false;
      this.resting = 0;
      this.searching = 0;
      this.hideOrder = false;
      this.jumpTarget = null;
      this.pushTargetId = null;
      this.useOrder = null;
      this.throwOrder = null;
      this.skillOrder = null;
      this.picking = true;
      this.pickingItem = null;

    /** Pourquoi le héros ne peut pas se reposer maintenant (`null` : il le peut). */

    /** Avancement du repos en cours, de 0 à 1 (0 : pas de repos). */
    restProgress() {

    }
    /**

    /** Pourquoi le héros ne peut pas fouiller maintenant (`null` : il le peut). */
    searchRefusal() {

      if (this.current.searched.has(room)) return "searched";
      if (this.visibleMonsters().length > 0) return "danger";
      return null;
    }
    /** Avancement de la fouille en cours, de 0 à 1 (0 : pas de fouille). */
    searchProgress() {

    /** Pourquoi le héros ne peut pas se cacher maintenant (`null` : il le peut). */

    /** Ordre : se cacher contre l'obstacle voisin (un tour, un jet au d20). */

    /** Cases où le héros peut sauter pour se dégager : à deux cases en ligne droite, passage libre, sans porte ni escalier. */

    /** Ordre : sauter vers cette case (une de `jumpCells`), sans attaque d'opportunité. */

      this.jumpTarget = { x, y };

    /** Le héros sort de sa cachette. */

    /** Ordre : se reposer sur place plusieurs tours. Tout autre ordre y renonce, un monstre en vue l'interrompt. */

    wait() {

      this.searching = 0;
      this.hideOrder = false;
      this.jumpTarget = null;
      this.pushTargetId = null;
      this.useOrder = null;
      this.throwOrder = null;
      this.skillOrder = null;

      this.path = [];
      this.targetId = null;
      this.shotTarget = null;
      this.waiting = true;

    // ---------- Déroulement d'un tour ----------

    /** Jet pour se cacher. Réussi : les monstres perdent la trace du héros et redeviennent de simples promeneurs. */
    resolveHide() {

      const success = d20 === 20 || d20 !== 1 && total >= RULES.hideDc;
      if (success) {
        this.hidden = true;
        for (const m of this.monsters) {
          if (!m.alerted) continue;
          m.alerted = false;
          m.asleep = false;
          m.wary = false;
        }
      }
      this.events.push({ type: "hide", d20, bonus, total, success });

    /**
     * Poussée : réussie, le monstre recule d'une case dans l'axe du héros et perd son prochain tour ;

     * S'il recule sur un piège, le piège se déclenche.

      const bonus = this.pushBonus();
      const d20 = this.rng.int(1, 20);

      const success = d20 === 20 || d20 !== 1 && total >= RULES.pushDc;

      m.asleep = false;

        const dy = Math.sign(m.y - this.hero.y);

          const to = { x: m.x + dx, y: m.y + dy };

        return;

      if (this.searching > 0) return;
      const index = this.roomIndexAt(this.hero);
      if (index < 0) return;
      this.current.searched.add(index);
      const bonus = this.heroClass.searchBonus;
      const d20 = this.rng.int(1, 20);
      const total = d20 + bonus;
      const success = d20 === 20 || d20 !== 1 && total >= RULES.searchDc;

      if (success) {
        for (const s of this.current.secrets) {
          if (s.room !== index || s.found) continue;

    /** Saut pour se dégager : il faut réussir un jet. Réussi, pas d'attaque d'opportunité, mais ceux qu'on quitte restent sur leurs gardes. */
    resolveJump(to) {

      const bonus = this.disengageBonus();
      const d20 = this.rng.int(1, 20);

      const success = d20 === 20 || d20 !== 1 && total >= RULES.disengageDc;
      if (!success) {
        this.events.push({ type: "jump", fromX: from.x, fromY: from.y, x: from.x, y: from.y, d20, bonus, total, success });

      }
      this.hero.x = to.x;
      this.hero.y = to.y;

    /** Fin d'un tour de repos : un monstre en vue l'interrompt (le repos de l'étage n'est pas perdu) ; au dernier tour, il soigne. */
    afterRestTurn() {

    /**

     */
    inReach(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== 1) return false;
      if (dx === 0 || dy === 0) return true;
      return this.map.isWalkable(a.x + dx, a.y) || this.map.isWalkable(a.x, a.y + dy);
    }
    /**
     * Arme à longue portée (lance) : le monstre est à deux cases en ligne droite ou en diagonale,

    inWeaponReach(m) {

      const dy = m.y - this.hero.y;

    /** Le poison ronge les monstres empoisonnés, au début de leur tour. */

        m.poison.turns--;

        if (m.poison.turns <= 0) m.poison = void 0;
        this.removeIfDead(m);
      }
    }
    /** Vrai si `a` et `b` se touchent en diagonale autour d'un coin de mur : celui qui frappe surprend l'autre. */
    aroundCorner(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      if (Math.abs(dx) !== 1 || Math.abs(dy) !== 1) return false;
      return this.map.isWalkable(a.x + dx, a.y) !== this.map.isWalkable(a.x, a.y + dy);

    /** Le héros aurait-il l'avantage en frappant ce monstre maintenant ? (cible distraite, dans une porte, ou au coin d'un mur) */
    heroHasAdvantageOn(monster) {
      if (this.hero.lastAdvantageOn === monster.id) return false;
      if (!monster.alerted) return true;
      if (monster.wary) return false;

    }
    /**
     * Le monstre à frapper si l'on touche le dé : celui qu'on frappait déjà s'il est toujours au contact,
     * sinon un monstre alerté au contact (le plus abîmé d'abord), sinon n'importe quel monstre visible au contact.

    meleeTarget() {

      if (last2) return last2;

    /** Ordre : frapper au corps à corps le monstre désigné par `meleeTarget` (un tour). */
    strike() {
      const target = this.over ? null : this.meleeTarget();

      return this.setDestination(target.x, target.y);
    }
    /** Un ennemi alerté est-il au contact du héros ? */

    inCombat() {
      return this.monsters.some((m) => m.alerted && this.isVisible(m.x, m.y));
    }
    /** Le bruit d'un combat réveille les dormeurs proches : ils se lèvent et viennent (Thomas). */
    wakeNear(at) {
      for (const m of this.monsters) {

    /**
     * Salle d'essai, « Combats : non » : les monstres sont mis de côté (ils disparaissent de l'étage), et reviennent à leur

    setPeaceful(on) {

      this.peaceful = on;
      if (on) {
        this.peacefulStash = this.monsters.splice(0);
      } else {
        for (const m of this.peacefulStash) {
          if (!this.actorAt(m.x, m.y)) this.monsters.push(m);
        }
        this.peacefulStash = [];
      }
    }
    /** Un monstre éveillé a le héros en vue directe (ligne de vue dégagée, à portée de ses yeux) : impossible de se cacher. */

    canvas2.addEventListener("pointerdown", (e) => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try {
        canvas2.setPointerCapture(e.pointerId);
      } catch {
      }
      if (pointers.size === 1) {
        isGesture = false;
        downAt = { x: e.clientX, y: e.clientY };
        lastAt = { x: e.clientX, y: e.clientY };
        cancelPress();
        pressTimer = setTimeout(() => {
          pressTimer = void 0;
          if (pointers.size !== 1 || isGesture) return;
          const rect = canvas2.getBoundingClientRect();
          if (handlers.onLongPress(downAt.x - rect.left, downAt.y - rect.top)) isGesture = true;
        }, LONG_PRESS_MS);
      } else if (pointers.size === 2) {
        cancelPress();
        isGesture = true;
        pinchDistance = distance();
        pinchCenter = center2();
      }
      e.preventDefault();
    });
    canvas2.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const d = distance();
        if (pinchDistance > 0 && d > 0) handlers.onZoom(d / pinchDistance);
        pinchDistance = d;
        const c = center2();
        handlers.onPan(c.x - pinchCenter.x, c.y - pinchCenter.y);
        pinchCenter = c;
      } else if (pointers.size === 1) {
        if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > TAP_SLOP) {
          isGesture = true;
          cancelPress();
        }
        if (isGesture) handlers.onPan(e.clientX - lastAt.x, e.clientY - lastAt.y);
        lastAt = { x: e.clientX, y: e.clientY };
      }
    });
    const release = (e, cancelled) => {
      if (!pointers.delete(e.pointerId)) return;
      cancelPress();
      pinchDistance = 0;
      if (pointers.size === 1) {
        const [rest] = [...pointers.values()];
        lastAt = { x: rest.x, y: rest.y };
        downAt = { x: rest.x, y: rest.y };
      } else if (pointers.size === 2) {
        pinchDistance = distance();
        pinchCenter = center2();
      }
      if (!cancelled && !isGesture && pointers.size === 0) {
        const rect = canvas2.getBoundingClientRect();
        handlers.onTap(e.clientX - rect.left, e.clientY - rect.top);
      }
    };
    canvas2.addEventListener("pointerup", (e) => release(e, false));
    canvas2.addEventListener("pointercancel", (e) => release(e, true));
    canvas2.addEventListener(
      "wheel",
      (e) => {
        handlers.onZoom(e.deltaY < 0 ? 1.1 : 1 / 1.1);
        e.preventDefault();
      },
      { passive: false }
    );
    window.addEventListener("keydown", (e) => {
      const dir = KEYS[e.key];
      if (!dir) return;
      handlers.onMove(dir[0], dir[1]);
      e.preventDefault();
    });
  }

  function buildIcon(rows, palette = PALETTE) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", `0 0 ${rows[0].length} ${rows.length}`);
    svg.setAttribute("shape-rendering", "crispEdges");
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; ) {
        const c = row[x];
        let end = x + 1;
        while (end < row.length && row[end] === c) end++;
        if (c !== ".") {
          const r = document.createElementNS(ns, "rect");
          r.setAttribute("x", String(x));
          r.setAttribute("y", String(y));
          r.setAttribute("width", String(end - x));
          r.setAttribute("height", "1");
          r.setAttribute("fill", palette[c]);
          svg.appendChild(r);
        }
        x = end;
      }
    });
    return svg;
  }

  // src/render/motifs.ts
  var hypot = Math.hypot;
  var MOTIFS = {
    rosace(u, v) {
      const r = hypot(u, v);
      const a = Math.atan2(v, u);
      if (Math.abs(r - 0.9) < 0.05 || Math.abs(r - 0.78) < 0.04) return 1;
      if (r < 0.14) return 2;
      if (r < 0.74) {
        const k = (a / (Math.PI / 4) % 1 + 1) % 1;
        const d = Math.min(k, 1 - k);
        const width = 0.5 * Math.sin(Math.PI * Math.min(1, Math.max(0, (r - 0.16) / 0.58)));
        if (Math.abs(d - width * 0.5) < 0.05 && r > 0.18) return 1;
      }
      return 0;
    },
    boussole(u, v) {
      const r = hypot(u, v);
      if (Math.abs(r - 0.9) < 0.06) return 1;
      const au = Math.abs(u);
      const av = Math.abs(v);
      if (au < 0.12 * (1 - av / 0.85) && av < 0.85 || av < 0.12 * (1 - au / 0.85) && au < 0.85) return 2;
      if (Math.abs(au - av) < 0.05 && r < 0.5) return 1;
      return 0;
    },
    runes(u, v) {
      const r = hypot(u, v);
      const a = Math.atan2(v, u);
      if (Math.abs(r - 0.92) < 0.05 || Math.abs(r - 0.62) < 0.05) return 1;
      if (r > 0.68 && r < 0.86) {
        const seg = (a + Math.PI) / (2 * Math.PI) * 10;
        if (Math.abs(seg - Math.round(seg)) < 0.1 || Math.floor(seg) % 2 === 0 && Math.abs(r - 0.77) < 0.03) return 1;
      }
      if (r < 0.3 && Math.abs(Math.abs(u) - Math.abs(v)) < 0.05) return 1;
      return 0;
    },
    croix(u, v) {
      const au = Math.abs(u);
      const av = Math.abs(v);
      const m = Math.max(au, av);
      if (m > 0.86 && m < 0.94) return 1;
      if (au < 0.12 && av < 0.7 || av < 0.12 && au < 0.7) return 1;
      if (av > 0.55 && av < 0.7 && au < 0.3 || au > 0.55 && au < 0.7 && av < 0.3) return 1;
      return 0;
    },
    spirale(u, v) {
      const r = hypot(u, v);
      const a = Math.atan2(v, u);
      if (r > 0.92) return 0;
      const t = r / 0.9 * 3 - (a + Math.PI) / (2 * Math.PI);
      return Math.abs(t - Math.round(t)) < 0.12 && r > 0.08 ? 1 : 0;
    }
  };

  // src/render/ground.ts
  function hash2(x, y, seed) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 2246822519 | 0) >>> 0;
    h = Math.imul(h ^ h >>> 13, 1274126177) >>> 0;
    h = (h ^ h >>> 16) >>> 0;
    return (h & 65535) / 65535;
  }
  function valueNoise(px, py, scale2, seed) {
    const fx = px / scale2;
    const fy = py / scale2;
    const x0 = Math.floor(fx);
    const y0 = Math.floor(fy);
    const tx = fx - x0;
    const ty = fy - y0;
    const sx = tx * tx * (3 - 2 * tx);
    const sy = ty * ty * (3 - 2 * ty);
    const a = hash2(x0, y0, seed);
    const b = hash2(x0 + 1, y0, seed);
    const c = hash2(x0, y0 + 1, seed);
    const d = hash2(x0 + 1, y0 + 1, seed);
    return (a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy;
  }
  function fbm(px, py, scale2, seed, octaves) {
    let total = 0;
    let amp = 1;
    let norm = 0;
    for (let o = 0; o < octaves; o++) {
      total += amp * valueNoise(px, py, scale2 / 2 ** o, seed + 17 * o);
      norm += amp;
      amp *= 0.5;
    }
    return total / norm;
  }
  var hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  var EARTH = [hex("#352c38"), hex("#3e3442"), hex("#473c4a")];
  var STONE = hex("#4b4560");
  var STONE_HI = hex("#5a5372");
  var JOINT = hex("#221d2c");
  var PEBBLES = [hex("#9c94a8"), hex("#766e84"), hex("#4e4758")];
  var WATER = hex("#2f4f7e");
  var WATER_DEEP = hex("#24365a");
  var WATER_RIM = hex("#6a9ad0");
  var WATER_SPARK = hex("#a8d0f0");
  var WATER_RIPPLE = hex("#3d6596");
  var T = 16;
  var scale = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  function earth(px, py, seed) {
    const n = fbm(px, py, 6, seed, 2);
    const c = EARTH[n < 1 / 3 ? 0 : n < 2 / 3 ? 1 : 2];

            pickedChoice = { kind: "path", id: path.id };
            renderCharacter();
          });
        }
        pathCards.push(card);
      }
      note = game.canChoosePath() ? "Choix d\xE9finitif" : `Voie \xE0 choisir au niveau ${PATH_LEVEL}`;
      $("char-powers-title").hidden = true;
    } else {
      const path = PATHS[game.voie];
      const main = el("div", "skill-card main owned");
      const body = el("div", "");
      const uses = game.voie === "blue" ? game.perks().secondWind ? " (d\xE9j\xE0 utilis\xE9 \xE0 cet \xE9tage)" : " (pr\xEAt)" : game.voie === "red" ? ` (${game.perks().doubleStrikes} \xE0 cet \xE9tage)` : "";
      body.append(el("b", "", path.name), document.createTextNode(path.description + uses));
      main.append(buildIcon(PATH_ICONS[path.id]), body);
      pathCards.push(main);
      $("char-powers-title").hidden = false;
      const picks = game.secondaryPicks();
      path.secondaries.forEach((sk) => {
        const owned = game.skills.includes(sk.id);
        const picked = pickedChoice?.kind === "skill" && pickedChoice.id === sk.id;
        const available = !owned && picks > 0;
        const card = el("div", `skill-card${owned ? " owned" : ""}${picked ? " picked" : ""}${!owned && !available ? " locked" : ""}`);
        card.append(el("b", "", sk.name), document.createTextNode(sk.description));
        if (owned) card.append(el("div", "", "Acquis"));
        else if (!available) card.append(el("div", "", `Niveau ${SECONDARY_LEVELS[Math.min(game.skills.length, SECONDARY_LEVELS.length - 1)]}`));
        if (available) {
          card.addEventListener("click", () => {
            sfx.play("click");
            pickedChoice = { kind: "skill", id: sk.id };
            renderCharacter();
          });
        }
        powerCards.push(card);
      });
      if (picks > 0) note = `${picks} pouvoir${picks > 1 ? "s" : ""} \xE0 choisir`;
    }
    $("char-path").replaceChildren(...pathCards);
    $("char-skills").replaceChildren(...powerCards);
    $("char-note").textContent = note;
    confirm.hidden = pickedChoice === null;
    confirm.textContent = pickedChoice?.kind === "path" ? "Choisir cette voie (d\xE9finitif)" : "Choisir ce pouvoir";
  }
  function throwCells(uid) {
    const cells = [];
    for (let y = game.hero.y - 6; y <= game.hero.y + 6; y++) {
      for (let x = game.hero.x - 6; x <= game.hero.x + 6; x++) {
        if ((x !== game.hero.x || y !== game.hero.y) && game.throwRefusal(uid, x, y) === null) cells.push({ x, y });
      }
    }
    return cells;
  }
  button("found-close", () => {
    foundOpen = false;
    $("found").hidden = true;
  });
  button("bag-close", () => {
    bagOpen = false;
    $("bag").hidden = true;
  });
  var codexTab = "objets";
  function codexCard(shape, color, name, kind, description) {
    const card = el("div", "item-card");
    const picture = el("div", "item-card-icon");
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.classList.add("codex-glyph");
    const mark = document.createElementNS(ns, shape === "diamond" ? "polygon" : "rect");
    if (shape === "diamond") mark.setAttribute("points", "8,1 15,8 8,15 1,8");
    else for (const [k, v] of [["x", "3"], ["y", "3"], ["width", "10"], ["height", "10"]]) mark.setAttribute(k, v);
    mark.setAttribute("fill", color);
    svg.append(mark);
    picture.append(svg);
    const body = el("div", "item-card-body");
    body.append(el("div", "item-card-name", name), el("div", "item-card-kind", kind), el("div", "item-card-desc", description));
    card.append(picture, body);
    return card;
  }
  function renderCodex() {
    const nodes = [];
    const section = (title, total, cards) => {
      nodes.push(el("h3", "", `${title} \xB7 ${cards.length} / ${total}`));
      if (cards.length === 0) nodes.push(el("div", "codex-empty", total ? "Rien de rencontr\xE9 pour l'instant." : "Rien encore."));
      nodes.push(...cards);
    };
    if (codexTab === "objets") {
      const groups = [
        ["Armes de corps \xE0 corps", ["melee"]],
        ["Armes \xE0 distance et munitions", ["ranged", "ammo"]],
        ["Armures", ["armor"]],
        ["Heaumes", ["hat"]],
        ["Amulettes", ["amulet"]],
        ["Artefacts", ["artifact"]],
        ["Sacs", ["bag"]],
        ["Potions et vivres", ["use"]],
        ["Pierres pr\xE9cieuses et or", ["gem", "gold"]],
        ["Divers", ["key"]]
      ];
      for (const [title, kinds] of groups) {
        const all = Object.values(ITEMS).filter((d) => kinds.includes(d.kind));
        const cards = all.filter((d) => codex.has(d.id)).map((def) => {
          const owners = Object.values(CLASSES).filter((c) => c.startingItems.some((s) => s.item === def.id)).map((c) => c.name);
          return itemCard(def, 1, owners.length ? ` \u2014 d\xE9part : ${owners.join(", ")}` : "");
        });
        section(title, all.length, cards);
      }
    } else if (codexTab === "creatures") {
      const all = Object.values(MONSTERS);
      for (const family of [...new Set(all.map((m) => m.family))]) {
        const members = all.filter((m) => m.family === family);
        const cards = members.filter((m) => codex.has(`m:${m.id}`)).map((m) => codexCard("diamond", m.color, m.name, "Cr\xE9ature", m.description));
        section(`Famille : ${family}`, members.length, cards);
      }
    }
    $("codex-list").replaceChildren(...nodes);
    $("codex-tabs").replaceChildren(
      ...[["objets", "Objets"], ["creatures", "Cr\xE9atures"]].map(([tab, label]) => {
        const b = el("button", tab === codexTab ? "active" : "", label);
        b.type = "button";
        b.addEventListener("click", () => {
          codexTab = tab;
          sfx.play("click");
          renderCodex();
        });
        return b;
      })
    );
  }
  var codexSeenAt = -1;
  function discoverSurroundings() {
    const stamp = game.depth * 1e5 + game.turn;
    if (stamp === codexSeenAt) return;
    codexSeenAt = stamp;
    const found = game.visibleMonsters().map((m) => `m:${m.defId}`);
    discover(found);
  }
  function showScreen(screen) {
    menuOpen = screen !== null;
    menu.hidden = !menuOpen;
    for (const name of ["main", "new", "settings", "codex"]) $(`screen-${name}`).hidden = screen !== name;
    $("detail").hidden = true;
    $("menu-resume").hidden = (!started || game.over) && savedRun === null;
    $("settings-sound").textContent = `Sons : ${options.sound ? "activ\xE9s" : "d\xE9sactiv\xE9s"}`;
    if (screen === "new") renderCards();
    if (screen === "codex") renderCodex();
  }
  var signedBonus = (n) => n >= 0 ? `+${n}` : `${n}`;
  function raceCard(r) {
    return {
      id: r.id,
      name: r.name,
      available: r.available,
      tagline: r.tagline,
      basics: [`PV ${signedBonus(r.hpBonus)}`, `Vue ${r.darkVision} / ${r.sight}`],
      details: [
        r.tagline,
        `Points de vie : ${signedBonus(r.hpBonus)}`,
        `Vue dans le noir : ${r.darkVision} cases`,
        `Vue des zones \xE9clair\xE9es : ${r.sight} cases`,
        `Trait \u2014 ${r.trait}`
      ]
    };
  }
  function classCard(c) {
    const gear = c.startingItems.map((g) => ({ def: ITEMS[g.item], count: g.count }));
    const weapons = gear.filter((g) => g.def.kind === "melee" || g.def.kind === "ranged");
    const armorClass = gear.find((g) => g.def.armorClass)?.def.armorClass ?? UNARMORED_AC;
    return {
      id: c.id,
      name: c.name,
      available: c.available,
      tagline: c.tagline,
      basics: [`PV ${c.hp} \xB7 CA ${armorClass}`, weapons.map((g) => g.def.name).join(" \xB7 ")],
      details: [
        c.tagline,
        `Points de vie : ${c.hp}`,
        `Crocheter une serrure : d20 ${signedBonus(c.lockpickBonus)}`,
        `Enfoncer une porte : d20 ${signedBonus(c.breakBonus)}`,
        "\xC9quipement de d\xE9part :",
        ...gear.map((g) => {
          const d = g.def;
          if (d.armorClass) return `\u2022 ${d.name} : classe d'armure ${d.armorClass}`;
          if (d.attackBonus === void 0 || !d.damage) return `\u2022 ${d.name} \xD7${g.count}`;
          return `\u2022 ${d.name} : d20 ${signedBonus(d.attackBonus)}, d\xE9g\xE2ts ${diceLabel(d.damage)}${d.range ? `, port\xE9e ${d.range} cases` : ""}`;
        }),
        `Style \u2014 ${c.trait}`
      ]
    };
  }
  function el(tag, className, text = "") {
    const node = document.createElement(tag);
    node.className = className;
    node.textContent = text;
    return node;
  }
  function buildCards(container, cards, selectedId, onSelect) {
    container.replaceChildren(
      ...cards.map((card) => {
        const node = el("div", `card${card.available ? "" : " locked"}${card.id === selectedId ? " selected" : ""}`);
        const more = el("button", "more", "+");
        more.setAttribute("aria-label", `D\xE9tail : ${card.name}`);
        more.addEventListener("click", (e) => {
          e.stopPropagation();
          sfx.play("click");
          showDetail(card);
        });
        node.append(more, el("div", "card-name", card.name), ...card.basics.map((line) => el("div", "card-info", line)));
        if (!card.available) node.append(el("div", "card-soon", "Bient\xF4t"));
        node.addEventListener("click", () => {
          if (!card.available) return;
          sfx.play("click");
          onSelect(card.id);
          renderCards();
        });
        return node;
      })
    );
  }
  function renderCards() {
    buildCards($("race-cards"), Object.values(RACES).map(raceCard), chosenRace.id, (id) => {
      chosenRace = RACES[id];
    });
    buildCards($("class-cards"), Object.values(CLASSES).map(classCard), chosenClass.id, (id) => {
      chosenClass = CLASSES[id];
    });
  }
  function showDetail(card) {
    $("detail-title").textContent = card.name;
    const lines = card.available ? card.details : [...card.details, "Pas encore jouable : valeurs provisoires."];
    $("detail-body").replaceChildren(...lines.map((line) => el("div", "", line)));
    $("detail").hidden = false;
  }
  button("open-menu", () => showScreen("main"));
  button("menu-resume", () => {
    if ((!started || game.over) && savedRun) {
      resumeRun(savedRun);
      savedRun = null;
    }
    showScreen(null);
  });
  button("menu-new", () => showScreen("new"));
  button("menu-settings", () => showScreen("settings"));
  button("menu-codex", () => showScreen("codex"));
  button("codex-back", () => showScreen("main"));
  button("new-back", () => showScreen("main"));
  button("settings-back", () => showScreen("main"));
  button("detail-close", () => {
    $("detail").hidden = true;
  });
  button("new-start", () => {
    newRun();
    started = true;
    showScreen(null);
  });
  button("wake-all", () => {
    game.wakeAll();
    logLines.push("Tous les monstres se r\xE9veillent et foncent sur vous !");
    renderLog();
  });
  button("peace", () => {
    game.setPeaceful(!game.peaceful);
    $("peace").textContent = game.peaceful ? "Combats : non" : "Combats : oui";
    logLines.push(game.peaceful ? "Combats coup\xE9s : les monstres sont retir\xE9s." : "Combats r\xE9tablis : les monstres reviennent.");
    renderLog();
  });
  button("alarm-up", () => {
    game.raiseAlarm(25);
    collectEvents();
  });
  button("level-up", () => {
    game.levelUpNow();
    collectEvents();
  });
  button("menu-sandbox", () => {
    newRun(true);
    started = true;
    showScreen(null);
  });
  button("settings-sound", () => {
    options.sound = !options.sound;
    sfx.enabled = options.sound;
    saveOptions();
    sfx.play("click");
    showScreen("settings");
  });
  var last = performance.now();
  function frame(now) {
    const dt = Math.min(now - last, 100);
    last = now;
    advanceCues(dt);
    dieIdle = cue || queue.length > 0 ? 0 : dieIdle + dt;
    if (dieIdle >= DIE_CLEAR_MS && die.textContent !== "") clearDie();
    if (stepping) {
      stepTime += dt;
      if (stepTime >= stepMs) {
        stepTime -= stepMs;
        stepping = false;
        if (game.takeStairs()) {
          renderer.snapTo(game);
          collectEvents();
        }
      }
    }
    if (!stepping && !cue && queue.length === 0 && !menuOpen && !bagOpen && !foundOpen && !wheelOpen) {
      shownHp = game.hero.hp;
      if (game.visibleMonsters().length > 0) stepMs = Math.max(stepMs, COMBAT_STEP_MS);
      const before = { x: game.hero.x, y: game.hero.y };
      if (game.tick()) {
        stepping = true;
        if (game.hero.x !== before.x || game.hero.y !== before.y) sfx.play("step");
        collectEvents();
        if (game.over) eraseSave(game.sandbox);
        else writeSave();
      } else {
        stepTime = 0;
      }
    }
    if (!menuOpen) {
      let fire = 0;
      for (const t of game.torches) {
        if (!t.hearth || t.lit === false || !game.isVisible(t.x + t.faceX, t.y + t.faceY)) continue;
        const d = Math.hypot(t.x - game.hero.x, t.y - game.hero.y);
        fire = Math.max(fire, 1 - d / 8);
      }
      sfx.fireplace(fire, dt);
    }
    if ((!jumpMode || game.disengageRefusal() !== null) && !pushMode && throwUid === null) {
      jumpMode = false;
      renderer.jumpCells = [];
    }
    diceBox.classList.toggle("ready", !game.over && game.meleeTarget() !== null);
    if (!cue && queue.length === 0 && die.textContent === "") {
      const hint = game.meleeTarget() && !game.over ? "Frapper" : "";
      if (dieWho.textContent !== hint && (hint || dieWho.textContent === "Frapper")) dieWho.textContent = hint;
    }
    if (started) discoverSurroundings();
    const aimRange = aimMode && game.arrows() > 0 ? game.weapon("ranged")?.range ?? null : null;
    renderer.draw(game, stepping ? Math.min(stepTime / stepMs, 1) : 1, dt, ghosts, aimRange, aimRange !== null ? aimTarget() : null);
    $("bag-bang").hidden = !game.hasPendingChoice() || game.over;
    $("open-bag").classList.toggle("pending", game.hasPendingChoice() && !game.over);
    renderAlarm();
    renderHeroStatus();
    const floorText = String(game.depth);
    if ($("floor-num").textContent !== floorText) $("floor-num").textContent = floorText;
    hpFill.style.width = `${100 * shownHp / game.hero.maxHp}%`;
    renderHere();
    $("hp-label").textContent = `PV ${shownHp}/${game.hero.maxHp}`;
    $("xp-fill").style.width = `${100 * game.xp / game.xpToNext()}%`;
    $("xp-label").textContent = `Niv ${game.level} \xB7 XP ${game.xp}/${game.xpToNext()}`;
    const doorOptions = game.doorOptions();
    doorActions.hidden = doorOptions.length === 0 || game.over || cue !== null || game.usingKey();
    $("door-key").hidden = !doorOptions.includes("key");
    $("door-pick").hidden = !doorOptions.includes("pick");
    $("door-break").hidden = !doorOptions.includes("break");
    if (game.pendingDoor && !doorWasPending && !game.usingKey()) {
      renderer.addSlash(game.hero.id, game.hero.x, game.hero.y, game.pendingDoor.x, game.pendingDoor.y, "", false);
      sfx.play("knock");
    }
    doorWasPending = game.pendingDoor !== null;
    $("recenter").hidden = !renderer.isPanned();
    const bow = game.weapon("ranged");
    const aim = $("aim");
    aim.hidden = !bow;
    if (!bow) aimMode = false;
    if (aimMode && game.isThreatened()) {
      aimMode = false;
      logLines.push("Ennemi au contact : vous reprenez votre arme de corps \xE0 corps.");
      renderLog();
    }
    const ammo = game.currentAmmo();
    const aimKey = `${bow?.id}|${ammo}|${game.arrows()}`;
    if (aimKey !== aimShown) {
      aimShown = aimKey;
      aim.replaceChildren(ammo && ammo !== "fleche" ? itemIcon(ammo) : uiIcon("arrow"), document.createTextNode(`\xD7${game.arrows()}`));
    }
    aim.classList.toggle("active", aimMode);
    renderPower();
    requestAnimationFrame(frame);
  }
  savedRun = readSave();
  setupRun(new Game(Math.floor(Math.random() * 4294967295), chosenRace, chosenClass), null);
  showScreen("main");
  requestAnimationFrame(frame);
  window.leutenheim = { game: () => game, renderer: () => renderer };
})();

</script>
</body>
</html>
