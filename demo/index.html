<style>
  /* Interface rétro : police à gros pixels, angles droits, cadres biseautés, pas d'arrondis ni de transparences douces. */
  :root {
    --ink: #e8dcc0; --dim: #9c8f74; --gold: #e0b040; --panel: #1b1612; --panel-hi: #5a4a2a; --panel-lo: #0c0906;
    --btn: #3b2f20; --btn-hi: #7a6238; --btn-lo: #17110a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #070605; color: var(--ink);
    font-family: "VT323", "Courier New", ui-monospace, monospace; font-size: 18px; line-height: 1.1; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas, button, .card { outline: none; }
  /* Format téléphone partout : largeur d'un téléphone (420 px au plus), toute la hauteur disponible (900 px au plus).
     Sur PC, la colonne ne dépend plus de la hauteur de la fenêtre : les menus gardent toujours la même largeur. */
  .col { position: relative; width: min(100%, 420px); height: min(calc(100vh - 12px), 900px); height: min(calc(100dvh - 12px), 900px); display: flex; flex-direction: column; gap: 6px; }
  [hidden] { display: none !important; }

  /* Cadre biseauté commun aux panneaux. */
  .panel, .hp, #menu, #bag, #detail, #over {
    border: 3px solid var(--panel-hi); box-shadow: inset 0 0 0 2px var(--panel-lo), 0 0 0 2px var(--panel-lo); }

  /* Jauges de vie et d'expérience, avec le bouton du menu à leur droite. */
  .gauges { display: flex; gap: 6px; align-items: stretch; }
  .gauges-col { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  /* Ondes autour de la cloche d'alerte quand le palier change (Thomas, 2026-11-12). */
  .alarm-wave { position: fixed; width: 20px; height: 20px; margin: -12px 0 0 -12px; border: 2px solid; border-radius: 50%; pointer-events: none; z-index: 60; opacity: 0;
    animation: alarmWave 0.9s steps(8) forwards; box-shadow: 0 0 6px currentColor; }
  @keyframes alarmWave { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(3.4); opacity: 0; } }
  #alarm-bell.ring { animation: bellRing 0.6s steps(6); transform-origin: 50% 10%; }
  @keyframes bellRing { 0% { transform: rotate(0); } 20% { transform: rotate(-22deg); } 45% { transform: rotate(18deg); } 70% { transform: rotate(-10deg); } 100% { transform: rotate(0); } }
  #alarm-badge { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 2px; background: none; box-shadow: none; }
  #alarm-bell svg { width: 30px; height: 30px; display: block; }
  .alarm-bar { display: block; width: 30px; height: 5px; background: #281e14; }
  #alarm-fill { display: block; height: 100%; width: 0; }
  @keyframes bang-blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.25); } }
  /* Tout le bouton du héros clignote quand un choix l'attend (Thomas : pas seulement le « ! »). */
  @keyframes hero-blink { 0%, 100% { background-color: #3a2e1c; box-shadow: inset 0 0 0 2px var(--gold); } 50% { background-color: #8a6a26; box-shadow: inset 0 0 0 3px #ffd75e; } }
  #power.off { filter: grayscale(1) brightness(0.6); }
  #open-bag.pending { animation: hero-blink 0.9s ease-in-out infinite; }
  #floor-badge { flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; color: var(--gold); font-size: 30px; line-height: 1; }
  #floor-icon svg { width: 30px; height: 30px; display: block; }
  #open-menu { flex: none; width: 46px; padding: 4px; display: flex; align-items: center; justify-content: center; }
  #open-menu svg { height: 26px; width: auto; }
  #hud-text { font-size: 19px; text-align: center; letter-spacing: 0.04em; color: var(--gold); text-transform: uppercase; }
  .hp { position: relative; height: 18px; background: #2a0c10; padding: 0; }
  /* Petites animations : la barre de vie tressaute et blanchit quand on est blessé, la jauge d'expérience
     s'illumine quand on en gagne, et les deux jauges glissent vers leur nouvelle valeur par crans. */
  #hp-fill, #xp-fill { transition: width 0.3s steps(6); }
  .hp.hit { animation: hpHit 0.36s steps(6); }
  @keyframes hpHit { 0% { transform: translateX(0); filter: brightness(2.4); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); filter: brightness(1.6); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(2px); filter: brightness(1.2); } 100% { transform: none; filter: none; } }
  .hp.xp.gain { animation: xpGain 0.5s steps(6); }
  @keyframes xpGain { 0% { filter: brightness(2.6); transform: scaleY(1.7); } 60% { filter: brightness(1.6); transform: scaleY(1.2); } 100% { filter: none; transform: none; } }
  .hp:not(.xp).gain { animation: hpGain 0.5s steps(6); }
  @keyframes hpGain { 0% { filter: brightness(1.8); } 100% { filter: none; } }
  .frame.hurt::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 6px rgba(208, 58, 68, 0.85); animation: hurt 0.32s steps(4) forwards; }
  @keyframes hurt { to { opacity: 0; } }
  .hp span { position: absolute; inset: 0; text-align: center; font-size: 16px; line-height: 12px; color: #fff; text-shadow: 1px 1px 0 #000; text-transform: uppercase; }
  .hp.xp { height: 14px; background: #0c1626; }
  /* Niveau maximal de la section : jauge grisée et petit panneau « stop » au bout (Thomas, 2026-11-12). */
  #xp-stop { position: absolute; right: -6px; top: 50%; width: 22px; height: 22px; margin-top: -11px; z-index: 2; cursor: pointer; }
  #xp-stop[hidden] { display: none; }
  #xp-stop svg { width: 100%; height: 100%; display: block; }
  .hp.xp.capped #xp-fill { background: repeating-linear-gradient(to right, #6a7fa0 0 6px, #4a5a76 6px 8px); }
  .hp.xp span { font-size: 14px; line-height: 8px; color: #cfe6ff; }
  #xp-fill { height: 100%; width: 0; background: repeating-linear-gradient(to right, #3a7bd0 0 6px, #24508e 6px 8px); }
  #hp-fill { height: 100%; width: 100%; background: repeating-linear-gradient(to right, #c8323c 0 6px, #8e1f28 6px 8px); }
  /* La carte prend toute la hauteur qui reste entre les jauges et le panneau du dé. */
  .frame { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; background: #070605; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; image-rendering: pixelated; }

  /* Boutons : pavés biseautés, texte en capitales. */
  button { font: inherit; font-size: 19px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); cursor: pointer; white-space: nowrap;
    background: var(--btn); border: 0; border-radius: 0; padding: 7px 10px;
    box-shadow: inset 2px 2px 0 var(--btn-hi), inset -2px -2px 0 var(--btn-lo), 0 0 0 2px var(--panel-lo); }
  button:active { box-shadow: inset -2px -2px 0 var(--btn-hi), inset 2px 2px 0 var(--btn-lo), 0 0 0 2px var(--panel-lo); transform: translateY(1px); }
  button.active { background: #6b4a12; color: #fff3c8; }
  button.ghost { background: #241c14; color: var(--dim); }

  .overlay { position: absolute; inset: 0; background: #0d0a08; display: flex; flex-direction: column;
    align-items: center; justify-content: center; justify-content: safe center; gap: 12px; text-align: center; padding: 16px;
    overflow-x: hidden; overflow-y: auto; }
  #over { inset: 14% 6%; background: #140808; border-color: #7a2a2a; font-size: 22px; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  #over .over-title { font-size: 34px; color: #ff6b7a; }
  /* Billes d'expérience : du monstre vaincu à la jauge (Thomas). */
  .rarity-pip { width: 12px; height: 12px; shape-rendering: crispEdges; display: inline-block; vertical-align: middle; margin: 0 6px 2px 0; flex: none; }
  /* Logo D2 et titre T6 (Thomas, 2026-11-13) : agrandis d'un facteur ENTIER, sans lissage (emblème 64 px ×2, titre
     100 × 41 px ×3) ; aucun arrondi. */
  #title-logo { width: 128px; height: 128px; image-rendering: pixelated; display: block; margin: 0 auto 4px; }
  #title-word { width: 300px; height: 123px; image-rendering: pixelated; display: block; margin: 0 auto; }
  .title-demo { text-shadow: none; display: block; font-size: 0.4em; letter-spacing: 0.3em; color: var(--dim); margin-top: 2px; text-transform: lowercase; }
  .xp-orb { position: fixed; width: 7px; height: 7px; margin: -3px 0 0 -3px; background: #9fd0f4; box-shadow: 0 0 6px 2px rgba(110,180,255,0.8), inset -1px -1px 0 #4a8fd0; pointer-events: none; z-index: 50; }
  .alarm-orb { position: fixed; width: 6px; height: 6px; margin: -3px 0 0 -3px; box-shadow: 0 0 5px 1px currentColor, inset -1px -1px 0 rgba(0,0,0,0.45); pointer-events: none; z-index: 50; }
  .hp-orb { position: fixed; width: 7px; height: 7px; margin: -3px 0 0 -3px; background: #ff5a5a; box-shadow: 0 0 5px 1px rgba(255,60,60,0.7), inset -1px -1px 0 #8a1420; pointer-events: none; z-index: 50; }
  #shop { justify-content: flex-start; overflow-y: auto; text-align: center; }
  #shop .hero-tabs { justify-content: center; margin-right: 0; width: 100%; }
  #shop .item-card-body { text-align: center; }
  body.shop-open .panel-wrap, body.shop-open .bar { display: none; }
  #shop h2 { color: var(--gold); margin: 34px 0 0; }
  #shop-line { color: var(--dim); font-size: 17px; text-align: center; margin: 2px 0 8px; }
  #settings-note { color: var(--dim); font-size: 16px; min-height: 20px; }
  #talk { justify-content: flex-start; overflow-y: auto; text-align: center; gap: 8px; padding-top: 8px; z-index: 5; }
  /* Conversation : elle couvre la carte seulement ; le dé et le journal restent dessous (Thomas). */
  body.talk-open .bar, body.talk-open #here { display: none; }
  /* La croix reste toujours visible, même quand la conversation défile (Thomas). */
  #talk-close { position: sticky; top: 0; align-self: flex-end; flex: none; margin: 0 -6px -48px 0; }
  #talk h2 { color: var(--gold); margin: 4px 0 0; }
  #talk-face svg { width: 72px; height: 72px; display: block; margin: 0 auto; }
  .talk-choice.off { color: var(--dim); background: #241c14; }
  #talk-lines { box-sizing: border-box; width: min(100%, 330px); display: flex; flex-direction: column; gap: 6px; margin: 4px 0 8px; }
  .talk-line { box-sizing: border-box; overflow-wrap: anywhere; color: #fff3c8; font-size: 18px; line-height: 1.1; text-align: left; background: #2a2014; box-shadow: inset 0 0 0 2px #6a5a3a; padding: 6px 8px; }
  .talk-line.me { color: var(--dim); background: transparent; box-shadow: none; font-style: italic; }
  .talk-roll { font-size: 18px; padding: 4px 8px; box-shadow: inset 0 0 0 2px #6a5a3a; }
  .talk-roll.ok { color: #7ee07a; }
  .talk-roll.ko { color: #ff7a7a; }
  #talk-purse { color: #ffd75e; font-size: 17px; margin: 2px 0 6px; }
  #talk-choices { box-sizing: border-box; width: min(100%, 330px); display: flex; flex-direction: column; gap: 6px; }
  .talk-choice { font-size: 18px; text-align: left; padding: 8px 10px; width: 100%; box-sizing: border-box; white-space: normal; overflow-wrap: anywhere; line-height: 1.05; }
  .talk-stat { color: var(--dim); font-size: 14px; display: block; }
  #shop-purse { color: #ffd75e; font-size: 18px; margin: 6px 0; }
  .shop-wares { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: min(100%, 318px); }
  .shop-ware { display: flex; flex-direction: column; align-items: center; padding: 6px 4px; background: #241c14; box-shadow: inset 2px 2px 0 #4a3e2a, inset -2px -2px 0 #0c0906; color: #fff3c8; font-family: inherit; border: none; cursor: pointer; }
  .shop-ware.picked { box-shadow: inset 0 0 0 3px #ffd75e; background: #4a3814; }
  .shop-ware.dear .shop-price { color: #ff8a7a; }
  .shop-icon svg { width: 44px; height: 44px; display: block; }
  .shop-row .shop-icon svg { width: 32px; height: 32px; }
  .shop-name { font-size: 14px; text-align: center; line-height: 1.1; }
  .shop-price { color: #ffd75e; font-size: 16px; }
  .shop-sell { display: flex; flex-direction: column; gap: 4px; width: min(100%, 318px); overflow-y: auto; max-height: 52vh; }
  .shop-row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; background: #241c14; }
  .shop-row .shop-name { flex: 1; text-align: center; }
  .shop-act { font-size: 16px; padding: 4px 8px; }
  #shop-detail { width: min(100%, 318px); display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; }
  .shop-empty, .shop-note { color: var(--dim); font-size: 16px; text-align: center; }
  .shop-note { color: #ff8a7a; }
  #over.over-win { background: #0e1408; border-color: #8a7a2a; }
  #over.over-win .over-title { color: #ffd75e; }
  #over .over-best { color: #ffd75e; font-size: 26px; }
  #over .over-sub { margin-top: 8px; color: #e0c890; }
  .over-record { font-size: 17px; color: #d8cfc0; }
  #codex-list .manual-intro, #codex-list .manual-entry { align-self: stretch; text-align: left; }
  #codex-list .manual-intro { color: var(--dim); font-size: 16px; margin: 0 0 6px; }
  #codex-list .manual-entry { margin: 6px 0; font-size: 17px; line-height: 1.25; }
  #codex-list .manual-entry b { color: var(--gold); font-weight: normal; }
  /* Gestionnaire de sauvegardes (Thomas, 2026-11-12) : une carte par partie, pictos de race et de classe. */
  #saves-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .save-card { display: flex; align-items: center; gap: 8px; background: var(--panel); padding: 8px; box-shadow: inset 0 0 0 1px var(--panel-hi); text-align: left; }
  .save-card .save-pictos { display: flex; flex-direction: column; gap: 3px; flex: none; }
  .save-card .save-pictos svg { width: 34px; height: 34px; shape-rendering: crispEdges; }
  .save-card .save-text { flex: 1; min-width: 0; font-size: 16px; line-height: 1.15; }
  .save-card .save-title { color: var(--gold); font-size: 18px; }
  .save-card .save-when { color: var(--dim); }
  .save-card .save-buttons { display: flex; flex-direction: column; gap: 4px; flex: none; }
  .save-card .save-buttons button { min-width: 0; margin: 0; padding: 4px 8px; font-size: 16px; }
  .save-card .save-buttons button.danger { background: #3a1414; color: #ff9a9a; }
  .save-card .save-buttons button.danger.armed { background: #8e1f28; color: #fff; }
  #records-list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
  /* Bandeau de la tâche de quête (Thomas, 2026-11-12) : sous les jauges, en haut de la carte. */
  #quest-banner { position: absolute; top: 6px; left: 6px; right: 44px; z-index: 2; padding: 3px 8px; text-align: left; font-size: 17px; line-height: 1.1; color: var(--gold); background: rgba(12, 9, 6, 0.86); border: 1px solid var(--panel-hi); box-shadow: inset 0 0 0 1px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #quest-banner::before { content: "◆ "; color: var(--dim); }
  #quest-banner.done { color: #fff1b8; border-color: var(--gold); }
  #quest-banner.done::before { color: var(--gold); }
  #quest-banner.flash { animation: quest-flash 0.9s ease-out 2; }
  @keyframes quest-flash { 0% { background: #8a6a26; } 100% { background: rgba(12, 9, 6, 0.86); } }
  #quest-banner:not([hidden]) ~ #hero-status { top: 34px; }
  #hero-status { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; z-index: 1; }
  #hero-status button { width: 30px; height: 30px; padding: 2px; display: flex; background: #1a140e; box-shadow: inset 0 0 0 2px #4a3e2a; }
  #hero-status svg { width: 100%; height: 100%; }
  #status-pop.right { left: auto; right: 6px; }
  #status-pop { position: absolute; top: 42px; left: 6px; z-index: 1; width: min(260px, 80%); padding: 8px; background: #241c14; box-shadow: inset 0 0 0 2px var(--gold); font-size: 17px; color: var(--dim); }
  #status-pop b { display: block; color: #fff3c8; font-weight: normal; font-size: 20px; text-transform: uppercase; }
  #test-tools { position: absolute; bottom: 8px; left: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #test-tools button { padding: 4px 8px; font-size: 18px; }
  #arena-tools { position: absolute; bottom: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  #arena-tools button { padding: 4px 8px; font-size: 18px; }
  body.frieze-on #arena-tools { bottom: 40px; }
  #recenter { position: absolute; top: 8px; right: 8px; padding: 6px; display: flex; }
  /* Reprendre un trajet interrompu (Thomas, 2026-11-13) : sous le bouton de recentrage. */
  #resume { position: absolute; top: 52px; right: 8px; padding: 6px; display: flex; z-index: 2; }
  #resume[hidden] { display: none; }
  #resume svg { width: 28px; height: 28px; }
  #recenter:active { transform: translateY(1px); }
  /* Actions (design C, Thomas 2026-11-12) : une barre de grandes touches qui monte au-dessus du dé, nom sous chaque
     pictogramme ; la carte reste visible ; toucher ailleurs referme. */
  #wheel { position: absolute; inset: 0; z-index: 3; display: flex; align-items: flex-end; }
  #wheel[hidden], #wheel button[hidden] { display: none; }
  #wheel-bar { flex: 1; min-width: 0; display: flex; gap: 5px; padding: 7px; margin: 0 6px 6px; background: rgba(14, 10, 8, 0.94);
    box-shadow: inset 0 0 0 2px #6a5a3a, 0 0 0 2px #120d08; }
  #wheel button { flex: 1 1 0; min-width: 0; height: 74px; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #wheel button svg { width: 40px; height: 40px; flex: none; }
  #wheel button .wheel-label { font-size: 16px; text-transform: none; letter-spacing: 0; line-height: 1; color: #f0e6c8; white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%; }
  #wheel button.off { background: #241c14; }
  #wheel button.off svg { filter: grayscale(1) brightness(0.6); }
  #wheel button.off .wheel-label { color: #8a8070; }
  #recenter svg { width: 28px; height: 28px; }
  #door-actions { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 8px; align-items: stretch; }
  .door-choices { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #door-actions button { background: #4a2f12; }
  /* La croix : renoncer à la porte sans rien tenter, et garder la main (utile si un ennemi arrive). */
  #door-actions #door-cancel { flex: none; width: 52px; padding: 8px; background: var(--btn); display: flex; align-items: center; justify-content: center; }
  #door-cancel svg { width: 100%; height: 100%; }

  /* Frise des jets (Thomas, 2026-11-13) : une bande au pied de la carte ; le premier jet se place à gauche, les suivants
     à sa droite ; quand la bande est pleine, elle défile et les plus vieux, de plus en plus transparents, sortent à
     gauche. On peut la faire défiler du doigt pour relire les anciens jets (ils redeviennent nets). Quelques pas sans
     jet et elle s'éteint, son historique avec, sauf si on est en train de la dérouler. */
  #dice-log { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; height: 32px; display: flex; flex-direction: row; justify-content: flex-start; align-items: center; gap: 3px;
    padding: 0 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; background: rgba(10, 8, 6, 0.75); transition: opacity 0.6s; }
  #dice-log::-webkit-scrollbar { display: none; }
  #dice-log:empty { display: none; }
  #dice-log.fade { opacity: 0; pointer-events: none; }
  #dice-log.open .rc { opacity: 1 !important; }
  /* Tout ce qui se pose au pied de la carte monte au-dessus de la frise quand elle est là (classe posée par le jeu) ;
     la languette de l'objet au sol reste DERRIÈRE la frise et glisse vers le haut ou le bas avec elle. */
  body.frieze-on #wheel-bar { margin-bottom: 38px; }
  body.frieze-on #door-actions,
  body.frieze-on #test-tools { bottom: 40px; }
  #dice-log .sep { flex: none; font-size: 22px; line-height: 1; color: var(--gold); margin: 0 1px; opacity: 0.8; }
  #dice-log .sep, #dice-log .rc { flex: none; }
  /* Le sens de lecture : les tours sont séparés par un chevron « › » qui pointe vers le plus récent. */
  #dice-log .rc { padding: 1px 4px 1px 1px; border-radius: 4px; background: rgba(30, 26, 20, 0.85); transition: opacity 0.3s; }
  #dice-log .rc.foe { background: rgba(100, 18, 12, 0.85); }
  .rc { display: flex; align-items: center; gap: 1px; flex: none; }
  .mini { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; font-size: 15px; color: #fff3c8; position: relative; isolation: isolate; flex: none;
    text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; }
  .mini::before { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: polygon(50% 0, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%); background: #3a2e1c; }
  .mini.hit::before { background: #24563f; } .mini.crit::before { background: #8a6a12; }
  .mini.miss { color: #9a917a; } .mini.miss::before { background: #2a2420; }
  .sd { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; font-size: 12px; color: #fff3c8; position: relative; isolation: isolate; flex: none;
    text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; }
  .sd::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #3c3a46; clip-path: inset(8% round 2px); }
  .sd.foe::before { background: #6a2216; }
  .sd.d4 { padding-top: 5px; } .sd.d4::before { clip-path: polygon(50% 4%, 96% 92%, 4% 92%); }
  .sd.d8::before { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .sd.d10::before { clip-path: polygon(50% 0, 100% 42%, 50% 100%, 0 42%); }
  .sd.d12::before { clip-path: polygon(50% 0, 98% 36%, 80% 96%, 20% 96%, 2% 36%); }
  .sd.more { width: auto; padding: 0 3px; font-size: 11px; }
  .rt { font-size: 16px; margin-left: 3px; color: #fff; }
  .rt.foe { color: #ff8a7a; } .rt.miss { color: #8a8070; }
  /* Dés et journal. */
  /* Objet au sol sous le héros (P3, Thomas 2026-11-13) : dans le panneau, à droite du d20, à la place du journal :
     l'objet, Ramasser, sa fiche, et une croix qui rend le journal (l'objet revient en remarchant sur la case). */
  .panel-wrap { position: relative; flex: none; }
  .panel-wrap .panel { position: relative; z-index: 1; }
  #here { display: none; flex: 1; min-width: 0; align-items: center; gap: 6px; }
  #here.open { display: flex; }
  .panel.picking #log { display: none; }
  #here-name { flex: 1; }
  #here-icon { width: 34px; height: 34px; flex: none; background: #0c0906; padding: 2px; }
  #here-icon svg { width: 100%; height: 100%; }
  #here-name { font-size: 18px; line-height: 1; color: #fff3c8; text-transform: uppercase; overflow: hidden; min-width: 0; max-height: 54px; }
  #here button { width: 38px; height: 38px; padding: 3px; flex: none; font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  #here button svg { width: 100%; height: 100%; }
  /* Taille FIXE : ni la hauteur du panneau ni la largeur de la zone du dé ne bougent, quel que soit le texte
     du journal ou le nombre de dés. Le journal trop long est coupé par le haut ; le second dé (avantage ou
     désavantage) se loge en petit dans le coin du premier au lieu d'élargir la zone. */
  .panel { display: flex; gap: 8px; align-items: stretch; height: 70px; flex: none; overflow: hidden; background: var(--panel); padding: 6px; }
  .dice { flex: 0 0 60px; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 0; cursor: pointer; }
  /* Un ennemi au contact : toucher le dé frappe au corps à corps (plus de cadre doré autour : Thomas, 2026-11-13). */
  .dice.ready #die-who { color: var(--gold); }
  .dice-row { display: flex; align-items: center; justify-content: center; gap: 2px; width: 60px; height: 100%; flex: none; }
  /* Panneau compact : le d20 un peu plus petit, centré, avec de l'air au-dessus et au-dessous. */
  .dice-row:not(.pair) .die { width: 50px; height: 50px; font-size: 24px; }
  /* Deux dés (avantage ou désavantage) : côte à côte, plus petits, dans la même zone. Le dé écarté s'estompe. */
  .dice-row.pair .die { width: 29px; height: 29px; font-size: 15px; }
  /* Dé à 20 faces vu de face, sans image : un hexagone (::before) dont les six secteurs sont ombrés différemment,
     et par-dessus un grand triangle (::after) découpé en quatre faces ; le chiffre s'inscrit sur la face centrale. */
  .die { --edge: #5a4a30; --face: #3a2e1c; --side: #2a2114; --low: #1c160c; --rim-a: #241c10; --rim-b: #17110a;
    position: relative; isolation: isolate; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
    font-size: 27px; color: var(--dim); text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
    filter: drop-shadow(1px 0 0 var(--edge)) drop-shadow(-1px 0 0 var(--edge)) drop-shadow(0 1px 0 var(--edge)) drop-shadow(0 -1px 0 var(--edge)); }
  .die::before, .die::after { content: ""; position: absolute; inset: 0; z-index: -1; }
  .die::before { clip-path: polygon(50% 0, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
    background: conic-gradient(var(--rim-a) 0 60deg, var(--rim-b) 0 120deg, var(--rim-a) 0 180deg, var(--rim-b) 0 240deg, var(--rim-a) 0 300deg, var(--rim-b) 0); }
  .die::after { clip-path: polygon(6.7% 25%, 93.3% 25%, 50% 100%);
    background: linear-gradient(to bottom, transparent 62.5%, var(--low) 0),
      linear-gradient(300deg, transparent 59.15%, var(--side) 0), linear-gradient(60deg, transparent 59.15%, var(--low) 0), var(--face); }
  .die.hit { --edge: #5fd38d; color: #8ff0b4; --face: #1f4a30; --side: #17382a; --low: #102a1e; }
  .die.miss { --edge: #8a8070; color: #d8ccb0; --face: #4a4334; --side: #383225; --low: #26221a; }
  .die.crit { --edge: var(--gold); color: #fff3c8; --face: #8a6410; --side: #6a4a0c; --low: #4a3408; --rim-a: #3a2a08; --rim-b: #2a1e06; }
  .die.foe { --rim-a: #3a1016; --rim-b: #2a0c10; }
  .die.rolling { --edge: #fff; color: #fff; --face: #6a5a40; --side: #4a3e2a; --low: #32291a; animation: roll 0.16s steps(4) infinite; }
  .die.land { animation: land 0.2s steps(3); }
  .die.dropped { opacity: 0.35; transform: scale(0.85); --edge: #4a3e2a; color: var(--dim); }
  @keyframes roll { 0% { transform: rotate(-14deg); } 25% { transform: rotate(10deg) translateY(-4px); }
    50% { transform: rotate(-8deg); } 75% { transform: rotate(12deg) translateY(3px); } 100% { transform: rotate(-14deg); } }
  @keyframes land { 0% { transform: scale(1.5); } 60% { transform: scale(0.9); } 100% { transform: scale(1); } }
  /* Panneau compact (Thomas, 2026-11-13) : la hauteur du seul d20 ; l'étiquette sous le dé est cachée, l'historique des jets la remplace. */
  #die-who { display: none; font-size: 13px; line-height: 12px; color: var(--dim); height: 24px; width: 84px; overflow: hidden; text-align: center; text-transform: uppercase; }
  #die-who.advantage { color: var(--gold); }
  #die-who.disadvantage { color: #ff6b7a; }
  #log { flex: 1; min-width: 0; min-height: 0; overflow: hidden; font-size: 16px; line-height: 1.05; color: var(--dim); display: flex; flex-direction: column; justify-content: flex-end; }
  #log div { flex: none; }
  #log div:last-child { color: var(--ink); }

  .bar { display: flex; align-items: stretch; gap: 5px; flex: none; height: 48px; }
  .bar button { flex: 1; padding: 8px 4px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .bar button { min-height: 0; height: 100%; font-size: 20px; white-space: nowrap; overflow: hidden; }
  .bar button svg { height: 28px; width: auto; flex: none; }

  /* Menus. */
  #menu { z-index: 2; }
  #menu section { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #menu h1 { margin: 0; font-size: min(56px, 11vw); font-weight: 400; letter-spacing: 0.08em; color: var(--gold); text-shadow: 3px 3px 0 #5a3a08; }
  #menu h2, #bag h2 { margin: 0 0 4px; font-size: 32px; font-weight: 400; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 2px 2px 0 #5a3a08; }
  #menu h3 { margin: 6px 0 0; font-size: 18px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); align-self: flex-start; }
  #menu p { margin: 0 0 14px; font-size: 18px; color: var(--dim); }
  #menu section > button, #detail > button { width: min(250px, 80%); padding: 10px; font-size: 22px; }
  #seed { font-size: 15px; color: #6a5f4a; margin-top: 8px; }
  /* minmax(0, 1fr) : les trois cases se partagent la largeur, même si un mot est long (sinon elles débordent). */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
  .card { position: relative; background: var(--panel); padding: 26px 4px 8px; min-height: 108px; cursor: pointer; text-align: center;
    border: 3px solid #4a3e2a; box-shadow: inset 0 0 0 2px var(--panel-lo); }
  .card.selected { border-color: var(--gold); background: #2a2010; }
  .card.locked { filter: grayscale(1) brightness(0.6); cursor: default; }
  /* Le nom tient sur une ligne même sur un petit téléphone (« MAGICIEN », « GUERRIER »). */
  .card-picto { width: min(56px, 13vw); height: min(56px, 13vw); display: block; margin: 0 auto 4px; shape-rendering: crispEdges; }
  .card-name { font-size: min(22px, 5vw); color: #fff3c8; margin-bottom: 2px; text-transform: uppercase; white-space: nowrap; }
  .card-info { font-size: min(16px, 4vw); color: var(--dim); }
  .card-soon { font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin-top: 2px; }
  .card .more { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; padding: 0; font-size: 22px; line-height: 1; }
  #detail { z-index: 3; }
  #detail-body { display: flex; flex-direction: column; gap: 4px; font-size: 18px; text-align: left; max-width: 310px; }
  #detail-body div:first-child { color: var(--dim); margin-bottom: 4px; }

  /* Sac : cases en creux, objets en gros pixels. */
  #bag { z-index: 2; }
  #bag-grid { --cols: 6; --rows: 4; position: relative; width: min(100%, 318px); aspect-ratio: var(--cols) / var(--rows);
    background-color: #0c0906; border: 3px solid var(--panel-hi); box-shadow: inset 0 0 0 2px var(--panel-lo); cursor: pointer;
    background-image: linear-gradient(to right, #2e261a 2px, transparent 2px), linear-gradient(to bottom, #2e261a 2px, transparent 2px);
    background-size: calc(100% / var(--cols)) calc(100% / var(--rows)); }
  .bag-item { position: absolute; padding: 5px; background: #241c14; box-shadow: inset 2px 2px 0 #4a3e2a, inset -2px -2px 0 #0c0906;
    display: flex; align-items: center; justify-content: center; }
  .bag-item svg { width: 100%; height: 100%; }
  /* Prise de l'arme : une paume (une main) ou deux (deux mains), dans le coin bas-droit. */
  .bag-item svg.grip, .slot-box svg.grip { position: absolute; right: 2px; bottom: 2px; width: auto; height: 12px; max-width: none; }
  .slot-box { position: relative; }
  .bag-item.spent svg { filter: grayscale(1) brightness(0.55); opacity: 0.6; }
  .bag-item.equipped { box-shadow: inset 0 0 0 2px #5fd38d; }
  .bag-item.quick::before { content: ""; position: absolute; z-index: 1; left: 0; top: 0; border-style: solid; border-width: 12px 12px 0 0; border-color: var(--gold) transparent transparent transparent; }
  #bag-grid { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .quick-note { color: var(--gold); margin-top: 3px; }
  .bag-item.selected { background: #3a2c14; box-shadow: inset 0 0 0 2px var(--gold); }
  .bag-count { position: absolute; right: 4px; bottom: 0; font-size: 20px; color: #fff; text-shadow: 2px 2px 0 #000; }
  /* Ce que le héros porte : amulette, heaume et artefact en haut, arme, armure, arc en bas. */
  #bag { gap: 6px; justify-content: flex-start; padding-top: 10px; }
  #bag h3 { margin: 2px 0 0; font-size: 18px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }
  #doll { display: grid; grid-template-columns: repeat(3, 76px); grid-template-areas: "amulet hat artifact" "melee armor ranged"; gap: 4px 10px; }
  .slot { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .slot-amulet { grid-area: amulet; } .slot-hat { grid-area: hat; } .slot-armor { grid-area: armor; }
  .slot-artifact { grid-area: artifact; } .slot-melee { grid-area: melee; } .slot-ranged { grid-area: ranged; }
  .slot-box { width: 64px; height: 64px; padding: 4px; background: #0c0906; border: 3px solid var(--panel-hi);
    box-shadow: inset 2px 2px 0 #000; display: flex; align-items: center; justify-content: center; }
  .slot-box svg { height: 100%; width: auto; max-width: 100%; }
  .slot.empty .slot-box { border-color: #3a3020; }
  .slot.selected .slot-box { border-color: var(--gold); background: #3a2c14; }
  .slot-box svg.ghost { opacity: 0.2; filter: grayscale(1) brightness(1.7); }
  /* Fiche d'objet : la même dans l'équipement et quand on trouve quelque chose. */
  /* Encyclopédie : toutes les fiches d'objets, rangées par genre, dans une liste qui défile. */
  #screen-codex { height: 100%; min-height: 0; }
  #codex-tabs { display: flex; gap: 6px; width: 100%; }
  #codex-tabs button { flex: 1; padding: 6px 2px; font-size: 18px; }
  #codex-tabs button.active { background: #4a3408; color: #fff3c8; border-color: var(--gold); }
  .codex-glyph { width: 40px; height: 40px; }
  #codex-list { flex: 1; min-height: 0; overflow-y: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-right: 2px; }
  #codex-list h3 { align-self: stretch; border-bottom: 2px solid var(--panel-hi); }
  .codex-empty { font-size: 16px; color: var(--dim); align-self: flex-start; }
  .item-card { display: flex; gap: 8px; text-align: left; width: min(100%, 318px); background: var(--panel); padding: 6px;
    border: 3px solid var(--panel-hi); box-shadow: inset 0 0 0 2px var(--panel-lo); }
  .item-card-icon { flex: 0 0 64px; height: 84px; background: #0c0906; box-shadow: inset 2px 2px 0 #000; padding: 4px; display: flex; align-items: center; justify-content: center; }
  .item-card-icon svg { max-width: 100%; max-height: 100%; }
  .item-card-body { flex: 1; min-width: 0; }
  .item-card-name { color: #fff3c8; font-size: 22px; text-transform: uppercase; }
  .item-card-kind { color: var(--gold); font-size: 15px; text-transform: uppercase; margin-bottom: 2px; }
  .item-card-stats { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; font-size: 17px; color: var(--dim); }
  .item-card-value { color: var(--ink); }
  .item-card-desc { font-size: 15px; color: var(--dim); margin-top: 3px; }
  #found { z-index: 2; background: rgba(13,10,8,0.92); }
  /* Synopsis au début d'une partie (Thomas, 2026-11-13) : les lignes apparaissent une à une ; toucher l'écran les montre
     toutes d'un coup ; « Descendre » lance la partie. */
  #intro { z-index: 7; background: #0a0806; gap: 28px; cursor: pointer; }
  #intro-lines { width: min(100%, 330px); display: flex; flex-direction: column; gap: 18px; text-align: left; }
  #intro-lines p { margin: 0; font-size: 21px; line-height: 1.2; color: var(--ink); opacity: 0; animation: intro-in 0.5s ease-out forwards; }
  #intro-lines p:last-child { color: var(--gold); }
  #intro.all #intro-lines p { animation: none; opacity: 1; }
  #intro-go { width: 220px; padding: 10px; font-size: 22px; opacity: 0; animation: intro-in 0.4s ease-out forwards; }
  #intro.all #intro-go { animation: none; opacity: 1; }
  @keyframes intro-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #found h2 { margin: 0; font-size: 32px; font-weight: 400; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 2px 2px 0 #5a3a08; }
  #found button { width: 220px; padding: 10px; font-size: 22px; }
  .hero-tabs { display: flex; width: min(100%, 318px); margin-right: 44px; }
  .hero-close { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; padding: 0; font-size: 26px; line-height: 1; z-index: 3; }
  #bag .slot-box { width: 56px; height: 56px; }
  #doll { grid-template-areas: "amulet hat artifact" "melee armor ranged" "quiver bag torch" !important; }
  .slot-torch { grid-area: torch; }
  /* La jauge de la torche : elle descend avec ses tours restants ; grisée quand la torche est éteinte. */
  .torch-gauge { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 6px; background: #1c140c; box-shadow: 0 0 0 1px #000; }
  .torch-gauge i { display: block; height: 100%; background: linear-gradient(#ffd75e, #e07a2a); }
  .slot-torch.off .torch-gauge i { background: #6a6050; }
  .slot-torch.off .slot-box svg { filter: grayscale(1) brightness(0.7); }
  .slot-quiver { grid-area: quiver; } .slot-bag { grid-area: bag; grid-column: auto; }
  .slot-box .slot-count { position: absolute; right: 2px; bottom: -4px; font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #000; }
  .slot-box { position: relative; }
  #bag-grid { max-height: 30vh; }
  #bag-info { min-height: 0; }
  .item-mini { position: relative; width: min(100%, 318px); padding: 6px 34px 6px 8px; background: #2a2014; box-shadow: inset 0 0 0 2px #6a5a3a; font-size: 16px; color: var(--dim); display: flex; gap: 8px; align-items: center; text-align: left; }
  .item-compare { font-size: 16px; line-height: 1.05; margin: 2px 0; }
  .item-compare.up { color: #7ee07a; }
  .item-compare.down { color: #ff7a7a; }
  .item-compare.same { color: #b8b0a0; }
  .item-mini > svg { width: 40px; height: 40px; flex: none; }
  .item-mini .t { color: #fff3c8; font-size: 19px; text-transform: uppercase; }
  .item-mini .s { color: var(--gold); font-size: 15px; }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; width: min(100%, 330px); font-size: 18px; text-transform: uppercase; color: var(--dim); }
  .char-grid .r { display: flex; align-items: center; gap: 4px; }
  .char-grid .r span { flex: 1; text-align: left; }
  .char-grid .r.wide { grid-column: 1 / -1; }
  .char-grid b { color: #fff3c8; font-weight: normal; }
  .char-grid button { width: 28px; height: 26px; padding: 0; font-size: 20px; line-height: 1; }
  .char-grid button.plus, .card .more { display: flex; align-items: center; justify-content: center; }
  .plus-icon { width: 12px; height: 12px; shape-rendering: crispEdges; }
  .char-sec { width: min(100%, 330px); font-size: 18px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 2px solid #3a2e1e; margin-top: 4px; }
  #char-path { width: min(100%, 330px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  #char-path .skill-card.main { grid-column: 1 / -1; }
  /* Choix de la voie : deux cartes, côte à côte et centrées (Thomas : « centre mieux les deux voies »). */
  #char-path.choose { grid-template-columns: repeat(2, 1fr); margin: 0 auto; }
  .hero-tab { flex: 1; padding: 6px 0; font-size: 22px; color: var(--dim); background: #1a140e; box-shadow: inset 2px 2px 0 #3a2e1e, inset -2px -2px 0 #0c0906; }
  .hero-tab.on { color: #fff3c8; background: #3a2c14; box-shadow: inset 0 0 0 2px var(--gold); }
  .bang { color: #ffd75e; margin-left: 6px; }
  #pane-inv, #pane-char { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  #pane-inv[hidden], #pane-char[hidden] { display: none; }
  .slot-bag { grid-column: 2; }
  .char-head { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .char-head svg { width: 44px; height: 25px; }
  #char-points { width: min(100%, 318px); padding: 6px 8px; color: #ffd75e; font-size: 20px; text-transform: uppercase; box-shadow: inset 0 0 0 2px var(--gold); background: #2a2010; text-align: center; }
  #char-points { display: flex; flex-wrap: wrap; justify-content: center; column-gap: 14px; font-size: 17px; }
  #char-points.idle { color: var(--dim); box-shadow: inset 0 0 0 1px var(--panel-hi); background: transparent; }
  #char-points .char-points-note { width: 100%; font-size: 14px; color: var(--dim); }
  #char-stats { width: min(100%, 318px); }
  .char-stat { display: flex; align-items: center; gap: 8px; font-size: 20px; text-transform: uppercase; color: var(--dim); margin: 3px 0; }
  .char-stat .n { flex: 1; text-align: left; }
  .char-stat .hint { display: block; font-size: 15px; color: #8a8070; text-transform: none; }
  .char-stat b { color: #fff3c8; font-weight: normal; min-width: 64px; text-align: right; }
  .char-plus { width: 34px; height: 30px; padding: 0; font-size: 24px; line-height: 1; }
  .char-sep { border-top: 2px solid #3a2e1e; margin: 6px 0; }
  #char-skills { width: min(100%, 318px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .skill-card { padding: 6px 4px; background: #241c14; box-shadow: inset 2px 2px 0 #4a3e2a, inset -2px -2px 0 #0c0906; text-align: center; font-size: 15px; color: var(--dim); line-height: 1.1; cursor: pointer; }
  .skill-card svg { width: 40px; height: 40px; display: block; margin: 0 auto 4px; }
  .skill-card b { display: block; font-size: 17px; color: #fff3c8; font-weight: normal; text-transform: uppercase; }
  .skill-card.owned { box-shadow: inset 0 0 0 2px var(--gold); background: #3a2c14; }
  .skill-card.picked { box-shadow: inset 0 0 0 3px #ffd75e; background: #4a3814; }
  .skill-card.locked { opacity: 0.45; cursor: default; }
  .skill-card.main { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; text-align: left; }
  .skill-card.main svg { margin: 0; }
  .skill-card { position: relative; }
  .skill-card .rank-now { color: #fff3c8; font-size: 15px; }
  .skill-card .rank-next { color: var(--dim); font-size: 13px; }
  .skill-card .rank-pips { display: flex; align-items: center; justify-content: center; gap: 3px; margin: 3px 0 2px; min-height: 18px; }
  .skill-card.main .rank-pips { justify-content: flex-start; }
  .skill-card .rank-pip { width: 12px; height: 12px; shape-rendering: crispEdges; display: block; margin: 0 !important; }
  .skill-card .rank-plus { width: 18px; height: 18px; padding: 0; margin-left: 4px; display: flex; align-items: center; justify-content: center; flex: none; }
  .skill-card .rank-plus .plus-icon { width: 8px; height: 8px; margin: 0 !important; }
  #char-note { font-size: 16px; color: #ff8a7a; text-align: center; width: min(100%, 318px); }
  #char-note:empty { display: none; }
  #bag-info .item-card { position: relative; padding-right: 34px; }
  .item-close { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; padding: 0; font-size: 18px; line-height: 1; }
  #char-xp { white-space: nowrap; color: var(--dim); margin-left: 10px; }
  #open-bag { position: relative; }
  #open-bag svg { width: 44px; height: 25px; }
  #bag-bang { position: absolute; right: 6px; top: 0; color: #ffd75e; font-size: 28px; text-shadow: 2px 2px 0 #000; }
  .bag-top { width: min(100%, 318px); display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: #fff3c8; text-transform: uppercase; }
  #bag-gold { display: flex; align-items: center; gap: 6px; color: var(--gold); font-size: 24px; }
  #bag-gold svg { width: 30px; height: 30px; }
  #bag-stats { width: min(100%, 318px); display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; font-size: 18px; color: var(--dim); text-transform: uppercase; }
  #bag-stats span { display: flex; justify-content: space-between; }
  #bag-stats b { color: #fff3c8; font-weight: normal; }
  #quiver { width: min(100%, 318px); display: flex; gap: 8px; align-items: center; }
  .quiver-item { position: relative; width: 52px; height: 52px; padding: 5px; background: #241c14; box-shadow: inset 2px 2px 0 #4a3e2a, inset -2px -2px 0 #0c0906; cursor: pointer; }
  .quiver-item.selected { background: #3a2c14; box-shadow: inset 0 0 0 2px var(--gold); }
  .quiver-item svg { width: 100%; height: 100%; }
  .item-level { position: absolute; left: 2px; top: -2px; font-size: 17px; color: #ff6a6a; text-shadow: 2px 2px 0 #000; }
  #bag-info { min-height: 58px; width: min(100%, 318px); font-size: 17px; color: var(--dim); text-align: left; }
  .bag-name { color: #fff3c8; font-size: 21px; text-transform: uppercase; }
  .bag-buttons { display: flex; gap: 8px; }
  /* Jeter une pile : combien ? (Thomas, 2026-11-13) */
  #bag-buttons[hidden] { display: none; }
  #bag-qty { display: flex; gap: 6px; align-items: center; }
  #bag-qty[hidden] { display: none; }
  #bag-sure { border: 2px solid #b0453c; background: #2a1414; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  #bag-sure[hidden] { display: none; }
  #sure-text { color: #ffd9c0; text-align: center; }
  #bag-sure .sure-row { display: flex; gap: 8px; }
  #bag-sure .sure-row button { flex: 1; }
  #sure-ok { color: #ffb0a0; }
  #bag-qty button { flex: none; min-width: 44px; padding: 8px 6px; }
  #bag-qty #qty-ok { flex: 1; }
  #qty-n { min-width: 54px; text-align: center; font-size: 22px; color: #fff3c8; }
</style>

<div class="col">

    <button id="quest-banner" type="button" hidden></button>

    <div id="dice-log"></div>
    <div id="status-pop" hidden></div>

      <button id="door-cancel" type="button"></button>

      <div id="talk-lines"></div>
      <div id="talk-purse"></div>

    <button id="here-close" type="button">×</button>
    </div>
  </div>
  </div>

    <button id="actions" type="button"></button>
    <button id="power" type="button" hidden></button>
    <button id="open-bag" type="button"></button>
  </div>
  <div id="shop" class="overlay" hidden>
    <button id="shop-close" class="hero-close" type="button" aria-label="Fermer">×</button>

    <div class="hero-tabs">
      <button id="shop-tab-buy" class="hero-tab on" type="button">Acheter</button>
      <button id="shop-tab-sell" class="hero-tab" type="button">Vendre</button>
    </div>
    <div id="shop-purse"></div>
    <div id="shop-list"></div>
    <div id="shop-detail"></div>
  </div>
  <div id="intro" class="overlay" hidden>
    <div id="intro-lines"></div>
    <button id="intro-go" type="button">Descendre</button>
  </div>
  <div id="found" class="overlay" hidden>

    <div id="found-card"></div>
    <button id="found-close" type="button">Continuer</button>
  </div>
  <div id="bag" class="overlay" hidden>

      <button id="tab-inv" class="hero-tab on" type="button">Inventaire</button>
      <button id="tab-char" class="hero-tab" type="button">Personnage<span id="tab-char-bang" class="bang" hidden>!</span></button>

      <div id="bag-info"></div>

pos.":"Limited spells, recharged by resting.",Gluck:"Gluck","\xAB Psst ! Humain ! Par ici ! \xBB":"\u201CPsst! Human! Over here!\u201D","\xAB Je veux partir. Je d\xE9teste cet endroit. \xBB":"\u201CI want out. I hate this place.\u201D","Vous : \xAB Tu es un Kobold. \xBB":"You: \u201CYou're a Kobold.\u201D","\xAB Et alors ? Je peux d\xE9tester mon travail ! J'ai besoin de pommes. Beaucoup de pommes. Les potions, \xE7a br\xFBle la gorge. \xBB":"\u201CSo what? I can hate my job! I need apples. Lots of apples. Potions burn my throat.\u201D","\xAB Encore toi\u2026 \xBB":"\u201CYou again\u2026\u201D","\xAB J'ai des pommes. Mais pour toi, c'est plus cher. Paie d'abord. \xBB":"\u201CI have apples. But for you, it's more expensive. Pay first.\u201D","\xAB H\xE9 ! Mon humain pr\xE9f\xE9r\xE9 ! \xBB":"\u201CHey! My favorite human!\u201D","\xAB J'ai encore des pommes. Tu as de l'or ? \xBB":"\u201CI still have apples. Got gold?\u201D","\xAB Les affaires marchent ! Tu veux investir ? \xBB":"\u201CBusiness is booming! Want to invest?\u201D","Vous : \xAB Dans quoi ? \xBB":"You: \u201CIn what?\u201D","\xAB Des pommes. \xBB":"\u201CApples.\u201D","\xAB Finalement, le donjon n'est pas si mal. \xBB":"\u201CThe dungeon's not so bad after all.\u201D","Vous : \xAB Tu as chang\xE9 d'avis ? \xBB":"You: \u201CYou changed your mind?\u201D","\xAB Non. J'ai trouv\xE9 une meilleure cachette. \xBB":"\u201CNo. I found a better hiding place.\u201D",Force:"Strength",Agilit\u00E9:"Agility",Intelligence:"Intelligence",Charisme:"Charisma",Heaume:"Helm",Armure:"Armor","Corps \xE0 corps":"Melee",Distance:"Ranged",Sac:"Bag",Commun:"Common","Peu commun":"Uncommon",Rare:"Rare","\xC9p\xE9e courte":"Short sword","Une lame courte et droite, sans garde ni fioriture. Fiable.":"A short, straight blade, no guard, no frills. Reliable.",Dague:"Dagger","Courte et vive, faite pour les coups en tra\xEEtre.":"Short and quick, made for treacherous strikes.",B\u00E2ton:"Staff","Un b\xE2ton de marche. Mieux que rien.":"A walking stick. Better than nothing.","Arc court":"Short bow","Un arc de chasse en bois nu.":"A plain wooden hunting bow.","Arc puissant":"Longbow","Un arc recourb\xE9 aux bouts de corne. Il porte loin, et la fl\xE8che part droit.":"A recurved bow with horn tips. It shoots far, and the arrow flies true.",Fl\u00E8ches:"Arrows","Munitions pour l'arc.":"Ammunition for the bow.",Javelines:"Javelins","Se lance \xE0 la main, sans arc. Moins pr\xE9cise qu'une fl\xE8che, mais frappe fort ; se ramasse.":"Thrown by hand, no bow needed. Less accurate than an arrow, but hits hard; can be picked up again.","Fl\xE8ches empoisonn\xE9es":"Poisoned arrows","La pointe luit d'un enduit verd\xE2tre. La plaie br\xFBle encore plusieurs tours.":"The tip gleams with a greenish coating. The wound keeps burning for several turns.",Pomme:"Apple","Croquante. Rend 5 PV.":"Crunchy. Restores 5 HP.",Torche:"Torch","Une fois allum\xE9e, elle \xE9claire autour de vous pendant 100 tours. Mais on vous voit venir.":"Once lit, it lights up your surroundings for 100 turns. But they see you coming.","\xC9p\xE9e longue":"Longsword","Lourde et longue, elle se tient \xE0 deux mains. Chaque coup prend du temps, mais il porte, et peut assommer.":"Long and heavy, held in both hands. Each blow takes time, but it lands, and can stun.","Couteau de boucher":"Butcher's knife","Une lame large et lourde du bout, faite pour trancher la viande. Vive en main.":"A broad blade, heavy at the tip, made for carving meat. Quick in the hand.",Lance:"Spear","Frappe \xE0 deux cases : on touche l'ennemi avant qu'il n'arrive au contact. \xC0 deux mains.":"Strikes two squares away: you hit the enemy before it reaches you. Two-handed.","Une lame courbe qui danse. Rapide et cruelle.":"A curved, dancing blade. Fast and cruel.","Cuir clout\xE9":"Studded leather","Du cuir \xE9pais renforc\xE9 de rivets d'acier. Solide sans faire de bruit.":"Thick leather reinforced with steel rivets. Sturdy and quiet.","Casque de cuir":"Leather cap","Une calotte de cuir bouilli, cousue, avec deux prot\xE8ge-oreilles. Mieux que rien.":"A cap of boiled, stitched leather with two ear flaps. Better than nothing.","Casque de maille":"Mail coif","Un camail d'anneaux d'acier qui couvre la t\xEAte et la nuque, le visage d\xE9gag\xE9.":"A hood of steel rings covering head and neck, face uncovered.",Clef:"Key","Ouvre une salle ferm\xE9e de l'\xE9tage o\xF9 on l'a trouv\xE9e, sans bruit. Ne sert qu'une fois.":"Silently opens a locked room on the floor where it was found. Single use.","Bourse d'or":"Gold purse","Un petit sac de cuir ferm\xE9 par une cordelette. Son or rejoint votre bourse d\xE8s que vous marchez dessus.":"A small leather bag tied with a cord. Its gold joins your purse as soon as you step on it.",Tunique:"Tunic","Une tunique blanche, serr\xE9e par une ceinture de cuir.":"A white tunic, cinched with a leather belt.",Harnois:"Plate armor","Des plaques d'acier qui couvrent tout le corps. Presque rien ne passe, mais on l'entend venir de loin.":"Steel plates covering the whole body. Almost nothing gets through, but they hear you coming from afar.","Cotte de mailles":"Chain mail","Des anneaux de fer rivet\xE9s. Lourde et s\xFBre, mais elle cliquette : on se cache moins bien.":"Riveted iron rings. Heavy and safe, but it jingles: harder to hide.","Armure de cuir":"Leather armor","Du cuir bouilli, souple et silencieux.":"Boiled leather, supple and silent.",Am\u00E9thyste:"Amethyst","Une pierre violette, taill\xE9e en brillant.":"A violet stone, brilliant cut.",Saphir:"Sapphire","Un bleu profond qui accroche la moindre lueur.":"A deep blue that catches the faintest glimmer.",\u00C9meraude:"Emerald","Taill\xE9e \xE0 degr\xE9s, d'un vert tr\xE8s pur.":"Step cut, a very pure green.",Diamant:"Diamond","Il brille m\xEAme dans le noir. Ou presque.":"It shines even in the dark. Almost.","Sac en toile":"Canvas bag","Un sac de toile grossi\xE8re. 6 \xD7 4 cases.":"A bag of coarse canvas. 6 \xD7 4 squares.","Sac de cuir":"Leather bag","Un sac \xE0 rabat, solide. 7 \xD7 5 cases.":"A sturdy flap bag. 7 \xD7 5 squares.","Sac d'aventurier":"Adventurer's pack","Un grand sac \xE0 dos, couverture roul\xE9e dessus. 8 \xD7 6 cases.":"A big backpack with a bedroll on top. 8 \xD7 6 squares.","Potion de jouvence":"Youth potion","Jaune et p\xE9tillante. Rend tous vos points \xE0 r\xE9partir, plus un. La voie choisie, elle, ne change pas.":"Yellow and fizzy. Gives back all your spent points, plus one. Your chosen path stays the same.","Potion de poison":"Poison potion","Enduire : vos 15 prochains coups qui portent empoisonnent. Lancer : un nuage empoisonn\xE9 en croix.":"Coat: your next 15 hits poison. Throw: a poison cloud in a cross.","Potion de vitesse":"Speed potion","Pendant 4 tours, chaque attaque au corps \xE0 corps frappe deux fois.":"For 4 turns, every melee attack strikes twice.","Potion de feu":"Fire potion","\xC0 lancer : la case vis\xE9e et ses quatre voisines br\xFBlent pendant 5 tours.":"To throw: the target square and its four neighbors burn for 5 turns.","Fiole de fum\xE9e":"Smoke flask",Robe:"Robe","Une robe d'\xE9tude. Elle ne prot\xE8ge gu\xE8re.":"A scholar's robe. It barely protects.","Arme de corps \xE0 corps":"Melee weapon","Arme \xE0 distance":"Ranged weapon",Munition:"Ammunition","Objet utile":"Useful item",Monnaie:"Currency","\xC0 utiliser":"Consumable","Pierre pr\xE9cieuse":"Gemstone",Krik:"Krik","\xAB Bonjour aventurier ! \xBB":"\u201CHello, adventurer!\u201D","Vous : \xAB Tu vends quelque chose ? \xBB":"You: \u201CSelling something?\u201D","\xAB Oui. Des objets vol\xE9s \xE0 mes camarades. \xBB":"\u201CYes. Things stolen from my comrades.\u201D","Vous : \xAB Tu es honn\xEAte, au moins. \xBB":"You: \u201CHonest, at least.\u201D","\xAB Non. Je suis malade. Une exp\xE9rience rat\xE9e, au laboratoire. Depuis, je ne peux plus mentir. \xBB":"\u201CNo. I'm sick. A failed experiment in the lab. Since then, I can't lie.\u201D","\xAB Mes camarades savent que je les ai trahis. \xBB":"\u201CMy comrades know I betrayed them.\u201D","Vous : \xAB Pourquoi les avoir trahis ? \xBB":"You: \u201CWhy did you betray them?\u201D","\xAB Parce que je voulais garder tout le butin. Maintenant, ils veulent me tuer. Tu peux m'aider ? \xBB":"\u201CBecause I wanted to keep all the loot. Now they want to kill me. Can you help me?\u201D","\xAB Toi ! Tu m'as\u2026 non, je suis ravi de te voir. Vraiment. \xBB":"\u201CYou! You turned me\u2026 no, I'm delighted to see you. Really.\u201D","\xAB Je vais beaucoup mieux ! \xBB":"\u201CI'm much better!\u201D","Vous : \xAB Tu mens ? \xBB":"You: \u201CAre you lying?\u201D","\xAB Non. \xBB":"\u201CNo.\u201D","Vous : \xAB Donc tu mens. \xBB":"You: \u201CSo you're lying.\u201D","\xAB \u2026 \xBB":"\u201C\u2026\u201D","\xAB Ah. Le d\xE9lateur. Les affaires sont les affaires : entre. \xBB":"\u201CAh. The snitch. Business is business: come in.\u201D","\xAB J'ai fait fortune ! \xBB":"\u201CI made a fortune!\u201D","Vous : \xAB Comment ? \xBB":"You: \u201CHow?\u201D","\xAB En vendant les m\xEAmes objets trois fois. \xBB":"\u201CBy selling the same items three times.\u201D","Pas d'questions, pas d'soucis\u2026":"No questions, no worries\u2026","Tout est d'origine. Presque.":"All original. Almost.","Prix d'ami. Enfin\u2026 d'ami.":"Friend's price. Well\u2026 friend's.","Chut. Les murs ont des oreilles pointues.":"Shh. The walls have pointy ears.",Kobold:"Kobold","Petit pillard \xE9cailleux \xE0 cornes des premi\xE8res galeries. Il dort volontiers, mais une fois r\xE9veill\xE9 il ne l\xE2che plus sa proie.":"A small scaly, horned raider of the upper tunnels. Likes to sleep, but once awake it never lets go of its prey.","Kobold frondeur":"Kobold slinger","Un Kobold en jaque de cuir, fronde \xE0 la main. Il garde ses distances, tire de loin et recule derri\xE8re les colonnes quand on l'approche.":"A Kobold in a leather jerkin, sling in hand. It keeps its distance, shoots from afar and backs off behind pillars when approached.",Araign\u00E9e:"Spider",araign\u00E9es:"spiders","Elle guette dans les coins sombres, pr\xE8s de ses toiles. Tr\xE8s vive quand elle fond sur sa proie, et sa morsure colle.":"It lurks in dark corners near its webs. Very fast when it pounces, and its bite sticks.","la Tisseuse":"the Weaver","Reine des araign\xE9es, grosse comme un chariot, l'abdomen marqu\xE9 d'un cr\xE2ne. Elle sent chaque vibration de sa toile, avance pour mordre puis recule dans l'ombre.":"Queen of the spiders, big as a cart, a skull marked on her abdomen. She feels every vibration of her web, comes forward to bite, then retreats into the shadows.",Humain:"Human","Polyvalent et endurant.":"Versatile and enduring.","Robuste : 2 points de vie suppl\xE9mentaires.":"Sturdy: 2 extra hit points.","Petit et chanceux.":"Small and lucky.","Chanceux : relance tout 1 obtenu au d\xE9 \xE0 20 faces.":"Lucky: rerolls every 1 on the d20.",Elfe:"Elf","Une vue per\xE7ante.":"Keen sight.","Voit plus loin dans le noir et rep\xE8re les pi\xE8ges.":"Sees farther in the dark and spots traps.","Second souffle":"Second wind","Une fois par \xE9tage, en un tour : +5 PV. Se renforce.":"Once per floor, in one turn: +5 HP. Gets stronger.","+5 PV, une fois par \xE9tage":"+5 HP, once per floor","+8 PV, une fois par \xE9tage":"+8 HP, once per floor","+12 PV, deux fois par \xE9tage":"+12 HP, twice per floor","Peau dure":"Thick skin","+1 \xE0 la classe d'armure":"+1 armor class","+2 \xE0 la classe d'armure":"+2 armor class","+3 \xE0 la classe d'armure":"+3 armor class",R\u00E9cup\u00E9ration:"Recovery","Le repos rend 65 % des PV manquants":"Resting restores 65% of missing HP","Le repos rend 80 % des PV manquants":"Resting restores 80% of missing HP","Le repos rend tous les PV manquants":"Resting restores all missing HP","Dernier rempart":"Last stand","Un coup mortel vous laisse \xE0 1 PV (1 fois par \xE9tage)":"A deadly blow leaves you at 1 HP (once per floor)","Un coup mortel vous laisse \xE0 5 PV (1 fois par \xE9tage)":"A deadly blow leaves you to Krik","\xAB Le magot est l\xE0 o\xF9 je l'ai dit. Je ne mens pas : je ne peux pas. \xBB":"\u201CThe stash is where I said. I'm not lying: I can't.\u201D","\xAB Tout est l\xE0 ! M\xEAme la pi\xE8ce tordue. \xBB":"\u201CIt's all there! Even the bent coin.\u201D","\xAB Moiti\xE9-moiti\xE9. Ta moiti\xE9 est plus grosse. C'est vrai, je l'ai mesur\xE9e. \xBB":"\u201CHalf and half. Your half is bigger. It's true, I measured it.\u201D","(Il laisse de l'or et un objet.)":"(He leaves gold and an item.)","Vous gardez le magot de Krik : +{0} or. Quelque part, un Kobold qui ne sait pas mentir raconte partout que vous \xEAtes un voleur.":"You keep Krik's stash: +{0} gold. Somewhere, a Kobold who can't lie is telling everyone you're a thief.","Chasser les traqueurs {0}/{1}":"Drive off the trackers {0}/{1}","Chasser les traqueurs":"Drive off the trackers","Revoir Krik":"Back to Krik","\xAB Ils sont encore l\xE0. Je les entends. C'est vrai. \xBB":"\u201CThey're still here. I can hear them. It's true.\u201D","\xAB Ils sont partis ? Vraiment ? \u2026 Je te crois. Je n'ai pas le choix, mais je te crois. \xBB":"\u201CThey're gone? Really? \u2026 I believe you. I have no choice, but I believe you.\u201D","\xAB Mes camarades dorment l\xE0, l\xE0 et l\xE0. \xBB":"\u201CMy comrades sleep there, there and there.\u201D","(Les repaires des Kobolds de l'\xE9tage apparaissent sur la carte. Il laisse une pomme et un objet.)":"(The Kobold lairs on this floor appear on your map. He leaves an apple and an item.)","Krik a d\xFB fuir seul. Il racontera que vous l'avez abandonn\xE9. C'est vrai.":"Krik had to flee alone. He'll tell everyone you abandoned him. It's true.","Nouvelle qu\xEAte !":"New quest!","Objectif rempli !":"Objective complete!","Qu\xEAte perdue : la personne qui l'avait donn\xE9e s'est enfuie.":"Quest lost: the one who gave it ran away.","Nouvelle qu\xEAte \u2014 {0}.":"New quest \u2014 {0}.","Krik attendra son magot longtemps.":"Krik will be waiting a long time for his stash.","At
