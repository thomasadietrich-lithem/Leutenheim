AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cave Roller - statistiques anonymes (Thomas, 2026-11-15). Tout en un : bucket S3 des evenements (efface apres
  2 ans), Lambda "caveroller-stats" et son adresse publique (Function URL, CORS ouvert), garde-fou de 5 appels
  simultanes, base et table Athena (partitions par jour automatiques), groupe de travail Athena et requetes
  enregistrees. Deploiement : aws cloudformation deploy (voir README.md). Sortie StatsUrl : l'adresse a coller
  dans src/data/telemetry.ts.

Parameters:
  RetentionDays:
    Type: Number
    Default: 730
    Description: Duree de conservation des evenements (jours).
  MaxConcurrency:
    Type: Number
    Default: 5
    Description: Appels simultanes au plus (garde-fou contre les abus et la facture). 0 = pas de reserve (compte AWS neuf, deja limite a 10 appels simultanes au total).
  MaxPer5Min:
    Type: Number
    Default: 300
    Description: Coupe-circuit - appels acceptes au plus en 5 minutes avant fermeture automatique de l'adresse.
  MaxPerDay:
    Type: Number
    Default: 20000
    Description: Coupe-circuit - appels acceptes au plus en un jour avant fermeture automatique de l'adresse.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    Description: Budget mensuel du compte (dollars) ; un courriel part a 50 % et a 100 %.
  AlertEmail:
    Type: String
    Default: ""
    NoEcho: true
    Description: Adresse qui recoit les alertes (coupe-circuit, budget). Vide = pas de courriel. Jamais ecrite dans le depot.
  DashboardPassword:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: "^$|^.{12,}$"
    ConstraintDescription: Mot de passe vide (pas de page en ligne) ou d'au moins 12 caracteres.
    Description: Mot de passe du tableau de bord (utilisateur lth). Vide = la page n'est pas mise en ligne. Jamais ecrit dans le depot.

Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  Reserve: !Not [!Equals [!Ref MaxConcurrency, 0]]
  HasPassword: !Not [!Equals [!Ref DashboardPassword, ""]]

Resources:
  EventsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "caveroller-stats-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-events
            Status: Enabled
            Prefix: events/
            ExpirationInDays: !Ref RetentionDays
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 30

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: write-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${EventsBucket.Arn}/events/*"

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/caveroller-stats
      RetentionInDays: 14

  StatsFunction:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogs
    Properties:
      FunctionName: caveroller-stats
      Description: Cave Roller - recoit les evenements anonymes et les range dans S3 (n'utilise jamais l'adresse IP).
      Runtime: nodejs24.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      ReservedConcurrentExecutions: !If [Reserve, !Ref MaxConcurrency, !Ref "AWS::NoValue"]
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref EventsBucket
      Code:
        # Meme code que lambda/index.mjs, en CommonJS (le code en ligne de CloudFormation s'appelle index.js).
        ZipFile: |
          const { PutObjectCommand, S3Client } = require("@aws-sdk/client-s3");
          const { randomUUID } = require("node:crypto");
          const s3 = new S3Client({});
          const BUCKET = process.env.BUCKET;
          const MAX_EVENTS = 50;
          const MAX_BODY = 64 * 1024;
          const NAME = /^[a-z_]{1,32}$/;
          function clean(obj) {
            const out = {};
            for (const [k, v] of Object.entries(obj ?? {})) {
              if (!/^[A-Za-z_]{1,24}$/.test(k)) continue;
              if (typeof v === "number" && Number.isFinite(v)) out[k] = v;
              else if (typeof v === "boolean") out[k] = v;
              else if (typeof v === "string") out[k] = v.slice(0, 80);
            }
            return out;
          }
          const reply = (status, text = "") => ({ statusCode: status, headers: { "Content-Type": "text/plain" }, body: text });
          exports.handler = async (event) => {
            if (event.requestContext?.http?.method !== "POST") return reply(405);
            let raw = event.body ?? "";
            if (event.isBase64Encoded) raw = Buffer.from(raw, "base64").toString("utf8");
            if (raw.length > MAX_BODY) return reply(413);
            let body;
            try { body = JSON.parse(raw); } catch { return reply(400, "json"); }
            const ctx = clean({ device: body.device, version: body.version, platform: body.platform, build: body.build, lang: body.lang });
            const events = Array.isArray(body.events) ? body.events.slice(0, MAX_EVENTS) : [];
            const received = Date.now();
            const lines = events
              .filter((e) => e && NAME.test(e.e) && typeof e.run === "string")
              .map((e) => JSON.stringify({ ...clean(e), ...ctx, received }));
            if (lines.length === 0) return reply(204);
            const now = new Date(received);
            const key = `events/dt=${now.toISOString().slice(0, 10)}/${now.toISOString().slice(11, 19).replaceAll(":", "-")}-${randomUUID()}.jsonl`;
            await s3.send(new PutObjectCommand({ Bucket: BUCKET, Key: key, Body: lines.join("\n") + "\n", ContentType: "application/x-ndjson" }));
            return reply(204);
          };

  StatsUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt StatsFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["POST"]
        AllowHeaders: ["content-type"]
        MaxAge: 86400

  # Adresse publique : il faut les deux autorisations (InvokeFunctionUrl, et InvokeFunction par l'adresse).
  PublicUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StatsFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PublicInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StatsFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------- Coupe-circuit (Thomas, 2026-11-24) ----------
  # Si l'adresse publique recoit trop d'appels (abus), une alarme previent une petite fonction qui met a zero le
  # nombre d'appels autorises : l'adresse repond alors "429" et plus rien ne coute. Rouvrir : bash rouvrir.sh.
  BreakerTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: caveroller-stats-alertes

  BreakerEmail:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref BreakerTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  BreakerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: close-stats-url
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:PutFunctionConcurrency
                Resource: !GetAtt StatsFunction.Arn

  BreakerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/caveroller-stats-coupe-circuit
      RetentionInDays: 90

  BreakerFunction:
    Type: AWS::Lambda::Function
    DependsOn: BreakerLogs
    Properties:
      FunctionName: caveroller-stats-coupe-circuit
      Description: Cave Roller - ferme l'adresse des statistiques quand une alarme d'abus se declenche.
      Runtime: nodejs24.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt BreakerRole.Arn
      Environment:
        Variables:
          TARGET: !Ref StatsFunction
      Code:
        ZipFile: |
          const { LambdaClient, PutFunctionConcurrencyCommand } = require("@aws-sdk/client-lambda");
          const lambda = new LambdaClient({});
          exports.handler = async (event) => {
            const alarms = (event.Records ?? []).map((r) => { try { return JSON.parse(r.Sns.Message); } catch { return {}; } });
            if (!alarms.some((a) => a.NewStateValue === "ALARM")) return "rien a faire";
            await lambda.send(new PutFunctionConcurrencyCommand({ FunctionName: process.env.TARGET, ReservedConcurrentExecutions: 0 }));
            console.log("Adresse fermee :", alarms.map((a) => a.AlarmName).join(", "));
            return "ferme";
          };

  BreakerSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BreakerTopic
      Protocol: lambda
      Endpoint: !GetAtt BreakerFunction.Arn

  BreakerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BreakerFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref BreakerTopic

  TooManyCalls5Min:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: caveroller-stats-trop-d-appels-5-min
      AlarmDescription: Trop d'appels en 5 minutes sur l'adresse des statistiques - fermeture automatique.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref StatsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref MaxPer5Min
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BreakerTopic]

  TooManyCallsDay:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: caveroller-stats-trop-d-appels-jour
      AlarmDescription: Trop d'appels en un jour sur l'adresse des statistiques - fermeture automatique.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref StatsFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref MaxPerDay
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BreakerTopic]

  # Alerte de budget sur tout le compte (les chiffres d'AWS ont plusieurs heures de retard : c'est une alerte,
  # pas un coupe-circuit).
  AccountBudget:
    Type: AWS::Budgets::Budget
    Condition: HasEmail
    Properties:
      Budget:
        BudgetName: caveroller-budget-mensuel
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  # ---------- Tableau de bord (Thomas, 2026-11-24) ----------
  # Chaque nuit, une fonction relit les evenements et ecrit data.json (une ligne par partie, rien de personnel :
  # les numeros d'appareil sont remplaces par le code joueur de cinq signes). La page n'est en ligne que si un mot de passe est donne.
  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "caveroller-tableau-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AggregatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-events-write-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt EventsBucket.Arn
                Condition:
                  StringLike:
                    "s3:prefix": "events/*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${EventsBucket.Arn}/events/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DashboardBucket.Arn}/data.json"

  AggregatorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/caveroller-stats-bilan
      RetentionInDays: 14

  AggregatorFunction:
    Type: AWS::Lambda::Function
    DependsOn: AggregatorLogs
    Properties:
      FunctionName: caveroller-stats-bilan
      Description: Cave Roller - relit les evenements et ecrit le fichier du tableau de bord (une ligne par partie).
      Runtime: nodejs24.x
      Handler: index.handler
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt AggregatorRole.Arn
      Environment:
        Variables:
          EVENTS: !Ref EventsBucket
          OUT: !Ref DashboardBucket
          DAYS: "180"
      Code:
        # Essai sans AWS : node aws/telemetry/test-bilan.mjs (lit ce code-ci dans le modele).
        ZipFile: |
          const { S3Client, ListObjectsV2Command, GetObjectCommand, PutObjectCommand } = require("@aws-sdk/client-s3");
          const QUEST = { complete: "r\u00e9ussie", fail: "rat\u00e9e", lost: "perdue" };
          const day = (ms) => new Date(ms).toISOString().slice(0, 10);
          // Code joueur : meme calcul que playerCode dans src/telemetry/telemetry.ts.
          function code(device) {
            const signs = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let h = 0x811c9dc5, out = "";
            for (let i = 0; i < device.length; i++) h = Math.imul(h ^ device.charCodeAt(i), 0x01000193) >>> 0;
            for (let i = 0; i < 5; i++) { out += signs[h & 31]; h >>>= 5; }
            return out;
          }
          function build(events, now) {
            const runs = new Map(), quests = [];
            for (const e of events) {
              if (!e || typeof e.run !== "string" || e.test === true) continue;
              const t = Number(e.t) || Number(e.received) || now;
              let r = runs.get(e.run);
              if (!r) runs.set(e.run, (r = { first: t, last: t, version: "", platform: "", race: "inconnu", deepest: 1, level: 1, turns: 0, gold: 0, bosses: 0, cause: "", dead: 0, alive: 0, fin: false, device: "" }));
              r.first = Math.min(r.first, t); r.last = Math.max(r.last, t);
              if (e.version) r.version = String(e.version);
              if (e.platform) r.platform = String(e.platform);
              if (e.device) r.device = String(e.device);
              r.deepest = Math.max(r.deepest, Number(e.depth) || 0, Number(e.deepest) || 0);
              r.level = Math.max(r.level, Number(e.level) || 0);
              r.turns = Math.max(r.turns, Number(e.turn) || 0);
              if (typeof e.gold === "number") r.gold = e.gold;
              if (e.e === "run_start" && e.race) r.race = String(e.race);
              else if (e.e === "boss_kill") r.bosses++;
              else if (e.e === "demo_end") r.fin = true;
              else if (e.e === "death" && t >= r.dead) { r.dead = t; r.cause = String(e.cause || ""); }
              else if (e.e === "revive") r.alive = Math.max(r.alive, t);
              else if (e.e === "quest" && QUEST[e.what]) quests.push({ run: e.run, id: String(e.id || ""), what: QUEST[e.what] });
            }
            const rows = new Map();
            for (const [id, r] of runs) {
              const end = r.fin ? "fin" : r.dead > r.alive ? "mort" : now - r.last > 86400000 ? "abandon" : "en cours";
              rows.set(id, { day: day(r.first), version: r.version, platform: r.platform, race: r.race, deepest: r.deepest, end, cause: end === "mort" ? r.cause : "", level: r.level, turns: r.turns, gold: r.gold, bosses: r.bosses, device: r.device ? code(r.device) : "" });
            }
            const q = quests.filter((x) => rows.has(x.run)).map((x) => { const r = rows.get(x.run); return { day: r.day, version: r.version, platform: r.platform, race: r.race, device: r.device, id: x.id, what: x.what }; });
            return { genere: day(now), runs: [...rows.values()], quests: q };
          }
          exports.build = build;
          exports.code = code;
          exports.handler = async () => {
            const s3 = new S3Client({}), now = Date.now(), from = day(now - Number(process.env.DAYS || 180) * 86400000);
            const keys = [];
            let token;
            do {
              const page = await s3.send(new ListObjectsV2Command({ Bucket: process.env.EVENTS, Prefix: "events/", ContinuationToken: token }));
              for (const o of page.Contents || []) { const m = /dt=(\d{4}-\d{2}-\d{2})\//.exec(o.Key); if (m && m[1] >= from) keys.push(o.Key); }
              token = page.NextContinuationToken;
            } while (token);
            const events = [];
            for (let i = 0; i < keys.length; i += 16) {
              const texts = await Promise.all(keys.slice(i, i + 16).map(async (Key) => (await s3.send(new GetObjectCommand({ Bucket: process.env.EVENTS, Key }))).Body.transformToString()));
              for (const text of texts) for (const line of text.split("\n")) { if (!line) continue; try { events.push(JSON.parse(line)); } catch {} }
            }
            const out = build(events, now);
            await s3.send(new PutObjectCommand({ Bucket: process.env.OUT, Key: "data.json", Body: JSON.stringify(out), ContentType: "application/json", CacheControl: "no-store" }));
            console.log(keys.length, "fichiers,", events.length, "evenements,", out.runs.length, "parties");
            return { fichiers: keys.length, evenements: events.length, parties: out.runs.length };
          };

  AggregatorSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Cave Roller - recalcule le tableau de bord chaque nuit.
      ScheduleExpression: cron(15 3 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt AggregatorFunction.Arn
          Id: bilan

  AggregatorSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AggregatorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AggregatorSchedule.Arn

  DashboardOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasPassword
    Properties:
      OriginAccessControlConfig:
        Name: caveroller-tableau
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DashboardAuth:
    Type: AWS::CloudFront::Function
    Condition: HasPassword
    Properties:
      Name: caveroller-tableau-mot-de-passe
      AutoPublish: true
      FunctionConfig:
        Comment: Cave Roller - demande le mot de passe du tableau de bord.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var h = event.request.headers.authorization;
            if (h && h.value === "Basic ${Token}") { delete event.request.headers.authorization; return event.request; }
            return { statusCode: 401, statusDescription: "Unauthorized", headers: { "www-authenticate": { value: "Basic realm=\"Cave Roller\"" } } };
          }
        - Token: !Base64
            Fn::Sub: "lth:${DashboardPassword}"

  # Etiquettes des joueurs (Thomas, 2026-11-24) : la page enregistre tags.json par cette fonction. Elle n'est
  # joignable que par CloudFront (donc derriere le mot de passe) et ne sait ecrire que ce seul fichier.
  TagsRole:
    Type: AWS::IAM::Role
    Condition: HasPassword
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: write-tags
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DashboardBucket.Arn}/tags.json"

  TagsLogs:
    Type: AWS::Logs::LogGroup
    Condition: HasPassword
    Properties:
      LogGroupName: /aws/lambda/caveroller-stats-etiquettes
      RetentionInDays: 90

  TagsFunction:
    Type: AWS::Lambda::Function
    Condition: HasPassword
    DependsOn: TagsLogs
    Properties:
      FunctionName: caveroller-stats-etiquettes
      Description: Cave Roller - enregistre les etiquettes des joueurs (tags.json) pour le tableau de bord.
      Runtime: nodejs24.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt TagsRole.Arn
      Environment:
        Variables:
          OUT: !Ref DashboardBucket
      Code:
        # Essai sans AWS : node aws/telemetry/test-bilan.mjs (lit ce code-ci dans le modele).
        ZipFile: |
          const { S3Client, PutObjectCommand } = require("@aws-sdk/client-s3");
          const reply = (statusCode, body) => ({ statusCode, headers: { "content-type": "application/json", "cache-control": "no-store" }, body: JSON.stringify(body) });
          // Garde seulement des codes joueur valides et des prenoms courts, sans signes dangereux.
          function clean(input) {
            if (!input || typeof input !== "object" || Array.isArray(input)) return null;
            const out = {};
            for (const [code, name] of Object.entries(input)) {
              if (!/^[A-HJ-NP-Z2-9]{5}$/.test(code) || typeof name !== "string") return null;
              const text = name.replace(/[\u0000-\u001f<>"'&`\\]/g, "").trim().slice(0, 30);
              if (text) out[code] = text;
            }
            return Object.keys(out).length <= 300 ? out : null;
          }
          exports.clean = clean;
          exports.handler = async (event) => {
            const h = event.headers || {};
            if (event.requestContext?.http?.method !== "PUT") return reply(405, { erreur: "methode" });
            if (!String(h["content-type"] || "").startsWith("application/json")) return reply(415, { erreur: "type" });
            if (h["sec-fetch-site"] && h["sec-fetch-site"] !== "same-origin") return reply(403, { erreur: "origine" });
            let raw = event.body || "";
            if (event.isBase64Encoded) raw = Buffer.from(raw, "base64").toString("utf8");
            if (raw.length > 20000) return reply(413, { erreur: "taille" });
            let tags;
            try { tags = clean(JSON.parse(raw)); } catch { tags = null; }
            if (!tags) return reply(400, { erreur: "contenu" });
            await new S3Client({}).send(new PutObjectCommand({ Bucket: process.env.OUT, Key: "tags.json", Body: JSON.stringify(tags), ContentType: "application/json; charset=utf-8", CacheControl: "no-store" }));
            console.log("Etiquettes enregistrees :", Object.keys(tags).length);
            return reply(200, { ok: true, nombre: Object.keys(tags).length });
          };

  TagsUrl:
    Type: AWS::Lambda::Url
    Condition: HasPassword
    Properties:
      TargetFunctionArn: !GetAtt TagsFunction.Arn
      AuthType: AWS_IAM

  TagsOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasPassword
    Properties:
      OriginAccessControlConfig:
        Name: caveroller-etiquettes
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # Seul CloudFront (cette distribution-ci) peut appeler la fonction des etiquettes.
  TagsUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasPassword
    Properties:
      FunctionName: !Ref TagsFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}"

  TagsInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasPassword
    Properties:
      FunctionName: !Ref TagsFunction
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      InvokedViaFunctionUrl: true
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}"

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasPassword
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Cave Roller - tableau de bord (mot de passe obligatoire)
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: tableau
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DashboardOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: etiquettes
            DomainName: !Select [2, !Split ["/", !GetAtt TagsUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt TagsOAC.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        CacheBehaviors:
          - PathPattern: api/tags
            TargetOriginId: etiquettes
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt DashboardAuth.FunctionMetadata.FunctionARN
        DefaultCacheBehavior:
          TargetOriginId: tableau
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled (politique geree par AWS)
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DashboardAuth.FunctionMetadata.FunctionARN

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasPassword
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${DashboardBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}"

  # ---------- Lecture : Athena ----------
  StatsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: caveroller
        Description: Statistiques anonymes de Cave Roller

  EventsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref StatsDatabase
      TableInput:
        Name: events
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2026-11-01,NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://${EventsBucket}/events/dt=${!dt}/"
        PartitionKeys:
          - { Name: dt, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://${EventsBucket}/events/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              ignore.malformed.json: "true"
              case.insensitive: "true"
          Columns:
            - { Name: e, Type: string }
            - { Name: t, Type: bigint }
            - { Name: run, Type: string }
            - { Name: device, Type: string }
            - { Name: version, Type: string }
            - { Name: platform, Type: string }
            - { Name: build, Type: string }
            - { Name: lang, Type: string }
            - { Name: received, Type: bigint }
            - { Name: depth, Type: int }
            - { Name: level, Type: int }
            - { Name: turn, Type: int }
            - { Name: test, Type: boolean }
            - { Name: hp, Type: int }
            - { Name: maxhp, Type: int }
            - { Name: gold, Type: int }
            - { Name: unhurt, Type: boolean }
            - { Name: cause, Type: string }
            - { Name: deepest, Type: int }
            - { Name: bosses, Type: int }
            - { Name: id, Type: string }
            - { Name: what, Type: string }
            - { Name: section, Type: int }
            - { Name: race, Type: string }
            - { Name: cls, Type: string }
            - { Name: sandbox, Type: boolean }

  StatsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: caveroller
      Description: Requetes des statistiques de Cave Roller
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 1073741824
        ResultConfiguration:
          OutputLocation: !Sub "s3://${EventsBucket}/athena-results/"

  QueryRunsPerDay:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: "1. Parties et appareils par jour"
      Database: !Ref StatsDatabase
      WorkGroup: !Ref StatsWorkGroup
      QueryString: >-
        SELECT dt, count(*) AS parties, count(DISTINCT device) AS appareils
        FROM caveroller.events WHERE e = 'run_start' AND NOT coalesce(test, false)
        GROUP BY dt ORDER BY dt DESC

  QueryDeathsByFloor:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: "2. Morts par etage"
      Database: !Ref StatsDatabase
      WorkGroup: !Ref StatsWorkGroup
      QueryString: >-
        SELECT depth, count(*) AS morts FROM caveroller.events
        WHERE e = 'death' AND NOT coalesce(test, false) GROUP BY depth ORDER BY depth

  QueryCauses:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: "3. Causes de mort"
      Database: !Ref StatsDatabase
      WorkGroup: !Ref StatsWorkGroup
      QueryString: >-
        SELECT cause, count(*) AS morts FROM caveroller.events
        WHERE e = 'death' AND NOT coalesce(test, false) GROUP BY cause ORDER BY morts DESC LIMIT 15

  QueryFunnel:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: "4. Entonnoir des etages"
      Database: !Ref StatsDatabase
      WorkGroup: !Ref StatsWorkGroup
      QueryString: >-
        WITH runs AS (SELECT DISTINCT run FROM caveroller.events WHERE e = 'run_start' AND NOT coalesce(test, false)),
        reach AS (SELECT run, max(depth) AS deepest FROM caveroller.events WHERE e = 'floor' GROUP BY run)
        SELECT d AS etage, round(100.0 * count_if(coalesce(reach.deepest, 1) >= d) / count(*), 1) AS pourcent
        FROM runs LEFT JOIN reach USING (run) CROSS JOIN UNNEST(sequence(1, 10)) AS s(d)
        GROUP BY d ORDER BY d

  QueryBoss:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: "5. La Tisseuse"
      Database: !Ref StatsDatabase
      WorkGroup: !Ref StatsWorkGroup
      QueryString: >-
        SELECT count(*) AS victoires, avg(level) AS niveau_moyen, avg(turn) AS tours_moyens
        FROM caveroller.events WHERE e = 'boss_kill' AND NOT coalesce(test, false)

  QueryQuests:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: "6. Quetes"
      Database: !Ref StatsDatabase
      WorkGroup: !Ref StatsWorkGroup
      QueryString: >-
        SELECT id, what, count(*) AS fois FROM caveroller.events
        WHERE e = 'quest' AND NOT coalesce(test, false) GROUP BY id, what ORDER BY id, what

Outputs:
  StatsUrl:
    Description: Adresse a coller dans src/data/telemetry.ts (champ url).
    Value: !GetAtt StatsUrl.FunctionUrl
  BucketName:
    Description: Bucket des evenements.
    Value: !Ref EventsBucket
  AthenaWorkGroup:
    Description: Groupe de travail Athena (console Athena > choisir "caveroller", puis Requetes enregistrees).
    Value: !Ref StatsWorkGroup
  DashboardBucketName:
    Description: Bucket prive du tableau de bord (page et data.json).
    Value: !Ref DashboardBucket
  DashboardUrl:
    Condition: HasPassword
    Description: Adresse du tableau de bord (utilisateur lth, mot de passe choisi au deploiement).
    Value: !Sub "https://${DashboardDistribution.DomainName}/"
