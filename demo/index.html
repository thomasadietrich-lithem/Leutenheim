<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Leutenheim — démo J1</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c0b12; color: #d8d4e6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; }
  #hud { font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .frame { height: min(calc(100vh - 110px), 640px); aspect-ratio: 9 / 14; max-width: 100%;
    border: 2px solid #3a3550; border-radius: 10px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  .bar { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #9a94b0; }
  button { background: #3a3550; color: #f0ecff; border: 0; border-radius: 8px; padding: 8px 14px;
    font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #4b4560; }
</style>
</head>
<body>
  <div id="hud"></div>
  <div class="frame"><canvas id="game"></canvas></div>
  <div class="bar">
    <button id="new-run" type="button">Nouvelle partie</button>
    <span>Touchez une case pour vous y rendre. L'escalier doré mène à l'étage suivant.</span>
  </div>
<script>
"use strict";
(() => {
  // src/data/floors.ts
  var DEFAULT_FLOOR = {
    width: 32,
    height: 32,
    roomAttempts: 40,
    minRooms: 4,
    roomMinSize: 4,
    roomMaxSize: 8,
    extraLinks: 2
  };

  // src/core/rng.ts
  var Rng = class {
    constructor(seed) {
      this.state = seed >>> 0;
    }
    /** Nombre dans [0, 1). */
    next() {
      this.state = this.state + 1831565813 >>> 0;
      let t = this.state;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    /** Entier entre min et max inclus. */
    int(min, max) {
      return min + Math.floor(this.next() * (max - min + 1));
    }
    chance(probability) {
      return this.next() < probability;
    }
  };
  function floorSeed(runSeed, depth) {
    return (runSeed ^ Math.imul(depth, 2654435761)) >>> 0;
  }

  // src/world/map.ts
  var Tile = {
    Wall: 0,
    Floor: 1,
    StairsDown: 2
  };
  var GameMap = class {
    constructor(width, height) {
      this.width = width;
      this.height = height;
      this.tiles = new Uint8Array(width * height);
    }
    index(x, y) {
      return y * this.width + x;
    }
    inBounds(x, y) {
      return x >= 0 && y >= 0 && x < this.width && y < this.height;
    }
    get(x, y) {
      return this.inBounds(x, y) ? this.tiles[this.index(x, y)] : Tile.Wall;
    }
    set(x, y, tile) {
      this.tiles[this.index(x, y)] = tile;
    }
    isWalkable(x, y) {
      return this.get(x, y) !== Tile.Wall;
    }
  };

  // src/world/pathfinding.ts
  var DIRS = [
    { x: 0, y: -1 },
    { x: 1, y: 0 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 1, y: -1 },
    { x: 1, y: 1 },
    { x: -1, y: 1 },
    { x: -1, y: -1 }
  ];
  function canStep(map, x, y, dx, dy) {
    if (!map.isWalkable(x + dx, y + dy)) return false;
    if (dx !== 0 && dy !== 0) {
      return map.isWalkable(x + dx, y) && map.isWalkable(x, y + dy);
    }
    return true;
  }
  function distanceField(map, from) {
    const dist = new Int32Array(map.width * map.height).fill(-1);
    const queue = [map.index(from.x, from.y)];
    dist[queue[0]] = 0;
    for (let head = 0; head < queue.length; head++) {
      const cur = queue[head];
      const cx = cur % map.width;
      const cy = (cur - cx) / map.width;
      for (const d of DIRS) {
        if (!canStep(map, cx, cy, d.x, d.y)) continue;
        const next = map.index(cx + d.x, cy + d.y);
        if (dist[next] !== -1) continue;
        dist[next] = dist[cur] + 1;
        queue.push(next);
      }
    }
    return dist;
  }
  function findPath(map, from, to) {
    if (!map.isWalkable(to.x, to.y)) return null;
    const dist = distanceField(map, to);
    if (dist[map.index(from.x, from.y)] === -1) return null;
    const path = [];
    let x = from.x;
    let y = from.y;
    while (x !== to.x || y !== to.y) {
      const here = dist[map.index(x, y)];
      let moved = false;
      for (const d of DIRS) {
        if (!canStep(map, x, y, d.x, d.y)) continue;
        if (dist[map.index(x + d.x, y + d.y)] === here - 1) {
          x += d.x;
          y += d.y;
          path.push({ x, y });
          moved = true;
          break;
        }
      }
      if (!moved) return null;
    }
    return path;
  }

  // src/world/generator.ts
  function center(r) {
    return { x: r.x + Math.floor(r.w / 2), y: r.y + Math.floor(r.h / 2) };
  }
  function tooClose(a, b) {
    return a.x - 1 < b.x + b.w && a.x + a.w + 1 > b.x && a.y - 1 < b.y + b.h && a.y + a.h + 1 > b.y;
  }
  function carveCorridor(map, rng, a, b) {
    const horizontalFirst = rng.chance(0.5);
    let { x, y } = a;
    const walkX = () => {
      while (x !== b.x) {
        map.set(x, y, Tile.Floor);
        x += Math.sign(b.x - x);
      }
    };
    const walkY = () => {
      while (y !== b.y) {
        map.set(x, y, Tile.Floor);
        y += Math.sign(b.y - y);
      }
    };
    if (horizontalFirst) {
      walkX();
      walkY();
    } else {
      walkY();
      walkX();
    }
    map.set(x, y, Tile.Floor);
  }
  function generateFloor(seed, cfg) {
    const rng = new Rng(seed);
    const map = new GameMap(cfg.width, cfg.height);
    const rooms = [];
    for (let i = 0; (i < cfg.roomAttempts || rooms.length < cfg.minRooms) && i < 2e3; i++) {
      const w = rng.int(cfg.roomMinSize, cfg.roomMaxSize);
      const h = rng.int(cfg.roomMinSize, cfg.roomMaxSize);
      const room = {
        x: rng.int(1, cfg.width - w - 1),
        y: rng.int(1, cfg.height - h - 1),
        w,
        h
      };
      if (rooms.some((r) => tooClose(r, room))) continue;
      rooms.push(room);
    }
    for (const r of rooms) {
      for (let y = r.y; y < r.y + r.h; y++) {
        for (let x = r.x; x < r.x + r.w; x++) map.set(x, y, Tile.Floor);
      }
    }
    const linked = [rooms[0]];
    const pending2 = rooms.slice(1);
    while (pending2.length > 0) {
      let best = { p: 0, l: 0, d: Infinity };
      pending2.forEach((pr, p) => {
        linked.forEach((lr, l) => {
          const a = center(pr);
          const b = center(lr);
          const d = Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
          if (d < best.d) best = { p, l, d };
        });
      });
      const room = pending2.splice(best.p, 1)[0];
      carveCorridor(map, rng, center(room), center(linked[best.l]));
      linked.push(room);
    }
    for (let i = 0; i < cfg.extraLinks && rooms.length > 2; i++) {
      const a = rooms[rng.int(0, rooms.length - 1)];
      const b = rooms[rng.int(0, rooms.length - 1)];
      if (a !== b) carveCorridor(map, rng, center(a), center(b));
    }
    const start = center(rooms[0]);
    const dist = distanceField(map, start);
    let stairs = start;
    let far = 0;
    for (const r of rooms.slice(1)) {
      const c = center(r);
      const d = dist[map.index(c.x, c.y)];
      if (d > far) {
        far = d;
        stairs = c;
      }
    }
    map.set(stairs.x, stairs.y, Tile.StairsDown);
    return { map, rooms, start, stairs };
  }

  // src/core/game.ts
  var Game = class {
    constructor(runSeed, floorConfig = DEFAULT_FLOOR) {
      this.runSeed = runSeed;
      this.floorConfig = floorConfig;
      this.depth = 0;
      this.turn = 0;
      this.hero = { x: 0, y: 0 };
      /** Cases restant à parcourir vers la destination choisie. */
      this.path = [];
      this.enterFloor(1);
    }
    enterFloor(depth) {
      const floor = generateFloor(floorSeed(this.runSeed, depth), this.floorConfig);
      this.depth = depth;
      this.map = floor.map;
      this.hero = { ...floor.start };
      this.path = [];
    }
    /** Le joueur désigne une case : on calcule le chemin. Renvoie faux si elle est inaccessible. */
    setDestination(x, y) {
      const path = findPath(this.map, this.hero, { x, y });
      if (!path) return false;
      this.path = path;
      return true;
    }
    /** Déplacement d'une case (clavier). */
    moveBy(dx, dy) {
      if (!canStep(this.map, this.hero.x, this.hero.y, dx, dy)) return false;
      this.path = [{ x: this.hero.x + dx, y: this.hero.y + dy }];
      return true;
    }
    /** Joue un tour si une action est en attente. Renvoie vrai si un tour a été joué. */
    tick() {
      const next = this.path.shift();
      if (!next) return false;
      this.hero = next;
      this.turn++;
      if (this.map.get(next.x, next.y) === Tile.StairsDown) {
        this.enterFloor(this.depth + 1);
      }
      return true;
    }
  };

  // src/input/pointer.ts
  var KEYS = {
    ArrowUp: [0, -1],
    ArrowDown: [0, 1],
    ArrowLeft: [-1, 0],
    ArrowRight: [1, 0]
  };
  function bindInput(canvas2, onTap, onMove) {
    canvas2.addEventListener("pointerdown", (e) => {
      const rect = canvas2.getBoundingClientRect();
      onTap(e.clientX - rect.left, e.clientY - rect.top);
      e.preventDefault();
    });
    window.addEventListener("keydown", (e) => {
      const dir = KEYS[e.key];
      if (!dir) return;
      onMove(dir[0], dir[1]);
      e.preventDefault();
    });
  }

  // src/render/renderer.ts
  var COLUMNS = 11;
  var COLORS = {
    background: "#14121c",
    wall: "#2a2638",
    floor: "#4b4560",
    stairs: "#e0b040",
    hero: "#5fd38d",
    heroEdge: "#1d5c3a",
    path: "rgba(255,255,255,0.35)"
  };
  var Renderer = class {
    constructor(canvas2) {
      this.canvas = canvas2;
      this.width = 0;
      this.height = 0;
      this.tile = 32;
      // Positions affichées, qui glissent vers les positions réelles pour un mouvement fluide.
      this.camX = 0;
      this.camY = 0;
      this.heroX = 0;
      this.heroY = 0;
      this.ctx = canvas2.getContext("2d");
      this.resize();
    }
    resize() {
      const rect = this.canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      this.width = rect.width;
      this.height = rect.height;
      this.canvas.width = Math.round(rect.width * dpr);
      this.canvas.height = Math.round(rect.height * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.tile = this.width / COLUMNS;
    }
    /** Recentre immédiatement la vue (nouvel étage). */
    snapTo(game2) {
      this.camX = this.heroX = game2.hero.x;
      this.camY = this.heroY = game2.hero.y;
    }
    originX() {
      return this.width / 2 - (this.camX + 0.5) * this.tile;
    }
    originY() {
      return this.height / 2 - (this.camY + 0.5) * this.tile;
    }
    /** Convertit un point de l'écran (en pixels dans le canvas) en case de la carte. */
    screenToTile(px, py) {
      return {
        x: Math.floor((px - this.originX()) / this.tile),
        y: Math.floor((py - this.originY()) / this.tile)
      };
    }
    draw(game2) {
      const { ctx, tile } = this;
      this.heroX += (game2.hero.x - this.heroX) * 0.35;
      this.heroY += (game2.hero.y - this.heroY) * 0.35;
      this.camX += (game2.hero.x - this.camX) * 0.15;
      this.camY += (game2.hero.y - this.camY) * 0.15;
      const ox = this.originX();
      const oy = this.originY();
      ctx.fillStyle = COLORS.background;
      ctx.fillRect(0, 0, this.width, this.height);
      const x0 = Math.floor(-ox / tile);
      const y0 = Math.floor(-oy / tile);
      const x1 = Math.ceil((this.width - ox) / tile);
      const y1 = Math.ceil((this.height - oy) / tile);
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          if (!game2.map.inBounds(x, y)) continue;
          const t = game2.map.get(x, y);
          const sx = ox + x * tile;
          const sy = oy + y * tile;
          ctx.fillStyle = t === Tile.Wall ? COLORS.wall : COLORS.floor;
          ctx.fillRect(sx + 0.5, sy + 0.5, tile - 1, tile - 1);
          if (t === Tile.StairsDown) {
            ctx.fillStyle = COLORS.stairs;
            for (let i = 0; i < 3; i++) {
              const w = tile * (0.3 + i * 0.2);
              ctx.fillRect(sx + tile * 0.15, sy + tile * (0.2 + i * 0.22), w, tile * 0.14);
            }
          }
        }
      }
      ctx.fillStyle = COLORS.path;
      game2.path.forEach((p, i) => {
        const last2 = i === game2.path.length - 1;
        ctx.beginPath();
        ctx.arc(ox + (p.x + 0.5) * tile, oy + (p.y + 0.5) * tile, tile * (last2 ? 0.22 : 0.08), 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = COLORS.hero;
      ctx.strokeStyle = COLORS.heroEdge;
      ctx.lineWidth = Math.max(2, tile * 0.08);
      ctx.beginPath();
      ctx.arc(ox + (this.heroX + 0.5) * tile, oy + (this.heroY + 0.5) * tile, tile * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  };

  // src/main.ts
  function stepDuration(pathLength) {
    if (pathLength <= 3) return 220;
    if (pathLength <= 7) return 150;
    return 90;
  }
  var turnMs = 150;
  var canvas = document.getElementById("game");
  var hud = document.getElementById("hud");
  var newRunButton = document.getElementById("new-run");
  var renderer = new Renderer(canvas);
  var game;
  function newRun() {
    game = new Game(Math.floor(Math.random() * 4294967295));
    renderer.snapTo(game);
  }
  bindInput(
    canvas,
    (px, py) => {
      const t = renderer.screenToTile(px, py);
      if (game.setDestination(t.x, t.y)) {
        turnMs = stepDuration(game.path.length);
        pending = turnMs;
      }
    },
    (dx, dy) => {
      if (game.path.length === 0 && game.moveBy(dx, dy)) turnMs = 170;
    }
  );
  newRunButton.addEventListener("click", newRun);
  window.addEventListener("resize", () => renderer.resize());
  var last = performance.now();
  var pending = 0;
  function frame(now) {
    pending += Math.min(now - last, 250);
    last = now;
    while (pending >= turnMs) {
      pending -= turnMs;
      const depth = game.depth;
      game.tick();
      if (game.depth !== depth) renderer.snapTo(game);
    }
    renderer.draw(game);
    hud.textContent = `\xC9tage ${game.depth} \xB7 Tour ${game.turn} \xB7 Graine ${game.runSeed}`;
    requestAnimationFrame(frame);
  }
  newRun();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
