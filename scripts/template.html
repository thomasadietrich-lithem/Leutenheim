<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Leutenheim — démo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c0b12; color: #d8d4e6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; }
  .col { position: relative; width: min(100%, calc((100vh - 215px) * 9 / 13), 420px); display: flex; flex-direction: column; gap: 6px; }
  #hud-text { font-size: 13px; font-variant-numeric: tabular-nums; text-align: center; }
  .hp { height: 6px; background: #3a1520; border-radius: 3px; overflow: hidden; }
  #hp-fill { height: 100%; width: 100%; background: #e05060; transition: width 0.2s; }
  .frame { position: relative; aspect-ratio: 9 / 13; border: 2px solid #3a3550; border-radius: 10px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  .overlay { position: absolute; inset: 0; background: rgba(12,11,18,0.86); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; font-size: 16px; }
  .overlay[hidden], #door-actions[hidden], button[hidden] { display: none; }
  #menu { background: rgba(12,11,18,0.95); border-radius: 10px; z-index: 2; padding: 14px; }
  #menu section { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #menu section[hidden], #detail[hidden] { display: none; }
  #menu h1 { margin: 0; font-size: 34px; letter-spacing: 0.06em; color: #e0b040; font-weight: 700; }
  #menu h2 { margin: 0 0 4px; font-size: 20px; color: #e0b040; font-weight: 700; }
  #menu h3 { margin: 6px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: #9a94b0; font-weight: 600; align-self: flex-start; }
  #menu p { margin: 0 0 14px; font-size: 13px; color: #9a94b0; }
  #menu section > button, #detail > button { width: 200px; padding: 12px; font-size: 15px; }
  #menu button.ghost { background: transparent; border: 1px solid #3a3550; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .card { position: relative; background: #1c1a28; border: 2px solid #3a3550; border-radius: 10px; padding: 26px 6px 10px;
    min-height: 104px; cursor: pointer; text-align: center; }
  .card.selected { border-color: #e0b040; background: #2a2436; }
  .card.locked { opacity: 0.45; cursor: default; }
  .card-name { font-size: 14px; font-weight: 700; color: #f0ecff; margin-bottom: 4px; }
  .card-info { font-size: 11px; color: #b4aecb; line-height: 1.45; font-variant-numeric: tabular-nums; }
  .card-soon { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #e0b040; margin-top: 4px; }
  .card .more { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; padding: 0; border-radius: 50%;
    font-size: 17px; line-height: 1; background: #3a3550; }
  #detail { background: rgba(12,11,18,0.97); border-radius: 10px; z-index: 3; }
  #detail-body { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; line-height: 1.4; text-align: left; max-width: 300px; }
  #detail-body div:first-child { color: #9a94b0; font-style: italic; margin-bottom: 4px; }
  #door-actions { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  #door-actions button { background: #5a3817; border: 1px solid #e0b040; }
  .panel { display: flex; gap: 8px; align-items: stretch; min-height: 76px; }
  .dice { flex: 0 0 60px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .die { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;
    border: 2px solid #3a3550; border-radius: 12px; background: #1c1a28; color: #9a94b0; font-variant-numeric: tabular-nums;
    transition: border-color 0.25s, box-shadow 0.25s; }
  .die.hit { border-color: #5fd38d; color: #5fd38d; }
  .die.miss { border-color: #77718f; color: #c9c4dc; }
  .die.crit { border-color: #ffd75e; color: #ffd75e; box-shadow: 0 0 14px rgba(255,215,94,0.6); }
  .die.foe { background: #3a1722; }
  .die.rolling { border-color: #ffffff; color: #ffffff; animation: roll 0.16s linear infinite; }
  .die.land { animation: land 0.24s ease-out; }
  @keyframes roll {
    0% { transform: rotate(-14deg) scale(1.08); } 25% { transform: rotate(11deg) translateY(-4px) scale(1.12); }
    50% { transform: rotate(-9deg) scale(1.06); } 75% { transform: rotate(13deg) translateY(3px) scale(1.1); }
    100% { transform: rotate(-14deg) scale(1.08); }
  }
  @keyframes land { 0% { transform: scale(1.55) rotate(8deg); } 55% { transform: scale(0.9); } 100% { transform: scale(1); } }
  #die-who { font-size: 10px; color: #9a94b0; height: 12px; }
  #log { flex: 1; font-size: 11.5px; line-height: 1.35; color: #9a94b0; display: flex; flex-direction: column; justify-content: flex-end; }
  #log div:last-child { color: #e6e2f4; }
  .bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #77718f; }
  .bar span { margin-left: auto; }
  button { background: #3a3550; color: #f0ecff; border: 0; border-radius: 8px; padding: 8px 14px;
    font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #4b4560; }
</style>
</head>
<body>
<div class="col">
  <div id="hud-text"></div>
  <div class="hp"><div id="hp-fill"></div></div>
  <div class="frame">
    <canvas id="game"></canvas>
    <div id="door-actions" hidden>
      <button id="door-pick" type="button"></button>
      <button id="door-break" type="button"></button>
    </div>
    <div id="over" class="overlay" hidden>
      <div id="over-text"></div>
      <button id="over-new-run" type="button">Nouvelle partie</button>
    </div>
  </div>
  <div class="panel">
    <div class="dice"><div id="die" class="die"></div><div id="die-who"></div></div>
    <div id="log"></div>
  </div>
  <div class="bar">
    <button id="wait" type="button">Attendre</button>
    <button id="open-menu" type="button">Menu</button>
    <span id="seed"></span>
  </div>
  <div id="menu" class="overlay">
    <section id="screen-main">
      <h1>LEUTENHEIM</h1>
      <p>Démo de travail</p>
      <button id="menu-resume" type="button" hidden>Reprendre</button>
      <button id="menu-new" type="button">Nouvelle partie</button>
      <button id="menu-settings" type="button">Paramètres</button>
    </section>
    <section id="screen-new" hidden>
      <h2>Nouvelle partie</h2>
      <h3>Race</h3>
      <div id="race-cards" class="cards"></div>
      <h3>Classe</h3>
      <div id="class-cards" class="cards"></div>
      <button id="new-start" type="button">Commencer</button>
      <button id="new-back" type="button" class="ghost">Retour</button>
    </section>
    <section id="screen-settings" hidden>
      <h2>Paramètres</h2>
      <button id="settings-sound" type="button"></button>
      <button id="settings-back" type="button" class="ghost">Retour</button>
    </section>
    <div id="detail" class="overlay" hidden>
      <h2 id="detail-title"></h2>
      <div id="detail-body"></div>
      <button id="detail-close" type="button">Fermer</button>
    </div>
  </div>
</div>
<script>
/*__BUNDLE__*/
</script>
</body>
</html>
