xE9paisse. \xC0 lancer : une nappe de brouillard en losange, cinq cases de large. Personne n'y voit : de quoi fuir.":"Black and thick. To throw: a diamond of fog five squares wide. Nobody can see in it: time to run.","Potion d'oursin":"Urchin potion","Brune et piquante. Pendant 40 tours, 15 % des d\xE9g\xE2ts re\xE7us au contact reviennent \xE0 l'attaquant.":"Brown and prickly. For 40 turns, 15% of melee damage you take goes back to the attacker.","\u0152il de chauve-souris":"Bat eye","Dess\xE9ch\xE9, il palpite encore. Vous devinez l'ombre des monstres hors de vue : \xE0 10 cases, et \xE0 3 \xE0 travers un mur ou une porte.":"Dried, yet still twitching. You sense the shadow of monsters out of sight: up to 10 squares, and 3 through a wall or door.","Fl\xFBte de pan":"Pan flute","Quelques roseaux li\xE9s. En combat, de temps en temps, un air doux endort l'ennemi le plus proche.":"A few tied reeds. In combat, now and then, a soft tune puts the nearest enemy to sleep.","Piqu\xE9 ! \u2212{0}":"Pricked! \u2212{0}","\u266A Zzz":"\u266A Zzz",Oursin:"Urchin","15 % des d\xE9g\xE2ts re\xE7us au contact reviennent \xE0 l'attaquant. Encore {0} tours.":"15% of melee damage you take goes back to the attacker. {0} turns left.","Des piquants vous h\xE9rissent la peau : qui vous frappe s'y pique.":"Spines bristle on your skin: whoever hits you gets pricked.","{0} se pique : {1} d\xE9g\xE2t{2}.":"{0} gets pricked: {1} damage.","Quelques notes de fl\xFBte\u2026 {0} s'endort.":"A few flute notes\u2026 {0} falls asleep.","Sac \xE0 ranger":"Tidy your bag","Pas de place d'un seul tenant : {0}{1} tombe par terre. Rangez le sac pour lui faire un trou.":"No room in one piece: {0}{1} falls to the ground. Tidy your bag to make a gap.","Il reste de la place, mais pas d'un seul tenant : rangez le sac (touchez un objet, puis une case libre).":"There's room left, but not in one piece: tidy your bag (tap an item, then an empty square).","Points \xE0 attribuer : {0}":"Points to spend: {0}","Comp\xE9tences \xE0 attribuer : {0}":"Skill points to spend: {0}","Pas en combat":"Not in combat","Kobold mouill\xE9":"Wet Kobold","SPLASH !":"SPLASH!","Scrrratch !":"Scrrratch!","Clac !":"Thwack!","AU SECOURS !":"HELP!","SPLASH ! Le Kobold bondit hors de son bain, couvert de mousse, une serviette \xE0 la main.":"SPLASH! The Kobold leaps out of his bath, covered in foam, towel in hand.","Scrrratch ! Le disque s'arr\xEAte. Dans la baignoire, quelqu'un grogne.":"Scrrratch! The record stops. In the tub, someone grumbles.","Un coup de serviette en pleine figure : votre prochain coup sera moins pr\xE9cis.":"A towel slap right in the face: your next blow will be less accurate.","\xAB AU SECOURS ! ON M'ATTAQUE DANS MON BAIN ! \xBB Le Kobold s'enfuit en glissant.":"\u201CHELP! I'M BEING ATTACKED IN MY BATH!\u201D The Kobold slips and slides away.","{0} ne craint pas le poison.":"{0} is immune to poison.",Immunis\u00E9e:"Immune","Il fuit !":"Fleeing!","{0} d\xE9tale, la queue entre les jambes !":"{0} bolts, tail between its legs!","Artefacts et bibelots":"Artifacts and trinkets","Un Kobold d\xE9serteur, p\xE2le et peureux, qui ne pense qu'aux pommes. Selon ce qu'on lui dit, il vend, donne, investit\u2026 ou confie une t\xE2che.":"A pale, timid Kobold deserter who only thinks about apples. Depending on what you say, he sells, gives, invests\u2026 or hands you a task.","Une nonne squelette tr\xE8s digne, qui ignore qu'elle est morte. Les Kobolds lui ont vol\xE9 sa cloche. Elle b\xE9nit, ou maudit.":"A very dignified skeleton nun who doesn't know she's dead. The Kobolds stole her bell. She blesses, or curses.","Un Kobold qui ne peut plus mentir depuis une exp\xE9rience rat\xE9e. Il a trahi ses camarades et vend leur butin.":"A Kobold who can't lie anymore since a failed experiment. He betrayed his comrades and sells their loot.","Un marchand vo\xFBt\xE9, un par section. Il ach\xE8te et vend, et dispara\xEEt quand le donjon s'agite trop.":"A hunched merchant, one per section. He buys and sells, and vanishes when the dungeon gets too restless.","Le Kobold qui compte":"The Counting Kobold","Derri\xE8re une porte perc\xE9e d'un trou, il r\xE9p\xE8te son nombre. Ne regardez pas par le trou.":"Behind a door with a hole in it, he repeats his number. Don't look through the hole.","Le Kobold du bain":"The Bathing Kobold","Il dort dans sa baignoire, en musique. R\xE9veill\xE9, il se bat \xE0 la serviette, puis s'enfuit en criant.":"He sleeps in his tub, with music. Woken up, he fights with his towel, then runs off screaming.","Des pointes jaillissent de la dalle. Un bond d'Agilit\xE9 permet parfois de l'\xE9viter. Certains pi\xE8ges sont cach\xE9s, de plus en plus en descendant : une fouille r\xE9ussie de la salle les r\xE9v\xE8le.":"Spikes shoot out of the flagstone. An Agility leap sometimes avoids them. Some traps are hidden, more and more as you go down: a successful search of the room reveals them.","La dalle c\xE8de : on tombe, on se blesse, et il faut un tour pour remonter.":"The flagstone gives way: you fall, get hurt, and need a turn to climb out.","Une aiguille empoisonn\xE9e : une piq\xFBre, puis le poison pendant quelques tours.":"A poisoned needle: a prick, then poison for a few turns.","Un nuage vert s'\xE9chappe de la grille : qui s'y tient est empoisonn\xE9.":"A green cloud escapes from the grate: whoever stands in it is poisoned.","On perd des PV \xE0 chaque tour, pendant quelques tours.":"You lose HP every turn, for a few turns.","1d4 d\xE9g\xE2ts par tour. Sortir des flammes, ou marcher dans l'eau.":"1d4 damage per turn. Get out of the flames, or step into water.","Englu\xE9 ou ralenti":"Stuck or slowed","Le prochain pas sert \xE0 se d\xE9gager ; un monstre ralenti ne joue qu'un tour sur deux.":"The next step is spent breaking free; a slowed monster only acts every other turn.",Sonn\u00E9:"Stunned","Le monstre perd son prochain tour.":"The monster loses its next turn.","Les monstres ne vous remarquent qu'au contact. Premi\xE8re attaque avec l'avantage.":"Monsters only notice you up close. First attack with advantage.","Vous \xE9clairez autour de vous, mais on vous voit venir.":"You light up your surroundings, but they see you coming.","Vos coups qui portent empoisonnent.":"Your hits that land poison.","La pomme dor\xE9e de l'autel : +1 \xE0 l'attaque et +1 classe d'armure.":"The altar's golden apple: +1 to attack and +1 armor class.","La b\xE9n\xE9diction de S\u0153ur Osseuse : +1 classe d'armure.":"Sister Bones' blessing: +1 armor class.","Le poison dure moiti\xE9 moins longtemps, sur l'\xE9tage.":"Poison lasts half as long, on this floor.","+2 d\xE9g\xE2ts contre les Kobolds, sur l'\xE9tage.":"+2 damage against Kobolds, on this floor.","Vos prochains 1 au d\xE9 sont relanc\xE9s.":"Your next rolls of 1 are rerolled.","Une part des d\xE9g\xE2ts re\xE7us au contact revient \xE0 l'attaquant.":"Part of the melee damage you take goes back to the attacker.","Chaque attaque au contact frappe deux fois.":"Every melee attack strikes twice.","Un coup qui vous tuerait vous laisse debout.":"A blow that would kill you leaves you standing.",Personnages:"Characters",Pi\u00E8ges:"Traps",Pi\u00E8ge:"Trap",\u00C9tats:"States",\u00C9tat:"State","Dans le brouillard, {0} et {1} se cognent\u2026 et se battent !":"In the fog, {0} and {1} bump into each other\u2026 and start fighting!","N\u0153ud papillon de Kobold":"Kobold bow tie","Rouge \xE0 pois blancs, un peu froiss\xE9. Tr\xE8s chic. +8 en Charisme.":"Red with white polka dots, a bit crumpled. Very chic. +8 Charisma.","Statue ou p\xE9trifi\xE9":"Statue or petrified","Potion de pierre":"Stone potion","Potion de discorde":"Discord potion","Rose et p\xE9tillante. \xC0 lancer : les monstres de la case et des quatre voisines se battent entre eux.":"Pink and fizzy. To throw: monsters on the square and its four neighbors fight each other.","P\xE9trifi\xE9 !":"Petrified!","Crac !":"Crack!",Statue:"Statue","Rien ne vous blesse, mais vous ne pouvez rien faire. Encore {0} tours.":"Nothing can hurt you, but you can't do anything. {0} turns left.","La potion de discorde \xE9clate : {0} et {1} se jettent l'un sur l'autre !":"The discord potion bursts: {0} and {1} leap at each other!","Votre peau se fige\u2026 vous voil\xE0 statue. Les monstres ne vous voient plus.":"Your skin hardens\u2026 you're a statue now. Monsters no longer see you.","La pierre se fissure : vous pouvez de nouveau bouger.":"The stone cracks: you can move again.","{0} se change en pierre.":"{0} turns to stone.","{0} redevient chair et os.":"{0} is flesh and bone again.","Grise et lourde. Bue : vous devenez statue 10 tours ; les monstres perdent votre trace et ne vous blessent plus, mais vous ne pouvez rien faire. Lanc\xE9e : le monstre touch\xE9 est p\xE9trifi\xE9 10 tours, et sert d'abri pour se cacher.":"Grey and heavy. Drunk: you become a statue for 10 turns; monsters lose your trail and can't hurt you, but you can't do anything. Thrown: the monster hit is petrified for 10 turns, and makes cover to hide behind.","Potion de pierre : bue, rien ne vous blesse mais vous ne pouvez rien faire ; lanc\xE9e, le monstre ne bouge plus et sert d'abri.":"Stone potion: drunk, nothing hurts you but you can't act; thrown, the monster freezes and makes cover.",Tout:"All","vous d\xE9couvrez une cache et un pi\xE8ge cach\xE9 !":"you find a cache and a hidden trap!","vous rep\xE9rez un pi\xE8ge cach\xE9 !":"you spot a hidden trap!","\xAB Halte. On ne court pas devant une religieuse. M\xEAme loin de sa chapelle. \xBB":"\u201CHalt. No running in front of a nun. Even far from her chapel.\u201D","Reprendre le trajet":"Resume the walk","Depuis que quelqu'un, ou quelque chose, a vol\xE9 la cloche, Leutenheim ne se r\xE9veille plus \xE0 l'heure.":"Ever since someone, or something, stole the bell, Leutenheim no longer wakes up on time.","Le boulanger dort. Le coq a d\xE9missionn\xE9.":"The baker sleeps in. The rooster has resigned.","Certains jurent l'entendre sonner la nuit, sous leurs pieds.":"Some swear they hear it ringing at night, beneath their feet.","On vous a donn\xE9 une \xE9p\xE9e, dix fl\xE8ches et une tape dans le dos.":"You were given a sword, ten arrows and a pat on the back.","La cave est par l\xE0.":"The cellar is that way.",Descendre:"Go down","Le poulet":"The chicken","Un poulet, seul, dans le donjon. Il ne faut pas lui parler : il panique, d\xE9tale, et fonce droit dans la porte qu'aucune serrure ni aucun coup n'ouvre.":"A chicken, alone in the dungeon. Don't talk to it: it panics, bolts, and charges straight into the door no lock or blow can open.","Cuisse de poulet":"Chicken leg","Encore ti\xE8de. Le poulet n'a pas souffert longtemps. Rend 8 PV.":"Still warm. The chicken didn't suffer long. Restores 8 HP.","C\xF4\xF4t ?!":"Bawk?!","Plof !":"Splat!","{0} : {1} \u2014 rien. Elle ne bouge pas d'un pouce. On dirait qu'elle attend quelque chose.":"{0}: {1} \u2014 nothing. It doesn't budge an inch. It seems to be waiting for something.","Le poulet prend peur, file \xE0 travers le donjon, d\xE9fonce la porte et s'\xE9crase contre le mur du fond dans un nuage de plumes.":"The chicken panics, dashes across the dungeon, smashes through the door and crashes into the far wall in a cloud of feathers.","Le poulet prend peur et d\xE9tale\u2026 Au loin, un fracas. Un poulet semble s'\xEAtre viand\xE9 contre un mur ; il faudrait peut-\xEAtre investiguer.":"The chicken panics and bolts\u2026 A crash, far away. A chicken seems to have splattered itself against a wall; maybe worth investigating.","Utilis\xE9e, elle se range sous l'arc et \xE9claire autour de vous pendant 300 tours (sa jauge baisse). On peut l'\xE9teindre et la rallumer. Mais on vous voit venir.":"Once used, it goes under the bow and lights your surroundings for 300 turns (its gauge drops). You can put it out and relight it. But they see you coming.","Outils de voleur":"Thieves' tools","Une trousse de crochets et de tensionneurs. Port\xE9e en artefact, toute serrure c\xE8de : le crochetage r\xE9ussit \xE0 coup s\xFBr.":"A kit of picks and tension wrenches. Worn as an artifact, every lock gives: lockpicking always succeeds.","Sur certains \xE9tages, une cloche sur son support. Ce n'est pas la cloche vol\xE9e de Leutenheim : une simple cloche \xE0 vache. La sonner : l'alerte grimpe d'un palier et les monstres alentour accourent.":"On some floors, a bell on its stand. It isn't Leutenheim's stolen bell: just a cowbell. Ringing it: the alarm climbs one stage and nearby monsters come running.","CLONC !":"CLONK!","Torche \xE9teinte : touchez pour la rallumer":"Torch out: tap to relight it","Torche : touchez pour l'\xE9teindre":"Torch: tap to put it out","Torche : utilisez-en une depuis le sac":"Torch: use one from the bag","Pas de torche : utilisez-en une depuis le sac.":"No torch: use one from the bag.","Vous \xE9teignez la torche.":"You put out the torch.","Vous rallumez la torche.":"You relight the torch.","Impossible de rallumer la torche avec une arme \xE0 deux mains.":"You can't relight the torch with a two-handed weapon.",Utiliser:"Use","CLONC ! Ce n'est pas la cloche de Leutenheim : c'est une cloche \xE0 vache. Tout l'\xE9tage vous a quand m\xEAme entendu.":"CLONK! That's not Leutenheim's bell: it's a cowbell. The whole floor heard you anyway.","CLONC ! Fausse joie : une cloche \xE0 vache. Les Kobolds, eux, ont bien entendu.":"CLONK! False alarm: a cowbell. The Kobolds heard it just fine.","CLONC ! Toujours pas la bonne cloche.":"CLONK! Still not the right bell.","CLONC ! Quelque part, une vache r\xE9pond.":"CLONK! Somewhere, a cow answers.","CLONC ! Les Kobolds accourent, d\xE9\xE7us que ce ne soit que vous.":"CLONK! The Kobolds come running, disappointed it's only you.","CLONC ! Le donjon applaudit votre sens de la discr\xE9tion.":"CLONK! The dungeon applauds your sense of discretion.","CLONC ! La vraie, elle, sonne sous vos pieds. Celle-ci sonne surtout l'alerte.":"CLONK! The real one rings beneath your feet. This one mostly rings the alarm.","Encore ti\xE8de. Rend 8 PV.":"Still warm. Restores 8 HP.","Masse d'arme":"Mace","Une t\xEAte de fer \xE0 ailettes au bout d'un manche de ch\xEAne. Elle cabosse les armures et assomme : sur un 17 ou plus au d\xE9, l'ennemi touch\xE9 perd son prochain tour.":"A flanged iron head on an oak haft. It dents armor and stuns: on a 17 or more on the die, the enemy hit loses its next turn.","Lui dire qu'on l'entend sonner, la nuit, sous le village":"Tell her it can be heard ringing at night, beneath the village","\xAB Sous nos pieds ? Alors elle n'est pas fondue. Elle est en bas. Quelque part. \xBB":"\u201CBeneath our feet? Then it hasn't been melted down. It's down there. Somewhere.\u201D","\xAB Descendez, mon enfant. Et \xE9coutez bien. \xBB":"\u201CGo down, my child. And listen carefully.\u201D","\xAB Des racontars de boulanger. Il dort, il r\xEAve, il entend des cloches. \xBB":"\u201CBaker's gossip. He sleeps, he dreams, he hears bells.\u201D","Une nonne squelette tr\xE8s digne, qui ignore qu'elle est morte. Les Kobolds lui ont vol\xE9 sa cloche, celle qui r\xE9veillait Leutenheim. Elle b\xE9nit, ou maudit.":"A very dignified skeleton nun who doesn't know she's dead. The Kobolds stole her bell, the one that woke Leutenheim. She blesses, or curses.","\xAB Parce que je suis contrari\xE9e. Les Kobolds ont vol\xE9 ma cloche. MA cloche. Celle qui r\xE9veillait Leutenheim. \xBB":"\u201CBecause I am upset. The Kobolds stole my bell. MY bell. The one that woke Leutenheim.\u201D","\xAB Depuis, le boulanger fait la grasse matin\xE9e. C'est un scandale. \xBB":"\u201CSince then, the baker sleeps in. It's a scandal.\u201D",Ferme:"Farm","Le poulet prend peur, file droit devant et s'\xE9crase contre un mur dans un nuage de plumes.":"The chicken panics, bolts straight ahead and smashes into a wall in a cloud of feathers.","Le poulet prend peur et d\xE9tale\u2026 Au loin, un choc mou. Un poulet semble s'\xEAtre viand\xE9 contre un mur ; il faudrait peut-\xEAtre investiguer.":"The chicken panics and bolts\u2026 In the distance, a soft thud. A chicken seems to have splattered against a wall; might be worth a look.","Une fois par \xE9tage, en un tour : +4 PV. Se renforce.":"Once per floor, in one turn: +4 HP. Grows stronger.","+4 PV, une fois par \xE9tage":"+4 HP, once per floor","+7 PV, une fois par \xE9tage":"+7 HP, once per floor","+10 PV, une fois par \xE9tage":"+10 HP, once per floor","Repos complet, deux fois plus court":"Full rest, twice as fast","Repos court, deux fois par \xE9tage":"Short rest, twice per floor","Deux fois par \xE9tage : deux coups d'\xE9p\xE9e en un seul tour. Se renforce.":"Twice per floor: two sword strikes in a single turn. Grows stronger.","Quatre fois par \xE9tage":"Four times per floor","Critique sur 16 \xE0 20 ; un critique assomme":"Critical on 16 to 20; a critical stuns","Critique sur 18 \xE0 20 ; un critique assomme":"Critical on 18 to 20; a critical stuns","Critique sur 17 \xE0 20 ; un critique assomme":"Critical on 17 to 20; a critical stuns",Esquive:"Evasion","+2 en agilit\xE9 ; se d\xE9gager saute une case plus loin":"+2 agility; disengaging leaps one tile further","+4 en agilit\xE9 ; se d\xE9gager saute une case plus loin":"+4 agility; disengaging leaps one tile further","+2 pour pousser ; la pouss\xE9e envoie une case plus loin":"+2 to shove; the shove sends one tile further","+4 pour pousser ; la pouss\xE9e envoie une case plus loin":"+4 to shove; the shove sends one tile further",Bousculade:"Shove","Escalope de Kobold":"Kobold cutlet","Bien grill\xE9e, un peu \xE9cailleuse. Rend 5 PV.":"Well grilled, a bit scaly. Restores 5 HP.","Potion de g\xE9ant":"Giant potion","Violette et bouillonnante. Bue : vous doublez de taille 8 tours, vos coups font deux fois plus mal, mais vous ne passez plus les portes. Lanc\xE9e : c'est le monstre touch\xE9 qui grandit (le boss aussi).":"Purple and bubbling. Drunk: you double in size for 8 turns, your blows hurt twice as much, but you can no longer fit through doors. Thrown: the monster hit grows instead (the boss too).","Potion glissante":"Slippery potion","Huileuse et verd\xE2tre. \xC0 lancer : le monstre touch\xE9 devient glissant pour toujours. Chaque coup qu'il re\xE7oit le fait glisser jusqu'au mur, o\xF9 il rebondit et se cogne.":"Oily and greenish. Thrown: the monster hit becomes slippery for good. Every blow it takes sends it sliding to the wall, where it bounces and gets hurt.",R\u00E9tr\u00E9ci:"Shrunk","G\xE9ant !":"Giant!","Glissant !":"Slippery!","Bong ! Bong !":"Bonk! Bonk!","Bong !":"Bonk!",Ziiip:"Wheee",G\u00E9ant:"Giant","Vos coups font deux fois plus mal, mais vous ne passez plus les portes. Encore {0} tours.":"Your blows hurt twice as much, but you can't fit through doors. {0} turns left.","Vous grandissez d'un coup ! Vos coups font deux fois plus mal\u2026 mais les portes sont trop \xE9troites.":"You suddenly grow! Your blows hurt twice as much\u2026 but doors are too narrow.","Vous r\xE9tr\xE9cissez : vous repassez les portes.":"You shrink back: doors fit again.","{0} reprend sa taille.":"{0} shrinks back to size.","{0} grandit d'un coup ! Ses coups feront deux fois plus mal, mais il ne passe plus les portes.":"{0} suddenly grows! Its blows will hurt twice as much, but it can't fit through doors.","{0} est couvert d'huile : chaque coup le fera glisser.":"{0} is covered in oil: every blow will send it sliding.","{0} glisse, rebondit contre le mur{1} et se cogne ({2} d\xE9g\xE2ts).":"{0} slides, bounces off the wall{1} and gets hurt ({2} damage)."," deux fois":" twice","{0} glisse sur {1} cases.":"{0} slides {1} tiles.","La carapace de la Tisseuse se fige\u2026 mais elle s'en d\xE9gage vite (2 tours).":"The Weaver's shell turns to stone\u2026 but she breaks free quickly (2 turns).","Prise de folie, la Tisseuse se mord les pattes !":"Driven mad, the Weaver bites her own legs!","La Tisseuse grandit encore. Ses morsures feront deux fois plus mal\u2026":"The Weaver grows even bigger. Her bites will hurt twice as much\u2026","La Tisseuse d\xE9rape sur ses propres pattes : chaque coup la fera glisser.":"The Weaver skids on her own legs: every blow will send her sliding.","Dans la fum\xE9e, la Tisseuse perd votre piste un instant.":"In the smoke, the Weaver loses your trail for a moment.","Dans le brouillard, la Tisseuse ne sent plus que ce qui la touche.":"In the fog, the Weaver only feels what touches her.","Potion de g\xE9ant : deux fois plus grand quelques tours ; les coups font deux fois plus mal, mais on ne passe plus les portes. Marche aussi sur les monstres, le boss compris.":"Giant potion: twice as big for a few turns; blows hurt twice as much, but no more doors. Works on monsters too, the boss included.",Glissant:"Slippery","Potion glissante : pour toujours. Chaque coup re\xE7u fait glisser jusqu'au mur, o\xF9 l'on rebondit et se cogne.":"Slippery potion: for good. Every blow taken sends you sliding to the wall, where you bounce and get hurt.","{0} se jette sur {1} ! Entre araign\xE9es et Kobolds, ce n'est pas l'amour fou.":"{0} pounces on {1}! Spiders and Kobolds don't exactly get along.","Iiik !":"Eeek!","Sssss !":"Hsssss!","\xC0 terre !":"Down!","{0} heurte le mur : {1} d\xE9g\xE2ts, il tombe \xE0 la renverse.":"{0} hits the wall: {1} damage, and falls flat on its back.","{0} tombe \xE0 la renverse !":"{0} falls flat on its back!","Surprise : contre un monstre qui ne vous a pas remarqu\xE9.":"Surprise: against a monster that hasn't noticed you.","\xC0 terre : contre un ennemi renvers\xE9 par une pouss\xE9e.":"Down: against an enemy knocked over by a shove.","Embrasure : contre un ennemi qui se tient dans une porte (et vous non).":"Doorway: against an enemy standing in a doorway (and you're not).","Embuscade : vous n'avez pas boug\xE9, et l'ennemi d\xE9bouche d'un angle, d'une porte ou d'une colonne d'o\xF9 il ne vous voyait pas.":"Ambush: you stayed put, and the enemy comes round a corner, a door or a pillar from where it couldn't see you.","Les monstres aussi":"Monsters too","Les m\xEAmes r\xE8gles valent pour eux : ne vous arr\xEAtez pas dans une porte, ne foncez pas \xE0 l'aveugle derri\xE8re un angle.":"The same rules apply to them: don't stop in a doorway, don't charge blindly round a corner.","Un anneau dor\xE9 sous un monstre : vous avez l'avantage. Un anneau rouge autour de vous : c'est lui.":"A gold ring under a monster: you have the advantage. A red ring around you: it does.","Jamais les deux camps \xE0 la fois : si chacun a une raison, elles s'annulent.":"Never both sides at once: if each has a reason, they cancel out.","\xC0 terre":"Down","Renvers\xE9 par une pouss\xE9e : il perd son tour \xE0 se relever, et on le frappe avec l'avantage.":"Knocked over by a shove: it loses its turn getting up, and is struck with advantage.","L'ar\xE8ne est remise : un monstre de chaque sorte.":"The arena is reset: one monster of each kind.","Un monstre de plus entre dans l'ar\xE8ne.":"One more monster enters the arena.","De retour au HUB : toutes les salles d'essai sont remises \xE0 neuf.":"Back at the HUB: every test room is as good as new.","\u2196 Trucs fun":"\u2196 Fun stuff","Armurerie \u2197":"Armoury \u2197","\u2199 Ar\xE8ne":"\u2199 Arena","Boss \u2198":"Boss \u2198","\u2190 Qu\xEAtes":"\u2190 Quests","Salles \u2192":"Rooms \u2192","Gluck, le Kobold aux pommes":"Gluck, the apple Kobold","Ferme de Grum (bient\xF4t)":"Grum's farm (soon)","Dortoir des Kobolds":"Kobold dormitory","La cloche":"The bell","Salle de bain":"Bathroom","Pi\xE8ges et sols":"Traps and floors","Autel et coffre":"Altar and chest",Armurerie:"Armoury",Armes:"Weapons",Casques:"Helmets",Potions:"Potions",Munitions:"Ammunition","Gemmes et or":"Gems and gold",Bibelots:"Trinkets","Vivres et lumi\xE8re":"Food and light",Ar\u00E8ne:"Arena","Nich\xE9e de la Tisseuse \u2193":"The Weaver's lair \u2193","Tout remettre":"Reset all","Ar\xE8ne : remettre":"Arena: reset","+ Kobold":"+ Kobold","+ Frondeur":"+ Slinger","+ Araign\xE9e":"+ Spider","Le HUB : une sortie par type de salle (\xE9criteaux au mur). Y revenir remet tout l'\xE9tage \xE0 neuf.":"The HUB: one exit per kind of room (signs on the walls). Coming back here resets the whole floor.","\xAB Ils dorment derri\xE8re la tapisserie, l\xE0. Trois. Ils me cherchent. \xBB":"\u201CThey sleep behind the tapestry, there. Three of them. They're looking for me.\u201D","\xAB Souffle leur bougie : dans le noir, ils n'entendent plus rien. \xBB":"\u201CBlow out their candle: in the dark, they can't hear a thing.\u201D","(La tapisserie appara\xEEt sur la carte.)":"(The tapestry appears on the map.)","\xAB Toi ? \u2026 Bon. Ils dorment derri\xE8re la tapisserie, l\xE0. \xBB":"\u201CYou? \u2026 Fine. They sleep behind the tapestry, there.\u201D","(Il a l'air de mentir. C'est nouveau.)":"(He seems to be lying. That's new.)","(Une tapisserie appara\xEEt sur la carte.)":"(A tapestry appears on the map.)","\xAB Ma cache ? Sous la dalle du milieu, dans leur dortoir. Derri\xE8re la tapisserie. \xBB":"\u201CMy stash? Under the middle slab, in their dormitory. Behind the tapestry.\u201D","\xAB Pourquoi je te le dis ? \u2026 Je ne peux pas m'en emp\xEAcher. \xBB":"\u201CWhy am I telling you? \u2026 I can't help it.\u201D","\xAB Attention : la dalle claque. \xC7a r\xE9veille. Rapporte-moi le magot, on partage. \xBB":"\u201CCareful: the slab clacks. It wakes people. Bring me the stash, we'll split it.\u201D","\xAB D'accord, d'accord ! \xBB Il plonge derri\xE8re la tapisserie : \xAB R\xC9VEILLEZ-VOUS ! L'AVENTURIER ! \xBB":"\u201CFine, fine!\u201D He dives behind the tapestry: \u201CWAKE UP! THE ADVENTURER!\u201D","(Ils vont sortir un par un. Attendez-les \xE0 c\xF4t\xE9 du passage.)":"(They'll come out one by one. Wait for them beside the passage.)","\xAB AU SECOURS ! \xBB Il plonge derri\xE8re la tapisserie et r\xE9veille tout le monde.":"\u201CHELP!\u201D He dives behind the tapestry and wakes everyone up.","(Ils sortent tous en m\xEAme temps !)":"(They all come out at once!)","\xAB L\xE0-bas ! \u2026 \xC7a marche ! \xBB Il vous tend des fioles : \xAB Quand ils sortent, la fum\xE9e. Moi, je me glisse dedans. \xBB":"\u201COver there! \u2026 It works!\u201D He hands you vials: \u201CWhen they come out, the smoke. I'll slip inside.\u201D","(Fioles de fum\xE9e dans le sac. Les tra\xEEtres se r\xE9veillent.)":"(Smoke vials in the bag. The traitors wake up.)","\xAB L\xE0-bas ! \u2026 C'est moi qui ai trahi tout le monde ! \xBB Oups.":"\u201COver there! \u2026 I'm the one who betrayed everyone!\u201D Oops.","\xAB Vite, une fiole ! Sur eux ! \xBB":"\u201CQuick, a vial! On them!\u201D","(Une fiole de fum\xE9e dans le sac. Ils sortent tous !)":"(A smoke vial in the bag. They all come out!)","Vider le dortoir des tra\xEEtres {0}/{1}":"Clear the traitors' dormitory {0}/{1}","\xAB Ils dorment derri\xE8re la tapisserie. Souffle la bougie : dans le noir, ils n'entendent plus rien. C'est vrai. \xBB":"\u201CThey sleep behind the tapestry. Blow out the candle: in the dark, they hear nothing. It's true.\u201D","\xAB Plus personne ne me cherche ? \u2026 Tu as fait \xE7a pour moi ? \xBB":"\u201CNobody's looking for me anymore? \u2026 You did that for me?\u201D","\xAB Tiens. Ce n'est pas vol\xE9. Enfin, pas par moi. \xBB":"\u201CHere. It's not stolen. Well, not by me.\u201D","Krik est rest\xE9 seul avec ses tra\xEEtres derri\xE8re la tapisserie.":"Krik was left alone with his traitors behind the tapestry.","Tenir le passage {0}/{1}":"Hold the passage {0}/{1}","\xAB Ils sortent par la tapisserie. Un par un. Attends-les \xE0 c\xF4t\xE9 : ils ne te verront qu'au dernier moment. \xBB":"\u201CThey come out through the tapestry. One by one. Wait beside it: they'll only see you at the last moment.\u201D","\xAB Tu les as tous eus ? \u2026 Je ne t'ai jamais menac\xE9, hein. C'\xE9tait une blague. Une vraie. \xBB":"\u201CYou got them all? \u2026 I never threatened you, right. It was a joke. A real one.\u201D","(Il laisse ce qu'ils avaient sur eux.)":"(He leaves what they had on them.)","Krik a fil\xE9 sans demander son reste.":"Krik ran off without a word.","Faire diversion devant le dortoir":"Create a diversion at the dormitory","\xAB Lance la fum\xE9e sur eux quand ils sortent ! Moi, je me glisse dedans. \xBB":"\u201CThrow the smoke on them when they come out! I'll slip inside.\u201D","\xAB \xC7a a march\xE9 ! Ils toussaient tellement qu'ils ne m'ont pas vu. \xBB":"\u201CIt worked! They were coughing so hard they didn't see me.\u201D","\xAB Le magot ! Ta part, et des fioles. Vol\xE9es, \xE9videmment. \xBB":"\u201CThe stash! Your share, and some vials. Stolen, of course.\u201D","(Il laisse de l'or et 2 fioles de fum\xE9e.)":"(He leaves gold and 2 smoke vials.)","Krik attend toujours sa diversion.":"Krik is still waiting for his diversion.","Vous tranchez la tapisserie : derri\xE8re, un passage.":"You slash the tapestry: behind it, a passage.","Vous soufflez la bougie. Le noir. Les dormeurs n'entendront plus rien.":"You blow out the candle. Darkness. The sleepers won't hear a thing now.","Clac ! La dalle s'enfonce, une niche s'ouvre\u2026 et le bruit r\xE9veille {0} dormeurs !":"Clack! The slab sinks, a niche opens\u2026 and the noise wakes {0} sleepers!","Clac ! La dalle s'enfonce, une niche s'ouvre\u2026 et le bruit r\xE9veille un dormeur !":"Clack! The slab sinks, a niche opens\u2026 and the noise wakes a sleeper!","Clac ! La dalle s'enfonce, une niche s'ouvre.":"Clack! The slab sinks, a niche opens.","Proposition n\xB0 2":"Proposal no. 2","\xAB Mon cellier est derri\xE8re le tonneau qui sonne creux. Des Kobolds y dorment sur MES pommes. Et sur mon sac. \xBB":"\u201CMy cellar is behind the barrel that sounds hollow. Kobolds sleep in there on MY apples. And on my sack.\u201D","\xAB Pousse le tonneau, rapporte-moi le sac. On partagera. \xBB":"\u201CPush the barrel, bring me back the sack. We'll share.\u201D","(Le tonneau creux appara\xEEt sur la carte.)":"(The hollow barrel appears on the map.)","\xAB D'accord, d'accord ! \xBB Il d\xE9tale en serrant ses pommes\u2026 qui tombent une \xE0 une derri\xE8re lui.":"\u201CFine, fine!\u201D He scurries off clutching his apples\u2026 which fall behind him one by one.","(Suivez la piste de pommes.)":"(Follow the apple trail.)","Vous tendez la main vers son sac\u2026 il b\xE2ille : \xAB La sieste. Dans mon cellier. Derri\xE8re le tonneau. \xBB":"You reach for his sack\u2026 he yawns: \u201CNap time. In my cellar. Behind the barrel.\u201D","\xAB Ne me r\xE9veille pas. Personne ne me r\xE9veille. \xBB":"\u201CDon't wake me. Nobody wakes me.\u201D","(Prenez son sac sans le r\xE9veiller : chaque pas pr\xE8s de lui est un jet de discr\xE9tion.)":"(Take his sack without waking him: every step near him is a stealth roll.)","\xAB Rallumez mes trois cierges. Les Kobolds les ont souffl\xE9s. Il vous faut une flamme : une torche. \xBB":"\u201CRelight my three church candles. The Kobolds blew them out. You'll need a flame: a torch.\u201D","(Les trois cierges apparaissent sur la carte.)":"(The three candles appear on the map.)","\xAB Sous nos pieds ? Alors elle n'est pas fondue. Elle est en bas. \xBB":"\u201CUnder our feet? Then it wasn't melted. It's down there.\u201D","\xAB Trois grilles, dans le sol de cet \xE9tage. Une seule chante. \xC9coutez. \xBB":"\u201CThree grates in the floor of this level. Only one sings. Listen.\u201D","(Les grilles apparaissent sur la carte ; l'une d'elles scintille.)":"(The grates appear on the map; one of them glints.)","\xAB Des racontars de boulanger. \u2026 Mais allez \xE9couter les grilles, tiens. On ne sait jamais. \xBB":"\u201CBaker's gossip. \u2026 But go and listen at the grates anyway. You never know.\u201D","(Les grilles apparaissent sur la carte.)":"(The grates appear on the map.)","\xAB Une cloche de fortune ? \u2026 Avec quoi ? \xBB":"\u201CA makeshift bell? \u2026 With what?\u201D","\xAB Une marmite, une louche, une corde. La cuisine, la forge, la salle de torture. Rapportez-les-moi. \xBB":"\u201CA pot, a ladle, a rope. The kitchen, the forge, the torture room. Bring them to me.\u201D","(Les trois objets apparaissent sur l'\xE9tage ; leurs salles se montrent sur la carte.)":"(The three objects appear on the level; their rooms show on the map.)","\xAB Ma poule aux \u0153ufs d'or s'est sauv\xE9e \xBB":"\u201CMy golden-egg hen ran off\u201D","\xAB Des voleurs de foin dans ma grange \xBB":"\u201CHay thieves in my barn\u201D","\xAB Mon \xE9pouvantail a perdu son chapeau \xBB":"\u201CMy scarecrow lost his hat\u201D","\xAB Fais attention \xE0 mon pr\xE9 en partant. \xBB":"\u201CMind my meadow on your way out.\u201D","\xAB Cocotte. Elle pond de l'or. Elle a peur de tout, m\xEAme de son ombre. \xBB":"\u201CCocotte. She lays gold. She's scared of everything, even her own shadow.\u201D","\xAB Approche-la sans te montrer, sinon elle file. Ram\xE8ne-la-moi. \xBB":"\u201CSneak up on her without showing yourself, or she bolts. Bring her back to me.\u201D","\xAB Tu ferais peur \xE0 une poule, toi. \u2026 Bon. Essaie quand m\xEAme. Cach\xE9, hein. \xBB":"\u201CYou'd scare a hen, you would. \u2026 Fine. Try anyway. Hidden, mind.\u201D","\xAB Bah. Elle reviendra toute seule. Peut-\xEAtre. \xBB":"\u201CBah. She'll come back on her own. Maybe.\u201D","\xAB Deux voleurs de foin. Dans ma grange, derri\xE8re la grosse botte. Pousse-la, et chasse-les. \xBB":"\u201CTwo hay thieves. In my barn, behind the big bale. Push it, and chase them out.\u201D","(La botte de foin appara\xEEt sur la carte.)":"(The hay bale appears on the map.)","\xAB Deux voleurs de foin ! \u2026 Ils t'ont entendu. Les voil\xE0 ! \xBB":"\u201CTwo hay thieves! \u2026 They heard you. Here they come!\u201D","(Ils sortent de la grange.)":"(They come out of the barn.)","\xAB Pas de grange sur cet \xE9tage ? Alors c'\xE9tait un r\xEAve. Encore. \xBB":"\u201CNo barn on this level? Then it was a dream. Again.\u201D","\xAB Mon \xE9pouvantail a froid \xE0 la t\xEAte. Un casque. N'importe lequel. Pose-le-lui. \xBB":"\u201CMy scarecrow's head is cold. A helmet. Any helmet. Put it on him.\u201D","(Touchez l'\xE9pouvantail avec un casque dans le sac.)":"(Touch the scarecrow with a helmet in your bag.)","\xAB Une autre fois. \xBB":"\u201CAnother time.\u201D",Grum:"Grum","Le Kobold fermier, chapeau de paille et salopette. Il garde sa ferme et ne parle qu'\xE0 ceux qui ne marchent pas dans son pr\xE9. Sa poule pond de l'or.":"The farmer Kobold, straw hat and overalls. He keeps his farm and only talks to those who don't walk on his meadow. His hen lays gold.","Un Kobold en salopette, une paille entre les dents, s'appuie sur sa houe.":"A Kobold in overalls, a straw between his teeth, leans on his hoe.","\xAB Bonjour, l'aventurier. Tu marches pas dans mon pr\xE9, toi. C'est bien. \xBB":"\u201CHello, adventurer. You don't walk on my meadow, you. That's good.\u201D","\xAB J'ai des soucis. Trois. Tu en prends un ? \xBB":"\u201CI've got troubles. Three. Will you take one?\u201D",Marmite:"Pot","Une marmite caboss\xE9e. Avec une louche dedans, \xE7a sonne presque.":"A dented pot. With a ladle inside, it almost rings.",Louche:"Ladle","Une grande louche de fer. Le battant id\xE9al.":"A big iron ladle. The perfect clapper.",Corde:"Rope","Une corde de chanvre, un peu tach\xE9e. On ne demande pas de quoi.":"A hemp rope, a bit stained. Don't ask with what.","Poule aux \u0153ufs d'or":"Golden-egg hen","Cocotte, la poule de Grum. Elle pond de l'or, et elle panique.":"Cocotte, Grum's hen. She lays gold, and she panics.","\u0152uf d'or":"Golden egg","Pondu par Cocotte. Lourd, froid, en or massif.":"Laid by Cocotte. Heavy, cold, solid gold.","Fourche de Grum":"Grum's pitchfork","Une fourche de fermier, solide. Pique \xE0 deux cases, comme une lance. \xC0 deux mains.":"A sturdy farmer's pitchfork. Strikes two squares away, like a spear. Two-handed.","Casque poulet":"Chicken helmet","Un casque en forme de poulet, cr\xEAte comprise. Fait main par Grum. \xC9tonnamment solide.":"A chicken-shaped helmet, comb included. Handmade by Grum. Surprisingly sturdy.","Suivre la piste de pommes":"Follow the apple trail","Parler \xE0 Gluck, dans son cellier":"Talk to Gluck, in his cellar","\xAB N-ne me fais pas mal ! Je\u2026 je t'attends. Ici. Cach\xE9. \xBB":"\u201CD-don't hurt me! I\u2026 I'll wait for you. Here. Hidden.\u201D","\xAB Tu m'as trouv\xE9. \xC9videmment. Les pommes\u2026 quelle id\xE9e de semer des pommes. \xBB":"\u201CYou found me. Of course. The apples\u2026 what an idea, dropping apples.\u201D","\xAB Prends-en deux. Et va-t'en. S'il te pla\xEEt. \xBB":"\u201CTake two. And go away. Please.\u201D","Gluck tremble encore dans son cellier.":"Gluck is still trembling in his cellar.","Voler le sac de Gluck sans le r\xE9veiller":"Steal Gluck's sack without waking him","Filer avec le sac":"Run off with the sack","(Il dort, la joue sur son sac. Surtout, ne pas le r\xE9veiller.)":"(He's asleep, cheek on his sack. Whatever you do, don't wake him.)","(Le sac est \xE0 vous : 4 pommes.)":"(The sack is yours: 4 apples.)","Gluck se r\xE9veille un jour, et son sac n'est plus l\xE0. Il saura.":"One day Gluck wakes up, and his sack is gone. He'll know.","Rallumer les cierges {0}/{1}":"Relight the candles {0}/{1}","\xAB Trois cierges. Les Kobolds les ont souffl\xE9s. Il vous faut une flamme : une torche fera l'affaire. \xBB":"\u201CThree candles. The Kobolds blew them out. You need a flame: a torch will do.\u201D","\xAB La lumi\xE8re revient. Et derri\xE8re l'autel, le mur a boug\xE9 ? \u2026 La sacristie ! Je l'avais oubli\xE9e. \xBB":"\u201CThe light returns. And behind the altar, the wall moved? \u2026 The sacristy! I'd forgotten it.\u201D","Les cierges de S\u0153ur Osseuse restent \xE9teints.":"Sister Bones's candles stay dark.","\xC9couter sur la bonne grille {0}/{1}":"Listen at the right grate {0}/{1}","\xAB Trois grilles dans le sol. Une seule chante. Tenez-vous dessus, et \xE9coutez. Longtemps. Deux tours, au moins. \xBB":"\u201CThree grates in the floor. Only one sings. Stand on it and listen. A long time. Two turns, at least.\u201D","\xAB Vous l'avez entendue ? Ma cloche. En bas. \xBB":"\u201CYou heard it? My bell. Down below.\u201D","\xAB Alors allez-y. Je vous montre le chemin. \xBB":"\u201CThen go. I'll show you the way.\u201D","(L'escalier appara\xEEt sur la carte. Clart\xE9 : le poison vous ronge deux fois moins longtemps, sur cet \xE9tage.)":"(The stairs appear on the map. Clarity: poison eats at you half as long, on this level.)","La cloche sonne encore, quelque part sous vos pieds.":"The bell still rings, somewhere under your feet.","Rapporter marmite, louche et corde {0}/{1}":"Bring back pot, ladle and rope {0}/{1}","\xAB Une marmite, une louche, une corde. Avec \xE7a, je vous fais une cloche. Presque. \xBB":"\u201CA pot, a ladle, a rope. With that, I'll make you a bell. Almost.\u201D","Elle pend la marmite, accroche la louche au bout de la corde. CLONC.":"She hangs the pot and ties the ladle to the end of the rope. CLONK.","\xAB \u2026 Elle sonne faux. Elle est PARFAITE. \xBB":"\u201C\u2026 It's out of tune. It's PERFECT.\u201D","S\u0153ur Osseuse n'aura pas sa cloche de fortune.":"Sister Bones won't get her makeshift bell.","Ramener la poule aux \u0153ufs d'or":"Bring back the golden-egg hen","Rendre la poule \xE0 Grum":"Return the hen to Grum","\xAB Elle a peur de tout. Approche-la sans te montrer, et attrape-la. \xBB":"\u201CShe's scared of everything. Sneak up on her without showing yourself, and grab her.\u201D","\xAB MA POULE ! Ma Cocotte d'or ! \xBB":"\u201CMY HEN! My golden Cocotte!\u201D","\xAB Tiens, son dernier \u0153uf. Il est en or. Vraiment en or. \xBB":"\u201CHere, her last egg. It's gold. Really gold.\u201D","(Il laisse un \u0153uf d'or.)":"(He leaves a golden egg.)","Quelque part, une poule d'or caqu\xE8te toute seule.":"Somewhere, a golden hen clucks all alone.","Chasser les voleurs de foin {0}/{1}":"Chase off the hay thieves {0}/{1}","Revoir Grum":"Back to Grum","\xAB Ils sont dans ma grange, derri\xE8re la grosse botte. Pousse-la. \xBB":"\u201CThey're in my barn, behind the big bale. Push it.\u201D","\xAB Ma grange ! Mon foin ! \xBB":"\u201CMy barn! My hay!\u201D","\xAB Prends ma fourche. Elle pique plus loin que ton \xE9p\xE9e. \xBB":"\u201CTake my pitchfork. It reaches further than your sword.\u201D","(Il laisse sa fourche.)":"(He leaves his pitchfork.)","Les voleurs de foin dorment toujours dans la grange de Grum.":"The hay thieves are still sleeping in Grum's barn.","Coiffer l'\xE9pouvantail d'un casque":"Put a helmet on the scarecrow","\xAB Un casque. N'importe lequel. Pose-le-lui sur la t\xEAte. Il a froid, le pauvre. \xBB":"\u201CA helmet. Any one. Put it on his head. He's cold, poor thing.\u201D","\xAB Il est beau ! Il fait peur ! Enfin\u2026 il fait quelque chose. \xBB":"\u201CHe's handsome! He's scary! Well\u2026 he's something.\u201D","\xAB Tiens. Celui-l\xE0, je l'ai fait moi-m\xEAme. \xBB":"\u201CHere. This one I made myself.\u201D","(Il laisse un casque poulet.)":"(He leaves a chicken helmet.)","L'\xE9pouvantail de Grum a toujours froid.":"Grum's scarecrow is still cold.","Dialogues remis \xE0 z\xE9ro : Gluck, S\u0153ur Osseuse, Krik et Grum reprennent depuis le d\xE9but.":"Dialogues reset: Gluck, Sister Bones, Krik and Grum start over.","Vous poussez : \xE7a glisse, et derri\xE8re, un passage !":"You push: it slides, and behind it, a passage!","Vous poussez de toutes vos forces\u2026 \xE7a ne bouge pas. Encore !":"You push with all your might\u2026 it doesn't budge. Again!","Un grondement : derri\xE8re l'autel, un pan de mur coulisse. La sacristie !":"A rumble: behind the altar, a section of wall slides away. The sacristy!","Le troisi\xE8me cierge s'allume.":"The third candle lights up.","Le cierge s'allume ({0} sur 3).":"The candle lights up ({0} of 3).","Il vous faut une flamme : une torche, allum\xE9e ou dans le sac.":"You need a flame: a torch, lit or in your bag.","Sous la grille, tr\xE8s loin, tr\xE8s bas\u2026 une cloche sonne. La cloche de Leutenheim !":"Under the grate, far, far below\u2026 a bell rings. The bell of Leutenheim!","Vous attrapez la poule d'or ! Elle caqu\xE8te, outr\xE9e.":"You catch the golden hen! She clucks, outraged.","C\xF4t c\xF4t ! La poule d'or d\xE9tale. Approchez-la sans vous montrer.":"Cluck cluck! The golden hen bolts. Sneak up on her without showing yourself.","Vous coiffez l'\xE9pouvantail de votre casque. Il a l'air ravi. Enfin, il a l'air.":"You put your helmet on the scarecrow. He looks delighted. Well, he looks.","Il vous faut un casque dans le sac.":"You need a helmet in your bag.","\xAB AU VOLEUR ! \xBB Gluck se r\xE9veille en sursaut, et tout le cellier avec lui.":"\u201CTHIEF!\u201D Gluck wakes with a start, and the whole cellar with him.","Ferme de Grum":"Grum's farm","Partie {0}":"Game {0}","\xAB Et si je chassais ton concurrent ? \xBB":"\u201CWhat if I chased off your competitor?\u201D","\xAB Il te faut un local ? Je m'en occupe. \xBB":"\u201CYou need a shop? I'll handle it.\u201D","\xAB Que dois-je faire, ma\xEEtre ? \xBB":"\u201CWhat should I do, master?\u201D","\xAB Un Kobold vend des pommes moins cher que moi, l\xE0-bas. Moins cher ! \xBB":"\u201CA Kobold sells apples cheaper than me, over there. Cheaper!\u201D","\xAB Pousse-le hors de sa salle. Trois fois. Ne le tue pas : c'est un coll\xE8gue. \xBB":"\u201CPush him out of his room. Three times. Don't kill him: he's a colleague.\u201D","\xAB Mon concurrent ? Je n'ai pas de concurrent. Je suis le meilleur. \xBB":"\u201CMy competitor? I have no competitor. I'm the best.\u201D","\xAB Un local ! Celui-l\xE0, sur la carte. Il est un peu\u2026 habit\xE9. \xBB":"\u201CA shop! That one, on the map. It's a bit\u2026 occupied.\u201D","\xAB Videz-le, et j'y pose mon \xE9tal. Le premier b\xE9n\xE9fice est pour vous. \xBB":"\u201CClear it out, and I'll set up my stall. The first profit is yours.\u201D","(La salle appara\xEEt sur la carte.)":"(The room appears on the map.)","\xAB Tous les locaux sont vides ? Alors je reste ici. \xBB":"\u201CAll the shops are empty? Then I'll stay here.\u201D","\xAB Va t'asseoir pr\xE8s d'un banc. N'importe lequel. Et r\xE9fl\xE9chis. Cinq tours. \xBB":"\u201CGo sit by a bench. Any bench. And think. Five turns.\u201D","\xAB La v\xE9rit\xE9 vient \xE0 ceux qui ne bougent pas. Et qui n'ont pas de monstre en vue. \xBB":"\u201CTruth comes to those who don't move. And who have no monster in sight.\u201D","\xAB Le silence est une r\xE9ponse. \xBB":"\u201CSilence is an answer.\u201D","\xAB Mentir pour toi ? Je ne peux pas ! \u2026 Mais je peux r\xE9p\xE9ter ce qu'on me dit. \xBB":"\u201CLie for you? I can't! \u2026 But I can repeat what I'm told.\u201D","\xAB Am\xE8ne-moi un Kobold. Vivant. Ici. Pousse-le, attire-le. \xBB":"\u201CBring me a Kobold. Alive. Here. Push it, lure it.\u201D","\xAB Me d\xE9noncer ? \u2026 Pour \xE7a, il faut qu'un de mes camarades vienne jusqu'ici. Sans te voir. \xBB":"\u201CTurn me in? \u2026 For that, one of my old mates has to come here. Without seeing you.\u201D","\xAB Je te pr\xE9viens : je vais le lui dire. C'est vrai. \xBB":"\u201CI warn you: I'll tell him. It's true.\u201D","\xAB Mon coursier porte ta mise jusqu'\xE0 l'escalier. Il a peur de tout. \xBB":"\u201CMy runner carries your stake to the stairs. He's scared of everything.\u201D","\xAB Reste pr\xE8s de lui : il n'avance qu'avec toi. Et pas de monstre \xE0 c\xF4t\xE9 de lui. \xBB":"\u201CStay near him: he only moves with you. And no monster next to him.\u201D","Jouer ({0} or)":"Play ({0} gold)","Observer le jeu des gobelets":"Watch the cup game","Analyser les r\xE8gles":"Analyse the rules","Renverser la table":"Flip the table","\xAB Revenez quand vous voulez perdre ! \xBB":"\u201CCome back whenever you want to lose!\u201D","Vous montrez le gobelet de gauche. La bille est dessous !":"You point at the left cup. The ball is under it!","\xAB \u2026 Impossible. \xBB Il paie, la m\xE2choire serr\xE9e. (Trois fois la mise.)":"\u201C\u2026 Impossible.\u201D He pays, jaw clenched. (Three times the stake.)","Vous montrez le gobelet du milieu. Vide.":"You point at the middle cup. Empty.","\xAB Pas de chance ! Encore une ? \xBB":"\u201CNo luck! Another round?\u201D","Vous regardez ses mains\u2026 et la caisse. Elle a boug\xE9 toute seule.":"You watch his hands\u2026 and the crate. It moved by itself.","(Un complice se cache dans la salle : fouillez-la.)":"(An accomplice is hiding in the room: search it.)","Ses mains vont trop vite. Mais il y a quelqu'un d'autre, ici. Vous en \xEAtes s\xFBr.":"His hands are too fast. But someone else is here. You're sure of it.","(Fouillez la salle.)":"(Search the room.)","Vous regardez. Vous ne voyez rien.":"You watch. You see nothing.","\xAB Les r\xE8gles ? Simples : la bille est sous un gobelet. \xBB \u2026 Sauf que ce gobelet-l\xE0 a un double fond.":"\u201CThe rules? Simple: the ball is under a cup.\u201D \u2026 Except that cup has a false bottom.","Le vrai, le truqu\xE9, il le range dans son tripot. Derri\xE8re le rideau.":"The real one, the rigged one, he keeps in his den. Behind the curtain.","(Le rideau appara\xEEt sur la carte.)":"(The curtain appears on the map.)","Les r\xE8gles vous \xE9chappent. Elles changent \xE0 chaque partie, on dirait.":"The rules escape you. They seem to change every round.","Vous renversez la caisse ! Les gobelets roulent. Aucun n'a de bille.":"You flip the crate! The cups roll. None of them has a ball.","\xAB GARDES ! \xBB Deux Kobolds accourent.":"\u201CGUARDS!\u201D Two Kobolds come running.","Vous renversez\u2026 presque la caisse. Elle \xE9tait clou\xE9e.":"You flip\u2026 almost flip the crate. It was nailed down.","\xAB GARDES ! \xBB":"\u201CGUARDS!\u201D",Fifrelin:"Fifrelin","Un Kobold en gilet rouge et chapeau haut de forme caboss\xE9. Il fait le jeu des trois gobelets sur une caisse, et il triche. Son tripot est cach\xE9 derri\xE8re un rideau.":"A Kobold in a red waistcoat and a battered top hat. He runs the three-cup game on a crate, and he cheats. His den is hidden behind a curtain.","Un Kobold en gilet rouge, chapeau haut de forme caboss\xE9, fait tourner trois gobelets sur une caisse.":"A Kobold in a red waistcoat and a battered top hat spins three cups on a crate.","\xAB Approchez, approchez ! O\xF9 est la bille ? Dix pi\xE8ces la partie ! \xBB":"\u201CStep up, step up! Where's the ball? Ten coins a round!\u201D","\xAB Personne ne gagne jamais. C'est ce qui rend le jeu si palpitant. \xBB":"\u201CNobody ever wins. That's what makes it so thrilling.\u201D","Gobelet truqu\xE9":"Rigged cup","Un gobelet de cuivre \xE0 double fond. La bille n'y est jamais. \xC0 rapporter \xE0 Fifrelin.":"A copper cup with a false bottom. The ball is never there. Bring it to Fifrelin.","Chasser le Kobold marchand {0}/{1}":"Chase off the Kobold trader {0}/{1}","\xAB Il vend des pommes moins cher que moi ! Pousse-le hors de sa salle. Trois fois. Sans le tuer : c'est un coll\xE8gue. \xBB":"\u201CHe sells apples cheaper than me! Push him out of his room. Three times. Don't kill him: he's a colleague.\u201D","\xAB Il est parti ? Ha ! La concurrence, c'est termin\xE9. \xBB":"\u201CHe's gone? Ha! No more competition.\u201D","\xAB Pour toi, d\xE9sormais : la pomme \xE0 3 pi\xE8ces. Pour toujours. Enfin, pour cette partie. \xBB":"\u201CFor you, from now on: apples at 3 coins. Forever. Well, for this run.\u201D","Le Kobold marchand vend toujours ses pommes moins cher.":"The Kobold trader still sells his apples cheaper.","Lib\xE9rer une salle pour l'\xE9tal de Gluck {0}/{1}":"Clear a room for Gluck's stall {0}/{1}","\xAB Il me faut un local. Celle-l\xE0, sur la carte. Sans locataires, si possible. \xBB":"\u201CI need a shop. That one, on the map. Without tenants, if possible.\u201D","\xAB Un local ! Avec vue sur le donjon ! \xBB":"\u201CA shop! With a view of the dungeon!\u201D","\xAB Premier b\xE9n\xE9fice : pour toi. \xBB":"\u201CFirst profit: for you.\u201D","(Il laisse de l'or et deux pommes.)":"(He leaves gold and two apples.)","Gluck n'aura jamais son \xE9tal.":"Gluck will never have his stall.","R\xE9fl\xE9chir \xE0 c\xF4t\xE9 d'un banc {0}/{1}":"Think beside a bench {0}/{1}","\xAB Va t'asseoir pr\xE8s d'un banc. R\xE9fl\xE9chis. Cinq tours. Sans monstre en vue, sinon \xE7a ne compte pas. \xBB":"\u201CGo sit by a bench. Think. Five turns. No monster in sight, or it doesn't count.\u201D","\xAB Alors ? Tu as compris ? \u2026 Moi non plus. Mais \xE7a fait du bien. \xBB":"\u201CSo? Did you understand? \u2026 Me neither. But it feels good.\u201D","(Les pi\xE8ges cach\xE9s de l'\xE9tage se montrent. Chance : vos 3 prochains 1 au d\xE9 seront relanc\xE9s.)":"(The level's hidden traps show themselves. Luck: your next 3 natural 1s will be rerolled.)","La r\xE9flexion de Gluck restera inachev\xE9e.":"Gluck's reflection will remain unfinished.","Amener un Kobold jusqu'\xE0 Krik":"Bring a Kobold to Krik","\xAB Il me faut un t\xE9moin. Un Kobold, vivant, ici, \xE0 c\xF4t\xE9 de moi. Pousse-le, attire-le. \xBB":"\u201CI need a witness. A Kobold, alive, here, next to me. Push it, lure it.\u201D","Krik se tourne vers le Kobold : \xAB L'aventurier ? Parti. Tr\xE8s loin. Il a peur de vous. \xBB":"Krik turns to the Kobold: \u201CThe adventurer? Gone. Very far. He's scared of you.\u201D","Krik n'a pas eu son t\xE9moin.":"Krik never got his witness.","Amener un Kobold jusqu'\xE0 Krik, cach\xE9":"Bring a Kobold to Krik, hidden","Toucher la prime":"Collect the bounty","\xAB Tu veux me d\xE9noncer ? \u2026 Alors fais venir un de mes camarades ici. Sans qu'il te voie. Je ne peux pas t'en emp\xEAcher. \xBB":"\u201CYou want to turn me in? \u2026 Then bring one of my old mates here. Without him seeing you. I can't stop you.\u201D","\xAB H\xC9 ! IL EST L\xC0 ! \xBB crie le Kobold. Krik d\xE9tale.":"\u201CHEY! HE'S HERE!\u201D shouts the Kobold. Krik bolts.","Une bourse tombe \xE0 vos pieds : \xAB La prime. Merci, l'humain. \xBB":"A purse lands at your feet: \u201CThe bounty. Thanks, human.\u201D","Krik court toujours.":"Krik is still on the run.","Escorter le coursier jusqu'\xE0 l'escalier":"Escort the runner to the stairs","\xAB Mon coursier porte ta mise jusqu'\xE0 l'escalier. Il a peur de tout : reste pr\xE8s de lui, il n'avance qu'avec toi. \xBB":"\u201CMy runner carries your stake to the stairs. He's scared of everything: stay near him, he only moves with you.\u201D","\xAB Il est pass\xE9 ! Ta mise t'attend \xE0 l'\xE9tage suivant. Doubl\xE9e. Je le pense vraiment. \xBB":"\u201CHe made it! Your stake awaits you on the next level. Doubled. I really mean it.\u201D","Le coursier de Krik s'est perdu, avec votre mise.":"Krik's runner got lost, with your stake.","D\xE9masquer le complice (fouiller la salle)":"Unmask the accomplice (search the room)","Revoir Fifrelin":"Back to Fifrelin","\xAB Un complice ? Moi ? Fouillez donc, fouillez ! Vous ne trouverez rien. \xBB":"\u201CAn accomplice? Me? Search away, search! You won't find anything.\u201D","\xAB \u2026 Bon. Il \xE9tait sous la caisse. C'est mon cousin. \xBB":"\u201C\u2026 Fine. He was under the crate. He's my cousin.\u201D","\xAB Votre mise, trois fois. Et pas un mot. \xBB":"\u201CYour stake, three times over. And not a word.\u201D","(Il laisse de l'or.)":"(He leaves gold.)","Le complice de Fifrelin court toujours.":"Fifrelin's accomplice is still at large.","Voler le gobelet truqu\xE9":"Steal the rigged cup","Confondre Fifrelin":"Expose Fifrelin","\xAB Mon tripot ? Derri\xE8re le rideau. Personne n'y entre. Personne. \xBB":"\u201CMy den? Behind the curtain. Nobody goes in. Nobody.\u201D","Vous posez le gobelet truqu\xE9 sur la caisse. Double fond. Fifrelin bl\xEAmit.":"You set the rigged cup on the crate. False bottom. Fifrelin goes pale.","\xAB D'accord, d'accord. Prenez la caisse. Et partez. \xBB":"\u201CFine, fine. Take the cash box. And go.\u201D","Le gobelet truqu\xE9 de Fifrelin reste dans son tripot.":"Fifrelin's rigged cup stays in his den.","Tenir t\xEAte aux gardes {0}/{1}":"Stand up to the guards {0}/{1}","\xAB Mes gardes vont vous apprendre la politesse ! \xBB":"\u201CMy guards will teach you some manners!\u201D","\xAB Mes gardes\u2026 Bon. La caisse est \xE0 vous. Le jeu est ferm\xE9. \xBB":"\u201CMy guards\u2026 Fine. The cash box is yours. The game is closed.\u201D","(Il laisse sa caisse.)":"(He leaves his cash box.)","Fifrelin a rouvert son jeu, un \xE9tage plus haut.":"Fifrelin reopened his game, one level up.","Sous la caisse retourn\xE9e, un Kobold ! Le complice de Fifrelin bondit sur vous.":"Under the upturned crate, a Kobold! Fifrelin's accomplice leaps at you.","Le coursier file dans l'escalier avec votre mise. \xAB \xC0 l'\xE9tage suivant ! \xBB":"The runner dashes down the stairs with your stake. \u201CSee you on the next level!\u201D","Un monstre attrape le coursier : il l\xE2che tout et s'enfuit. Votre mise est perdue.":"A monster grabs the runner: he drops everything and flees. Your stake is lost.","La fiole \xE9clate : la jouvence \xE9clabousse la cr\xE9ature\u2026 qui reprend toutes ses forces. Oups.":"The vial bursts: the youth potion splashes the creature\u2026 which regains all its strength. Oops.","La fiole \xE9clate : la cr\xE9ature, asperg\xE9e de vitesse, s'agite dans tous les sens.":"The vial bursts: the creature, splashed with speed, thrashes about wildly.","La fiole \xE9clate : la potion se r\xE9pand sur les dalles, parmi les \xE9clats de verre.":"The vial bursts: the potion spreads over the flagstones, among shards of glass.","Le jeu de Fifrelin":"Fifrelin's game","Objets de qu\xEAte":"Quest items","Mobilier et d\xE9cor":"Furniture and decor","Vous serez une statue pendant 10 tours, sans pouvoir rien faire.":"You will be a statue for 10 turns, unable to do anything.","Pendant 8 tours, vous ne passerez plus les portes.":"For 8 turns, you won't fit through doors.",Prison:"Prison","\xCAtes-vous s\xFBr ? {0} Touchez \xAB Objet \xBB encore une fois pour boire.":"Are you sure? {0} Tap \u201CItem\u201D once more to drink.","\xCAtes-vous s\xFBr ?":"Are you sure?","Par un creux du mur, vous apercevez\u2026 une pi\xE8ce, de l'autr  vous avez l'avantage. Un anneau rouge autour de vous : c'est lui.","Jamais les deux camps \xE0 la fois : si chacun a une raison, elles s'annulent."]},{title:"D\xE9savantage",lines:["On lance deux d20 et on garde le pire.","Tirer avec un ennemi au contact, ou sur une cible qu'on ne voit pas.","Une pierre de fronde contre un h\xE9ros abrit\xE9 derri\xE8re une colonne ou un meuble."]},{title:"Les deux \xE0 la fois",lines:["Ils s'annulent : un seul d20."]}]},{title:"Attaque d'opportunit\xE9",intro:"S'\xE9loigner d'un monstre qui vous a rep\xE9r\xE9 lui offre un coup gratuit, et votre d\xE9placement s'arr\xEAte.",entries:[{title:"Passer une porte",lines:["En y entrant ou en en sortant : pas de coup."]},{title:"Se d\xE9gager",lines:["Dans la barre d'actions : un saut de deux cases, sans coup. Il faut r\xE9ussir un jet d'Agilit\xE9."]}]},{title:"Cloches et alerte",intro:"Chaque \xE9tage a son niveau d'alerte : la cloche en haut de l'\xE9cran. Le temps et le bruit le font monter.",entries:[{title:"Le bruit",lines:["Une porte enfonc\xE9e, le gravier, l'eau, les coups \xE9chang\xE9s."]},{title:"Les paliers",lines:["La cloche sonne \xE0 chaque palier.","Agit\xE9, puis Alerte : des renforts arrivent, de plus en plus vite.","Traque : tout l'\xE9tage sait o\xF9 vous \xEAtes."]},{title:"La cloche d'alarme",lines:["Sur certains \xE9tages, une cloche sur son support. Ce n'est pas la cloche vol\xE9e de Leutenheim : une simple cloche \xE0 vache. La sonner : l'alerte grimpe d'un palier et les monstres alentour accourent."]},{title:"Toucher la cloche du haut",lines:["Elle dit ce que fait le palier en cours."]}]}];var Zi=[["Armes de corps \xE0 corps",["melee"]],["Armes \xE0 distance et munitions",["ranged","ammo"]],["Armures",["armor"]],["Heaumes",["hat"]],["Amulettes",["amulet"]],["Artefacts et bibelots",["artifact"]],["Sacs",["bag"]],["Potions et vivres",["use"]],["Pierres pr\xE9cieuses et or",["gem","gold"]],["Divers",["key","quest"]]],Go=[{id:"gluck",name:"Gluck",color:"#e6dcc0",des
