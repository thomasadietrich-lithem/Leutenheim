<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Leutenheim — démo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Interface rétro : police à gros pixels, angles droits, cadres biseautés, pas d'arrondis ni de transparences douces. */
  :root {
    --ink: #e8dcc0; --dim: #9c8f74; --gold: #e0b040; --panel: #1b1612; --panel-hi: #5a4a2a; --panel-lo: #0c0906;
    --btn: #3b2f20; --btn-hi: #7a6238; --btn-lo: #17110a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #070605; color: var(--ink);
    font-family: "VT323", "Courier New", ui-monospace, monospace; font-size: 18px; line-height: 1.1; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas, button, .card { outline: none; }
  .col { position: relative; width: min(100%, calc((100vh - 225px) * 9 / 13), 420px); display: flex; flex-direction: column; gap: 6px; }
  [hidden] { display: none !important; }

  /* Cadre biseauté commun aux panneaux. */
  .frame, .panel, .hp, #menu, #bag, #detail, #over {
    border: 3px solid var(--panel-hi); box-shadow: inset 0 0 0 2px var(--panel-lo), 0 0 0 2px var(--panel-lo); }

  #hud-text { font-size: 19px; text-align: center; letter-spacing: 0.04em; color: var(--gold); text-transform: uppercase; }
  .hp { height: 12px; background: #2a0c10; padding: 0; }
  #hp-fill { height: 100%; width: 100%; background: repeating-linear-gradient(to right, #c8323c 0 6px, #8e1f28 6px 8px); }
  .frame { position: relative; aspect-ratio: 9 / 13; overflow: hidden; background: #070605; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; image-rendering: pixelated; }

  /* Boutons : pavés biseautés, texte en capitales. */
  button { font: inherit; font-size: 19px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); cursor: pointer; white-space: nowrap;
    background: var(--btn); border: 0; border-radius: 0; padding: 7px 10px;
    box-shadow: inset 2px 2px 0 var(--btn-hi), inset -2px -2px 0 var(--btn-lo), 0 0 0 2px var(--panel-lo); }
  button:active { box-shadow: inset -2px -2px 0 var(--btn-hi), inset 2px 2px 0 var(--btn-lo), 0 0 0 2px var(--panel-lo); transform: translateY(1px); }
  button.active { background: #6b4a12; color: #fff3c8; }
  button.ghost { background: #241c14; color: var(--dim); }

  .overlay { position: absolute; inset: 0; background: #0d0a08; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 16px; }
  #over { inset: 18% 8%; background: #140808; border-color: #7a2a2a; font-size: 22px; }
  #recenter { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); padding: 6px; display: flex; }
  #recenter:active { transform: translateX(-50%) translateY(1px); }
  #recenter svg { width: 28px; height: 28px; }
  #door-actions { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
  #door-actions button { background: #4a2f12; }

  /* Dés et journal. */
  .panel { display: flex; gap: 8px; align-items: stretch; min-height: 84px; background: var(--panel); padding: 6px; }
  .dice { flex: 0 0 auto; min-width: 56px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .dice-row { display: flex; gap: 4px; }
  .die { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 34px;
    background: #0c0906; color: var(--dim); border: 3px solid #4a3e2a; box-shadow: inset 2px 2px 0 #000; }
  .die.hit { border-color: #5fd38d; color: #5fd38d; }
  .die.miss { border-color: #8a8070; color: #d8ccb0; }
  .die.crit { border-color: var(--gold); color: #fff3c8; background: #4a3408; }
  .die.foe { background: #2a0c10; }
  .die.rolling { border-color: #fff; color: #fff; animation: roll 0.16s steps(4) infinite; }
  .die.land { animation: land 0.2s steps(3); }
  .die.dropped { opacity: 0.4; transform: scale(0.8); border-color: #4a3e2a; color: var(--dim); }
  @keyframes roll { 0% { transform: rotate(-14deg); } 25% { transform: rotate(10deg) translateY(-4px); }
    50% { transform: rotate(-8deg); } 75% { transform: rotate(12deg) translateY(3px); } 100% { transform: rotate(-14deg); } }
  @keyframes land { 0% { transform: scale(1.5); } 60% { transform: scale(0.9); } 100% { transform: scale(1); } }
  #die-who { font-size: 15px; color: var(--dim); height: 15px; white-space: nowrap; text-transform: uppercase; }
  #die-who.advantage { color: var(--gold); }
  #die-who.disadvantage { color: #ff6b7a; }
  #log { flex: 1; font-size: 16px; line-height: 1.05; color: var(--dim); display: flex; flex-direction: column; justify-content: flex-end; }
  #log div:last-child { color: var(--ink); }

  .bar { display: flex; align-items: stretch; gap: 6px; }
  .bar button { flex: 1; padding: 8px 4px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .bar button { min-height: 44px; font-size: 24px; }
  .bar button svg { height: 30px; width: auto; flex: none; }

  /* Menus. */
  #menu { z-index: 2; }
  #menu section { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #menu h1 { margin: 0; font-size: 56px; font-weight: 400; letter-spacing: 0.08em; color: var(--gold); text-shadow: 3px 3px 0 #5a3a08; }
  #menu h2, #bag h2 { margin: 0 0 4px; font-size: 32px; font-weight: 400; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 2px 2px 0 #5a3a08; }
  #menu h3 { margin: 6px 0 0; font-size: 18px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); align-self: flex-start; }
  #menu p { margin: 0 0 14px; font-size: 18px; color: var(--dim); }
  #menu section > button, #detail > button { width: 220px; padding: 10px; font-size: 22px; }
  #seed { font-size: 15px; color: #6a5f4a; margin-top: 8px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .card { position: relative; background: var(--panel); padding: 26px 4px 8px; min-height: 108px; cursor: pointer; text-align: center;
    border: 3px solid #4a3e2a; box-shadow: inset 0 0 0 2px var(--panel-lo); }
  .card.selected { border-color: var(--gold); background: #2a2010; }
  .card.locked { filter: grayscale(1) brightness(0.6); cursor: default; }
  .card-name { font-size: 22px; color: #fff3c8; margin-bottom: 2px; text-transform: uppercase; }
  .card-info { font-size: 16px; color: var(--dim); }
  .card-soon { font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin-top: 2px; }
  .card .more { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; padding: 0; font-size: 22px; line-height: 1; }
  #detail { z-index: 3; }
  #detail-body { display: flex; flex-direction: column; gap: 4px; font-size: 18px; text-align: left; max-width: 310px; }
  #detail-body div:first-child { color: var(--dim); margin-bottom: 4px; }

  /* Sac : cases en creux, objets en gros pixels. */
  #bag { z-index: 2; }
  #bag-grid { --cols: 6; --rows: 4; position: relative; width: min(100%, 318px); aspect-ratio: var(--cols) / var(--rows);
    background-color: #0c0906; border: 3px solid var(--panel-hi); box-shadow: inset 0 0 0 2px var(--panel-lo); cursor: pointer;
    background-image: linear-gradient(to right, #2e261a 2px, transparent 2px), linear-gradient(to bottom, #2e261a 2px, transparent 2px);
    background-size: calc(100% / var(--cols)) calc(100% / var(--rows)); }
  .bag-item { position: absolute; padding: 5px; background: #241c14; box-shadow: inset 2px 2px 0 #4a3e2a, inset -2px -2px 0 #0c0906;
    display: flex; align-items: center; justify-content: center; }
  .bag-item svg { width: 100%; height: 100%; }
  .bag-item.equipped { box-shadow: inset 0 0 0 2px #5fd38d; }
  .bag-item.selected { background: #3a2c14; box-shadow: inset 0 0 0 2px var(--gold); }
  .bag-count { position: absolute; right: 4px; bottom: 0; font-size: 20px; color: #fff; text-shadow: 2px 2px 0 #000; }
  /* Ce que le héros porte : amulette et chapeau en haut, arme, armure, arc en bas. */
  #bag { gap: 6px; justify-content: flex-start; padding-top: 10px; }
  #bag h3 { margin: 2px 0 0; font-size: 18px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }
  #doll { display: grid; grid-template-columns: repeat(3, 76px); grid-template-areas: "amulet hat ." "melee armor ranged"; gap: 4px 10px; }
  .slot { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .slot-amulet { grid-area: amulet; } .slot-hat { grid-area: hat; } .slot-armor { grid-area: armor; }
  .slot-melee { grid-area: melee; } .slot-ranged { grid-area: ranged; }
  .slot-box { width: 64px; height: 64px; padding: 4px; background: #0c0906; border: 3px solid var(--panel-hi);
    box-shadow: inset 2px 2px 0 #000; display: flex; align-items: center; justify-content: center; }
  .slot-box svg { height: 100%; width: auto; max-width: 100%; }
  .slot.empty .slot-box { border-color: #3a3020; }
  .slot.selected .slot-box { border-color: var(--gold); background: #3a2c14; }
  .slot-label { font-size: 14px; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  #bag-info { min-height: 58px; width: min(100%, 318px); font-size: 17px; color: var(--dim); text-align: left; }
  .bag-name { color: #fff3c8; font-size: 21px; text-transform: uppercase; }
  .bag-buttons { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="col">
  <div id="hud-text"></div>
  <div class="hp"><div id="hp-fill"></div></div>
  <div class="frame">
    <canvas id="game"></canvas>
    <button id="recenter" type="button" hidden></button>
    <div id="door-actions" hidden>
      <button id="door-key" type="button" hidden>Utiliser la clef</button>
      <button id="door-pick" type="button">Crocheter</button>
      <button id="door-break" type="button">Enfoncer</button>
    </div>
    <div id="over" class="overlay" hidden>
      <div id="over-text"></div>
      <button id="over-new-run" type="button">Nouvelle partie</button>
    </div>
  </div>
  <div class="panel">
    <div class="dice"><div class="dice-row"><div id="die" class="die"></div><div id="die2" class="die" hidden></div></div><div id="die-who"></div></div>
    <div id="log"></div>
  </div>
  <div class="bar">
    <button id="wait" type="button"></button>
    <button id="aim" type="button"></button>
    <button id="open-bag" type="button"></button>
    <button id="open-menu" type="button"></button>
  </div>
  <div id="bag" class="overlay" hidden>
    <h2>Équipement</h2>
    <div id="doll"></div>
    <h3>Sac</h3>
    <div id="bag-grid"></div>
    <div id="bag-info"></div>
    <div class="bag-buttons">
      <button id="bag-equip" type="button" hidden></button>
      <button id="bag-close" type="button">Fermer</button>
    </div>
  </div>
  <div id="menu" class="overlay">
    <section id="screen-main">
      <h1>LEUTENHEIM</h1>
      <p>Démo de travail</p>
      <button id="menu-resume" type="button" hidden>Reprendre</button>
      <button id="menu-new" type="button">Nouvelle partie</button>
      <button id="menu-settings" type="button">Paramètres</button>
      <span id="seed"></span>
    </section>
    <section id="screen-new" hidden>
      <h2>Nouvelle partie</h2>
      <h3>Race</h3>
      <div id="race-cards" class="cards"></div>
      <h3>Classe</h3>
      <div id="class-cards" class="cards"></div>
      <button id="new-start" type="button">Commencer</button>
      <button id="new-back" type="button" class="ghost">Retour</button>
    </section>
    <section id="screen-settings" hidden>
      <h2>Paramètres</h2>
      <button id="settings-sound" type="button"></button>
      <button id="settings-back" type="button" class="ghost">Retour</button>
    </section>
    <div id="detail" class="overlay" hidden>
      <h2 id="detail-title"></h2>
      <div id="detail-body"></div>
      <button id="detail-close" type="button">Fermer</button>
    </div>
  </div>
</div>
<script>
"use strict";
(() => {
  // src/audio/sfx.ts
  var Sfx = class {
    constructor() {
      this.enabled = true;
      this.ctx = null;
      this.crackleDebt = 0;
    }
    /** À appeler depuis un geste du joueur (toucher, clic) : les navigateurs n'autorisent le son qu'ainsi. */
    unlock() {
      try {
        if (!this.ctx) {
          const Ctor = window.AudioContext ?? window.webkitAudioContext;
          this.ctx = new Ctor();
        }
        if (this.ctx.state === "suspended") void this.ctx.resume();
      } catch {
        this.ctx = null;
      }
    }
    tone(from, to, duration, wave, volume, delay = 0) {
      const ctx = this.ctx;
      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t + duration);
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(1e-3, t + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.02);
    }
    noise(duration, volume, cutoff, delay = 0) {
      const ctx = this.ctx;
      const t = ctx.currentTime + delay;
      const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = cutoff;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(1e-3, t + duration);
      src.connect(filter).connect(gain).connect(ctx.destination);
      src.start(t);
    }
    /**
     * Crépitement des torches, à appeler à chaque image. `level` (0 à 1) est l'éclairage reçu par le héros :
     * plus il est près d'une torche, plus les crépitements sont forts et nombreux.
     */
    crackle(level, dt) {
      if (!this.enabled || !this.ctx || this.ctx.state !== "running" || level <= 0.03) return;
      this.crackleDebt += dt * 22e-4 * (0.3 + level) * (0.4 + 1.2 * Math.random());
      while (this.crackleDebt >= 1) {
        this.crackleDebt -= 1;
        try {
          this.noise(0.03 + Math.random() * 0.05, (6e-3 + Math.random() * 0.018) * level, 700 + Math.random() * 1300, Math.random() * 0.08);
        } catch {
          return;
        }
      }
    }
    play(name) {
      if (!this.enabled || !this.ctx || this.ctx.state !== "running") return;
      try {
        switch (name) {
          case "step":
            this.noise(0.04, 0.05, 700);
            break;
          case "dice":
            for (let i = 0; i < 6; i++) this.noise(0.03, 0.12, 2400 - i * 150, i * 0.06);
            break;
          case "hit":
            this.noise(0.05, 0.22, 2600);
            this.tone(190, 70, 0.12, "triangle", 0.28);
            this.tone(1700, 1250, 0.07, "triangle", 0.06, 0.01);
            break;
          case "miss":
            this.noise(0.07, 0.05, 1400);
            this.noise(0.1, 0.09, 3200, 0.04);
            break;
          case "crit":
            this.noise(0.08, 0.3, 2800);
            this.tone(170, 45, 0.22, "triangle", 0.38);
            this.tone(1320, 1320, 0.25, "sine", 0.12, 0.04);
            this.tone(1980, 1980, 0.3, "sine", 0.07, 0.06);
            break;
          case "hurt":
            this.noise(0.06, 0.2, 700);
            this.tone(150, 60, 0.18, "sawtooth", 0.14);
            this.tone(90, 55, 0.2, "sine", 0.2, 0.02);
            break;
          case "kill":
            this.tone(260, 60, 0.28, "sawtooth", 0.1);
            this.noise(0.16, 0.14, 450, 0.12);
            break;
          case "death":
            [330, 262, 196, 131].forEach((f, i) => this.tone(f, f * 0.97, 0.3, "triangle", 0.2, i * 0.18));
            break;
          case "notice":
            this.tone(520, 880, 0.09, "square", 0.07);
            break;
          case "door":
            this.noise(0.07, 0.16, 320);
            this.tone(150, 215, 0.17, "triangle", 0.045, 0.03);
            this.noise(0.025, 0.1, 1800, 0.21);
            break;
          case "unlock":
            this.tone(1200, 1200, 0.03, "square", 0.08);
            this.tone(1600, 1600, 0.04, "square", 0.08, 0.09);
            break;
          case "break":
            this.noise(0.35, 0.5, 1400);
            this.tone(130, 38, 0.3, "square", 0.25);
            this.noise(0.3, 0.2, 500, 0.22);
            this.noise(0.4, 0.1, 300, 0.5);
            break;
          case "thud":
            this.noise(0.18, 0.4, 500);
            this.tone(100, 45, 0.16, "sine", 0.32);
            this.noise(0.3, 0.12, 280, 0.2);
            this.noise(0.35, 0.06, 220, 0.45);
            break;
          case "bow":
            this.tone(420, 180, 0.09, "triangle", 0.14);
            this.noise(0.08, 0.06, 3e3, 0.02);
            break;
          case "knock":
            this.noise(0.06, 0.16, 380);
            this.tone(95, 70, 0.07, "sine", 0.12);
            break;
          case "advantage":
            this.tone(784, 784, 0.09, "sine", 0.13);
            this.tone(1175, 1175, 0.16, "sine", 0.13, 0.08);
            break;
          case "disadvantage":
            this.tone(330, 330, 0.1, "triangle", 0.12);
            this.tone(233, 233, 0.18, "triangle", 0.12, 0.09);
            break;
          case "pickup":
            this.tone(660, 990, 0.07, "sine", 0.1);
            break;
          case "descend":
            [392, 330, 262].forEach((f, i) => this.tone(f, f, 0.12, "sine", 0.15, i * 0.09));
            break;
          case "heal":
            [523, 659, 784].forEach((f, i) => this.tone(f, f, 0.18, "sine", 0.12, i * 0.08));
            break;
          case "click":
            this.tone(700, 700, 0.03, "square", 0.05);
            break;
        }
      } catch {
      }
    }
  };

  // src/core/dice.ts
  function rollDice(rng, dice, critical = false) {
    let total = dice.bonus;
    const count = critical ? dice.count * 2 : dice.count;
    for (let i = 0; i < count; i++) total += rng.int(1, dice.sides);
    return Math.max(1, total);
  }
  function diceLabel(d) {
    return `${d.count}d${d.sides}${d.bonus > 0 ? `+${d.bonus}` : d.bonus < 0 ? d.bonus : ""}`;
  }

  // src/data/classes.ts
  var CLASSES = {
    guerrier: {
      id: "guerrier",
      name: "Guerrier",
      available: true,
      tagline: "Encaisse et frappe fort.",
      trait: "Bonne armure, et la force d'enfoncer les portes.",
      hp: 10,
      startingItems: [
        { item: "cotte_mailles", count: 1, equip: true },
        { item: "epee", count: 1, equip: true },
        { item: "arc_court", count: 1, equip: true },
        { item: "fleche", count: 5 }
      ],
      lockpickBonus: 0,
      breakBonus: 4
    },
    assassin: {
      id: "assassin",
      name: "Assassin",
      available: false,
      tagline: "Frappe par surprise.",
      trait: "Gros d\xE9g\xE2ts sur un ennemi qui ne l'a pas remarqu\xE9 ; croch\xE8te facilement.",
      hp: 8,
      startingItems: [
        { item: "armure_cuir", count: 1, equip: true },
        { item: "dague", count: 1, equip: true },
        { item: "arc_court", count: 1, equip: true },
        { item: "fleche", count: 8 }
      ],
      lockpickBonus: 5,
      breakBonus: 0
    },
    magicien: {
      id: "magicien",
      name: "Magicien",
      available: false,
      tagline: "Sorts \xE0 distance, fragile.",
      trait: "Sorts en nombre limit\xE9, recharg\xE9s par le repos.",
      hp: 6,
      startingItems: [
        { item: "robe", count: 1, equip: true },
        { item: "baton", count: 1, equip: true }
      ],
      lockpickBonus: 1,
      breakBonus: -1
    }
  };

  // src/data/floors.ts
  var DEFAULT_FLOOR = {
    width: 32,
    height: 32,
    roomAttempts: 40,
    minRooms: 4,
    roomMinSize: 4,
    roomMaxSize: 8,
    extraLinks: 2,
    wideCorridorChance: 0.3,
    doorChance: 0.6,
    doorSpacing: 5,
    doorDetour: 14,
    // 1 salle : 60 %, 2 salles : 30 %, 3 salles : 10 % → 1,5 en moyenne.
    specialRoomCounts: [
      { count: 1, weight: 6 },
      { count: 2, weight: 3 },
      { count: 3, weight: 1 }
    ],
    specialRoomMinSize: 3,
    specialRoomMaxSize: 5,
    pillarChance: 0.45,
    torchChance: 0.5,
    torchRadius: 6
  };

  // src/data/items.ts
  var SLOTS = [
    { slot: "amulet", label: "Amulette" },
    { slot: "hat", label: "Chapeau" },
    { slot: "armor", label: "Armure" },
    { slot: "melee", label: "Corps \xE0 corps" },
    { slot: "ranged", label: "Distance" }

    screenToTile(px, py) {
      return {
        x: Math.floor((px - this.originX()) / this.tile),
        y: Math.floor((py - this.originY()) / this.tile)
      };
    }
    /**
     * `progress` (0 à 1) est l'avancement de l'animation du tour en cours : chaque acteur glisse
     * de sa case de début de tour vers sa case actuelle. `dt` est le temps écoulé en ms.
     * `ghosts` : monstres déjà vaincus dans les règles mais dont la mort n'a pas encore été montrée.
     */
    draw(game2, progress, dt, ghosts2 = [], aimRange = null) {
      const { ctx, tile } = this;
      this.time += dt;
      this.slashes = this.slashes.filter((s) => (s.age += dt) < SLASH_MS);
      const shown = (a) => {
        const p = { x: a.fromX + (a.x - a.fromX) * progress, y: a.fromY + (a.y - a.fromY) * progress };
        const s = this.slashes.find((sl) => sl.attackerId === a.id);
        if (s) {
          const push = 0.32 * Math.sin(Math.PI * s.age / SLASH_MS);
          p.x += Math.sign(s.x - s.fromX) * push;
          p.y += Math.sign(s.y - s.fromY) * push;
        }
        return p;
      };
      const hero = shown(game2.hero);
      const follow = 1 - Math.exp(-dt / 140);
      this.camX += (hero.x + this.panX - this.camX) * follow;
      this.camY += (hero.y + this.panY - this.camY) * follow;
      const ox = this.originX();
      const oy = this.originY();
      const flicker = 0.85 + 0.1 * Math.sin(this.time / 110) + 0.05 * Math.sin(this.time / 37);
      ctx.fillStyle = COLORS.background;
      ctx.fillRect(0, 0, this.width, this.height);
      const x0 = Math.floor(-ox / tile);
      const y0 = Math.floor(-oy / tile);
      const x1 = Math.ceil((this.width - ox) / tile);
      const y1 = Math.ceil((this.height - oy) / tile);
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          if (!game2.map.inBounds(x, y)) continue;
          const sx = ox + x * tile;
          const sy = oy + y * tile;
          if (!game2.isExplored(x, y)) {
            if (game2.isSensed(x, y)) {
              ctx.fillStyle = COLORS.sensed;
              ctx.fillRect(sx + tile * 0.12, sy + tile * 0.12, tile * 0.76, tile * 0.76);
            }
            continue;
          }
          const t = game2.map.get(x, y);
          const wall = t === Tile.Wall;
          if (t === Tile.Pillar) {
            this.drawFloor(x, y, sx, sy);
            ctx.fillStyle = "rgba(12,11,18,0.45)";
            ctx.beginPath();
            ctx.arc(sx + tile * 0.54, sy + tile * 0.56, tile * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#6e7290";
            ctx.beginPath();
            ctx.arc(sx + tile * 0.5, sy + tile * 0.5, tile * 0.38, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#9296b6";
            ctx.beginPath();
            ctx.arc(sx + tile * 0.46, sy + tile * 0.45, tile * 0.25, 0, Math.PI * 2);
            ctx.fill();
          } else if (wall) {
            this.drawWall(game2, x, y, sx, sy);
          } else {
            this.drawFloor(x, y, sx, sy);
          }
          this.drawFeature(game2, t, x, y, sx, sy);
          const shade = wall || t === Tile.Pillar ? 0.6 : 1;
          if (game2.isVisible(x, y)) {
            const lit = game2.light[game2.map.index(x, y)];
            const glow = Math.max(0, 1 - Math.hypot(x - hero.x, y - hero.y) / (game2.race.darkVision + 1.5));
            const brightness = Math.min(1, Math.max(lit * flicker, glow));
            ctx.fillStyle = `rgba(12,11,18,${((1 - brightness) * 0.55 * shade).toFixed(3)})`;
            ctx.fillRect(sx, sy, tile, tile);
            if (lit > 0) {
              ctx.fillStyle = `rgba(255,150,60,${(lit * flicker * 0.2).toFixed(3)})`;
              ctx.fillRect(sx, sy, tile, tile);
            }
          } else {
            ctx.fillStyle = `rgba(12,11,18,${(0.74 * shade).toFixed(3)})`;
            ctx.fillRect(sx, sy, tile, tile);
          }
        }
      }
      for (const torch of game2.torches) {
        if (!game2.isExplored(torch.x, torch.y)) continue;
        const fx = torch.faceX;
        const fy = torch.faceY;
        const baseX = ox + (torch.x + 0.5 + fx * 0.47) * tile;
        const baseY = oy + (torch.y + 0.5 + fy * 0.47) * tile;
        const cx = ox + (torch.x + 0.5 + fx * 0.22) * tile;
        const cy = oy + (torch.y + 0.5 + fy * 0.22) * tile;
        ctx.strokeStyle = "#6b4a2a";
        ctx.lineWidth = Math.max(2, tile * 0.09);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(ox + (torch.x + 0.5 + fx * 0.32) * tile, oy + (torch.y + 0.5 + fy * 0.32) * tile);
        ctx.stroke();
        ctx.lineCap = "butt";
        ctx.fillStyle = "#ff8a2a";
        ctx.beginPath();
        ctx.arc(cx, cy, tile * 0.16 * flicker, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffe08a";
        ctx.beginPath();
        ctx.arc(cx, cy + tile * 0.02, tile * 0.08 * flicker, 0, Math.PI * 2);
        ctx.fill();
      }
      if (game2.pendingDoor) {
        ctx.strokeStyle = COLORS.lock;
        ctx.lineWidth = 2;
        ctx.strokeRect(ox + game2.pendingDoor.x * tile + 1, oy + game2.pendingDoor.y * tile + 1, tile - 2, tile - 2);
      }
      ctx.fillStyle = COLORS.path;
      game2.path.forEach((p, i) => {
        const last2 = i === game2.path.length - 1;
        ctx.beginPath();
        ctx.arc(ox + (p.x + 0.5) * tile, oy + (p.y + 0.5) * tile, tile * (last2 ? 0.22 : 0.08), 0, Math.PI * 2);
        ctx.fill();
      });
      for (const d of game2.debris) {
        if (!game2.isExplored(d.x, d.y)) continue;
        const left = d.until - game2.turn + (1 - progress);
        ctx.globalAlpha = Math.max(0, Math.min(1, left / RULES.brokenArrowFadeTurns));
        const cx = ox + (d.x + 0.5) * tile;
        const cy = oy + (d.y + 0.5) * tile;
        this.drawArrow(cx + Math.cos(d.angle) * tile * 0.16, cy + Math.sin(d.angle) * tile * 0.16, d.angle + 0.5, tile * 0.7, "front");
        this.drawArrow(cx - Math.cos(d.angle) * tile * 0.16, cy - Math.sin(d.angle) * tile * 0.16, d.angle - 0.35, tile * 0.7, "back");
      }
      ctx.globalAlpha = 1;
      for (const g of game2.ground) {
        if (!game2.isExplored(g.x, g.y)) continue;
        const gx = ox + g.x * tile;
        const gy = oy + g.y * tile;
        if (g.item === "clef") {
          ctx.fillStyle = COLORS.lock;
          ctx.beginPath();
          ctx.arc(gx + tile * 0.36, gy + tile * 0.4, tile * 0.13, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(gx + tile * 0.45, gy + tile * 0.37, tile * 0.3, tile * 0.07);
          ctx.fillRect(gx + tile * 0.66, gy + tile * 0.4, tile * 0.07, tile * 0.13);
          ctx.fillStyle = COLORS.floor;
          ctx.beginPath();
          ctx.arc(gx + tile * 0.36, gy + tile * 0.4, tile * 0.05, 0, Math.PI * 2);
          ctx.fill();
        } else {
          this.drawArrow(gx + tile / 2, gy + tile / 2, g.angle ?? -Math.PI / 4, tile * 0.7);
        }
      }
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const m of [...game2.visibleMonsters(), ...ghosts2]) {
        const p = shown(m);
        const cx = ox + (p.x + 0.5) * tile;
        const cy = oy + (p.y + 0.5) * tile;
        const r = tile * 0.36;
        ctx.fillStyle = MONSTERS[m.defId]?.color ?? "#c04040";
        ctx.beginPath();
        ctx.moveTo(cx, cy - r);
        ctx.lineTo(cx + r, cy);
        ctx.lineTo(cx, cy + r);
        ctx.lineTo(cx - r, cy);
        ctx.closePath();
        ctx.fill();
        if (game2.heroHasAdvantageOn(m)) {
          ctx.strokeStyle = `rgba(255,215,94,${(0.55 + 0.4 * Math.sin(this.time / 160)).toFixed(2)})`;
          ctx.lineWidth = Math.max(2, tile * 0.07);
          ctx.stroke();
        }
        if (!m.alerted) {
          ctx.fillStyle = "#ffffff";
          ctx.font = `${Math.round(tile * 0.55)}px "VT323", "Courier New", monospace`;
          ctx.fillText(m.asleep ? "z" : "?", cx + tile * 0.3, cy - tile * 0.3);
        }
        if (m.hp < m.maxHp) {
          ctx.fillStyle = COLORS.hpBack;
          ctx.fillRect(cx - tile * 0.35, cy - tile * 0.48, tile * 0.7, tile * 0.08);
          ctx.fillStyle = COLORS.hpFill;
          ctx.fillRect(cx - tile * 0.35, cy - tile * 0.48, tile * 0.7 * Math.max(0, m.hp / m.maxHp), tile * 0.08);
        }
      }
      if (aimRange !== null) {
        ctx.strokeStyle = "#ffd75e";
        ctx.lineWidth = Math.max(2, tile * 0.07);
        for (const m of game2.visibleMonsters()) {
          if (Math.max(Math.abs(m.x - game2.hero.x), Math.abs(m.y - game2.hero.y)) > aimRange) continue;
          const p = shown(m);
          const x02 = ox + p.x * tile + 1;
          const y02 = oy + p.y * tile + 1;
          const s = tile - 2;
          const c = tile * 0.28;
          ctx.beginPath();
          for (const [cx, cy, dx, dy] of [[x02, y02, 1, 1], [x02 + s, y02, -1, 1], [x02, y02 + s, 1, -1], [x02 + s, y02 + s, -1, -1]]) {
            ctx.moveTo(cx + dx * c, cy);
            ctx.lineTo(cx, cy);
            ctx.lineTo(cx, cy + dy * c);
          }
          ctx.stroke();
        }
      }
      ctx.fillStyle = COLORS.hero;
      ctx.strokeStyle = COLORS.heroEdge;
      ctx.lineWidth = Math.max(2, tile * 0.08);
      ctx.beginPath();
      ctx.arc(ox + (hero.x + 0.5) * tile, oy + (hero.y + 0.5) * tile, tile * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      if (game2.heroExposed()) {
        ctx.strokeStyle = `rgba(255,90,100,${(0.55 + 0.4 * Math.sin(this.time / 160)).toFixed(2)})`;
        ctx.lineWidth = Math.max(2, tile * 0.07);
        ctx.beginPath();
        ctx.arc(ox + (hero.x + 0.5) * tile, oy + (hero.y + 0.5) * tile, tile * 0.44, 0, Math.PI * 2);
        ctx.stroke();
      }
      this.projectiles = this.projectiles.filter((p) => (p.age += dt) < PROJECTILE_MS);
      for (const p of this.projectiles) {
        if (p.age < 0) continue;
        const t = p.age / PROJECTILE_MS;
        const px = ox + (p.fromX + (p.x - p.fromX) * t + 0.5) * tile;
        const py = oy + (p.fromY + (p.y - p.fromY) * t + 0.5) * tile;
        const heading = Math.atan2(p.y - p.fromY, p.x - p.fromX);
        this.drawArrow(px, py, p.tumble ? heading + Math.PI + t * 7 : heading, tile * 0.7);
      }
      for (const s of this.slashes) {
        if (!s.arc) continue;
        const t = s.age / SLASH_MS;
        const cx = ox + (s.x + 0.5) * tile;
        const cy = oy + (s.y + 0.5) * tile;
        const facing = Math.atan2(s.y - s.fromY, s.x - s.fromX);
        const sweep = Math.min(1, t * 1.6);
        ctx.strokeStyle = s.color;
        ctx.globalAlpha = 1 - t * t;
        ctx.lineCap = "round";
        ctx.lineWidth = Math.max(2, tile * 0.11 * (1 - t * 0.6));
        ctx.beginPath();
        ctx.arc(cx - Math.cos(facing) * tile * 0.25, cy - Math.sin(facing) * tile * 0.25, tile * 0.42, facing - 1.1, facing - 1.1 + 2.2 * sweep);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.lineCap = "butt";
      ctx.font = `${Math.round(Math.max(18, tile * 0.6))}px "VT323", "Courier New", monospace`;
      this.floats = this.floats.filter((f) => (f.age += dt) < FLOAT_MS);
      for (const f of this.floats) {
        const t = f.age / FLOAT_MS;
        ctx.globalAlpha = 1 - t * t;
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(0,0,0,0.7)";
        const fx = ox + (f.x + 0.5) * tile;
        const fy = oy + (f.y + 0.1 - t * 0.8) * tile;
        ctx.strokeText(f.text, fx, fy);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, fx, fy);
      }
      ctx.globalAlpha = 1;
    }
    /**
     * Sol en dalles de pierre : chaque case est une dalle de teinte légèrement différente ; quelques-unes sont
     * fissurées ou parsemées de gravillons. Le tirage est fixe pour une case donnée.
     */
    drawFloor(x, y, sx, sy) {
      const { ctx, tile } = this;
      const light = 0.92 + 0.16 * noise(x, y, 20);
      ctx.fillStyle = `rgb(${Math.round(75 * light)},${Math.round(69 * light)},${Math.round(96 * light)})`;
      ctx.fillRect(sx + 0.5, sy + 0.5, tile - 1, tile - 1);
      const kind = noise(x, y, 21);
      ctx.fillStyle = "rgba(20,18,30,0.45)";
      ctx.strokeStyle = "rgba(20,18,30,0.45)";
      ctx.lineWidth = Math.max(1, tile * 0.03);
      if (kind < 0.09) {
        const ax = 0.15 + 0.3 * noise(x, y, 24);
        const ay = 0.15 + 0.7 * noise(x, y, 25);
        ctx.beginPath();
        ctx.moveTo(sx + ax * tile, sy + ay * tile);
        ctx.lineTo(sx + (ax + 0.2) * tile, sy + (0.3 + 0.4 * noise(x, y, 26)) * tile);
        ctx.lineTo(sx + (ax + 0.42) * tile, sy + (0.2 + 0.6 * noise(x, y, 27)) * tile);
        ctx.stroke();
      } else if (kind < 0.2) {
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(sx + (0.2 + 0.6 * noise(x, y, 30 + i)) * tile, sy + (0.2 + 0.6 * noise(x, y, 40 + i)) * tile, tile * 0.035, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    /**
     * Mur de pierres : trois assises de hauteurs inégales, des joints placés au hasard (mais toujours au même
     * endroit pour une case donnée), des pierres aux coins décalés et de teintes légèrement différentes. Les murs voisins se raccordent :
     * pas de bordure entre deux cases de mur, un rebord clair seulement là où le mur s'arrête.
     */
    drawWall(game2, x, y, sx, sy) {
      const { ctx, tile } = this;
      const gap = Math.max(1, tile * 0.05);
      ctx.fillStyle = COLORS.mortar;
      ctx.fillRect(sx, sy, tile + 0.5, tile + 0.5);
      const levels = [0, 0.29 + 0.1 * noise(y, 0, 4), 0.62 + 0.1 * noise(y, 0, 5), 1];
      ctx.lineJoin = "round";
      for (let r = 0; r < 3; r++) {
        const row = y * 3 + r;
        const cuts = [0, 0.2 + 0.14 * noise(x, row, 1), 0.64 + 0.14 * noise(x, row, 3), 1];
        for (let i = 0; i + 1 < cuts.length; i++) {
          const first = i === 0;
          const last2 = i + 2 === cuts.length;
          const tint = first ? noise(x, row, 9) : last2 ? noise(x + 1, row, 9) : noise(x, row, 10 + i);
          const light = 0.84 + 0.3 * tint;
          const color = `rgb(${Math.round(103 * light)},${Math.round(107 * light)},${Math.round(136 * light)})`;
          const left = sx + cuts[i] * tile + (first ? 0 : gap / 2);
          const right = sx + cuts[i + 1] * tile - (last2 ? -0.5 : gap / 2);
          const top = sy + levels[r] * tile + gap / 2;
          const bottom = sy + levels[r + 1] * tile - gap / 2;
          const j = (k) => (noise(x * 4 + i, row, 50 + k) - 0.5) * tile * 0.07;
          const soft = Math.max(1, tile * 0.05);
          ctx.fillStyle = color;
          ctx.strokeStyle = color;
          ctx.lineWidth = soft;
          ctx.beginPath();
          ctx.moveTo(left + (first ? 0 : soft / 2 + Math.abs(j(0))), top + soft / 2 + Math.abs(j(1)));
          ctx.lineTo(right - (last2 ? 0 : soft / 2 + Math.abs(j(2))), top + soft / 2 + Math.abs(j(3)));
          ctx.lineTo(right - (last2 ? 0 : soft / 2 + Math.abs(j(4))), bottom - soft / 2 - Math.abs(j(5)));
          ctx.lineTo(left + (first ? 0 : soft / 2 + Math.abs(j(6))), bottom - soft / 2 - Math.abs(j(7)));
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      }
      ctx.lineJoin = "miter";
      if (game2.map.inBounds(x, y - 1) && game2.map.get(x, y - 1) !== Tile.Wall) {
        ctx.fillStyle = "rgba(190,196,230,0.35)";
        ctx.fillRect(sx, sy, tile + 0.5, tile * 0.1);
      }
      if (game2.map.inBounds(x, y + 1) && game2.map.get(x, y + 1) !== Tile.Wall) {
        ctx.fillStyle = "rgba(12,11,18,0.4)";
        ctx.fillRect(sx, sy + tile * 0.88, tile + 0.5, tile * 0.12 + 0.5);
      }
    }
    /**
     * Porte : battant de planches cerclé de fer, avec anneau de poignée ou cadenas doré. Le battant est le même
     * partout ; ce qui suit le mur, ce sont les montants de pierre et le côté où le battant se rabat en s'ouvrant.
     */
    drawDoor(game2, t, x, y, sx, sy) {
      const { ctx, tile } = this;
      const sideways = !game2.map.isWalkable(x, y - 1) && !game2.map.isWalkable(x, y + 1);
      ctx.save();
      ctx.translate(sx + tile / 2, sy + tile / 2);
      const u = tile / 16;
      const px = (gx, gy, w2, h2, color) => {
        ctx.fillStyle = color;
        ctx.fillRect((gx - 8) * u, (gy - 8) * u, w2 * u + 0.5, h2 * u + 0.5);
      };
      px(0, 0, 16, 16, "#2a2533");
      if (sideways) {
        px(0, 0, 16, 2, "#8b90b0");
        px(0, 14, 16, 2, "#8b90b0");
      } else {
        px(0, 0, 2, 16, "#8b90b0");
        px(14, 0, 2, 16, "#8b90b0");
      }
      const x0 = sideways ? 1 : 2;
      const y0 = sideways ? 2 : 1;
      const w = sideways ? 14 : 12;
      const h = sideways ? 12 : 14;
      if (t === Tile.DoorOpen) {
        if (sideways) {
          px(x0, y0, w, 3, "#8a5a2b");
          px(x0, y0, w, 1, "#b9824a");
          px(x0 + 3, y0, 1, 3, "#4a4e5e");
          px(x0 + w - 4, y0, 1, 3, "#4a4e5e");
        } else {
          px(x0, y0, 3, h, "#8a5a2b");
          px(x0, y0, 1, h, "#b9824a");
          px(x0, y0 + 3, 3, 1, "#4a4e5e");
          px(x0, y0 + h - 4, 3, 1, "#4a4e5e");
        }
      } else {
        px(x0, y0, w, h, "#8a5a2b");
        for (let gx = x0; gx < x0 + w; gx += 3) px(gx, y0, 1, h, "#b9824a");
        for (let gx = x0 + 2; gx < x0 + w; gx += 3) px(gx, y0, 1, h, "#5a3817");
        for (const gy of [y0 + 2, y0 + h - 4]) {
          px(x0, gy, w, 2, "#4a4e5e");
          px(x0, gy, w, 1, "#7a7f94");
          for (const gx of [x0 + 1, x0 + Math.floor(w / 2), x0 + w - 2]) px(gx, gy, 1, 1, "#c3cbe0");
        }
        if (t === Tile.DoorLocked) {
          px(6, 6, 4, 1, "#f0c050");
          px(6, 6, 1, 2, "#f0c050");
          px(9, 6, 1, 2, "#f0c050");
          px(5, 8, 6, 3, "#f0c050");
          px(5, 10, 6, 1, "#a87c1c");
          px(7, 8, 2, 2, "#1c1410");
        } else {
          px(10, 7, 2, 1, "#c3cbe0");
          px(10, 9, 2, 1, "#c3cbe0");
          px(10, 7, 1, 3, "#c3cbe0");
          px(12, 8, 1, 1, "#c3cbe0");
        }
      }
      ctx.restore();
    }
    /** Escalier, fontaine et coffre, dessinés par-dessus le sol. */
    drawFeature(game2, t, x, y, sx, sy) {
      const { ctx, tile } = this;
      if (t === Tile.StairsDown) {
        ctx.fillStyle = COLORS.stairs;
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(sx + tile * 0.15, sy + tile * (0.2 + i * 0.22), tile * (0.3 + i * 0.2), tile * 0.14);
        }
      } else if (t === Tile.StairsUp) {
        ctx.fillStyle = "#b9c0dc";
        for (let i = 0; i < 3; i++) {
          const w = tile * (0.7 - i * 0.2);
          ctx.fillRect(sx + tile * 0.85 - w, sy + tile * (0.64 - i * 0.22), w, tile * 0.14);
        }
      } else if (t === Tile.DoorClosed || t === Tile.DoorLocked || t === Tile.DoorOpen) {
        this.drawDoor(game2, t, x, y, sx, sy);
      } else if (t === Tile.Fountain || t === Tile.FountainDry) {
        const cx = sx + tile / 2;
        const cy = sy + tile / 2;
        ctx.fillStyle = "#8a8ea8";
        ctx.beginPath();
        ctx.arc(cx, cy, tile * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = t === Tile.Fountain ? "#4fb4e8" : "#3a3c4e";
        ctx.beginPath();
        ctx.arc(cx, cy, tile * 0.28, 0, Math.PI * 2);
        ctx.fill();
        if (t === Tile.Fountain) {
          ctx.fillStyle = "#c8ecff";
          ctx.beginPath();
          ctx.arc(cx - tile * 0.08, cy - tile * 0.08, tile * 0.08, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (t === Tile.Chest || t === Tile.ChestOpen) {
        ctx.fillStyle = COLORS.doorEdge;

      launchArrow(e);
      if (!e.kept) logLines.push("La fl\xE8che se brise.");
      else if (!e.hit) logLines.push(e.via ? "La fl\xE8che rebondit et retombe au sol." : "La fl\xE8che se plante au sol.");
    } else if (e.type === "pickup") {
      logLines.push(`Vous ramassez : ${ITEMS[e.item].name}${e.count > 1 ? ` \xD7${e.count}` : ""}.`);
      sfx.play("pickup");
    } else if (e.type === "death") {
      if (e.actor.kind === "hero") {
        overText.textContent = `Vous \xEAtes mort \xE0 l'\xE9tage ${game.depth}, au tour ${game.turn}.`;
        over.hidden = false;
        sfx.play("death");
      } else {
        ghosts = ghosts.filter((g) => g !== e.actor);
        logLines.push(`${e.actor.name} est vaincu.`);
        sfx.play("kill");
      }
    } else if (e.type === "noticed") {
      renderer.addFloatingText(e.actor.x, e.actor.y, "!", "#ffd75e");
      sfx.play("notice");
    } else if (e.type === "stairs") {
      logLines.push(
        e.direction === "down" ? `Vous descendez \xE0 l'\xE9tage ${game.depth}.${e.healed > 0 ? ` Vous r\xE9cup\xE9rez ${e.healed} PV.` : ""}` : `Vous remontez \xE0 l'\xE9tage ${game.depth}.`
      );
      shownHp = game.hero.hp;
      sfx.play("descend");
    } else if (e.type === "opened") {
      sfx.play("door");
    } else if (e.type === "fountain") {
      logLines.push(e.healed > 0 ? `Vous buvez \xE0 la fontaine : +${e.healed} PV. Elle se tarit.` : "Vous buvez \xE0 la fontaine. Elle se tarit.");
      shownHp = game.hero.hp;
      sfx.play("heal");
    } else if (e.type === "chest") {
      logLines.push("Le coffre est vide pour l'instant : le butin arrive avec les objets.");
      sfx.play("unlock");
    }
    renderLog();
  }
  function advanceCues(dt) {
    for (let guard = 0; guard < 16; guard++) {
      if (!cue) {
        const event = queue.shift();
        if (!event) return;
        cue = { event, time: 0, revealed: false, lastFace: 0 };
        if (isRoll(event)) startRoll(event);
      } else {
        cue.time += dt;
      }
      const roll = isRoll(cue.event) ? ROLL_MS : 0;
      if (!cue.revealed && cue.time < roll) {
        if (cue.time - cue.lastFace >= 55) {
          cue.lastFace = cue.time;
          die.textContent = String(1 + Math.floor(Math.random() * 20));
          die2.textContent = String(1 + Math.floor(Math.random() * 20));
        }
        return;
      }
      if (!cue.revealed) {
        reveal(cue.event);
        cue.revealed = true;
      }
      const hold = isRoll(cue.event) ? byFoe(cue.event) ? HOLD_FOE_MS : HOLD_HERO_MS : 0;
      if (cue.time < roll + hold) return;
      cue = null;
    }
  }
  function collectEvents() {
    for (const e of game.events) {
      if (e.type === "death" && e.actor.kind === "monster") ghosts.push(e.actor);
      queue.push(e);
    }
    game.events.length = 0;
  }
  bindInput(canvas, {
    onTap(px, py) {
      if (menuOpen || bagOpen) return;
      const t = renderer.screenToTile(px, py);
      if (aimMode) {
        const refusal = game.shoot(t.x, t.y);
        if (refusal) {
          const why = {
            "no-bow": "Aucun arc en main.",
            "no-ammo": "Plus de fl\xE8ches.",
            "no-target": "Vous ne voyez pas cet endroit.",
            "out-of-range": `Hors de port\xE9e (${game.weapon("ranged")?.range ?? 0} cases).`
          }[refusal];
          logLines.push(why);
          renderLog();
        } else {
          stepMs = COMBAT_STEP_MS;
          aimMode = false;
        }
        return;
      }
      if (game.setDestination(t.x, t.y)) stepMs = stepDuration(game.path.length);
    },
    onMove(dx, dy) {
      if (menuOpen || bagOpen) return;
      if (game.path.length === 0 && game.moveBy(dx, dy)) stepMs = KEYBOARD_STEP_MS;
    },
    onPan(dx, dy) {
      if (!menuOpen && !bagOpen) renderer.panBy(dx, dy);
    },
    onZoom(factor) {
      renderer.zoomBy(factor);
    }
  });
  window.addEventListener("pointerdown", () => sfx.unlock(), true);
  window.addEventListener("resize", () => renderer.resize());
  function button(id, action) {
    $(id).addEventListener("click", () => {
      sfx.unlock();
      sfx.play("click");
      action();
    });
  }
  button("wait", () => {
    game.wait();
    stepMs = COMBAT_STEP_MS;
  });
  button("over-new-run", () => showScreen("new"));
  var doorButton = (id, action) => button(id, () => game.actOnDoor(action));
  doorButton("door-pick", "pick");
  doorButton("door-break", "break");
  doorButton("door-key", "key");
  button("recenter", () => renderer.recenter());
  button("aim", () => {
    if (!aimMode && game.isThreatened()) {
      logLines.push("Un ennemi est au contact : pas le temps de bander l'arc.");
    } else if (!aimMode && game.arrows() < 1) {
      logLines.push("Plus de fl\xE8ches.");
    } else {
      aimMode = !aimMode;
      if (aimMode) logLines.push("Arc band\xE9 : touchez une cible \xE0 port\xE9e pour tirer.");
    }
    renderLog();
  });
  for (const [id, icon, label] of [
    ["wait", "wait", "Attendre un tour"],
    ["open-bag", "bag", "\xC9quipement et sac"],
    ["open-menu", "menu", "Menu"],
    ["recenter", "recenter", "Recentrer la vue"]
  ]) {
    $(id).replaceChildren(uiIcon(icon));
    $(id).setAttribute("aria-label", label);
    $(id).title = label;
  }
  $("aim").setAttribute("aria-label", "Tirer \xE0 l'arc");
  function itemStats(def) {
    const lines = [];
    if (def.attackBonus !== void 0 && def.damage) {
      lines.push(`Attaque : d20 ${signedBonus(def.attackBonus)} \xB7 D\xE9g\xE2ts : ${diceLabel(def.damage)}`);
    }
    if (def.range) lines.push(`Port\xE9e : ${def.range} cases \xB7 Munition : ${ITEMS[def.ammo].name.toLowerCase()}`);
    if (def.kind === "ammo") lines.push("Munition pour l'arc.");
    if (def.kind === "key") lines.push("Ouvre une porte verrouill\xE9e, sans bruit.");
    return lines;
  }
  function itemNode(item, className) {
    const node = el("div", className);
    node.append(itemIcon(item.defId));
    if (item.count > 1) node.append(el("span", "bag-count", String(item.count)));
    return node;
  }
  function renderBag() {
    const bag = game.inventory;
    const selectedUid = selected && "uid" in selected ? selected.uid : null;
    const selectedSlot = selected && "slot" in selected ? selected.slot : null;
    $("doll").replaceChildren(
      ...SLOTS.map(({ slot, label }) => {
        const worn = game.equipment[slot];
        const node = el("div", `slot slot-${slot}${slot === selectedSlot ? " selected" : ""}${worn ? "" : " empty"}`);
        const box = el("div", "slot-box");
        if (worn) box.append(itemIcon(worn.defId));
        node.append(box, el("div", "slot-label", label));
        node.addEventListener("click", () => {
          sfx.play("click");
          selected = worn && selectedSlot !== slot ? { slot } : null;
          renderBag();
        });
        return node;
      })
    );
    const grid = $("bag-grid");
    grid.style.setProperty("--cols", String(bag.cols));
    grid.style.setProperty("--rows", String(bag.rows));
    grid.replaceChildren(
      ...bag.items.map((item2) => {
        const def2 = bag.def(item2);
        const node = itemNode(item2, `bag-item${item2.uid === selectedUid ? " selected" : ""}`);
        node.style.left = `${100 * item2.x / bag.cols}%`;
        node.style.top = `${100 * item2.y / bag.rows}%`;
        node.style.width = `${100 * def2.w / bag.cols}%`;
        node.style.height = `${100 * def2.h / bag.rows}%`;
        return node;
      })
    );
    const info = $("bag-info");
    const action = $("bag-equip");
    const item = selectedUid !== null ? bag.get(selectedUid) : selectedSlot ? game.equipment[selectedSlot] : null;
    if (!item) {
      selected = null;
      info.replaceChildren(el("div", "", "Touchez un objet pour le s\xE9lectionner. Dans le sac, touchez ensuite une case libre pour le d\xE9placer."));
      action.hidden = true;
      return;
    }
    const def = ITEMS[item.defId];
    const lines = itemStats(def);
    if (def.armorClass) lines.push(`Classe d'armure : ${def.armorClass}`);
    info.replaceChildren(
      el("div", "bag-name", `${def.name}${item.count > 1 ? ` \xD7${item.count}` : ""}${selectedSlot ? " \u2014 port\xE9" : ""}`),
      ...lines.map((line) => el("div", "", line))
    );
    const wearable = def.kind !== "ammo" && def.kind !== "key";
    action.hidden = !wearable;
    action.textContent = selectedSlot ? "Retirer" : "\xC9quiper";
  }
  $("bag-grid").addEventListener("click", (e) => {
    const grid = $("bag-grid");
    const rect = grid.getBoundingClientRect();
    const bag = game.inventory;
    const x = Math.floor((e.clientX - rect.left) / rect.width * bag.cols);
    const y = Math.floor((e.clientY - rect.top) / rect.height * bag.rows);
    const hit = bag.at(x, y);
    const selectedUid = selected && "uid" in selected ? selected.uid : null;
    if (hit) selected = hit.uid === selectedUid ? null : { uid: hit.uid };
    else if (selectedUid !== null) bag.moveTo(selectedUid, x, y);
    sfx.play("click");
    renderBag();
  });
  button("bag-equip", () => {
    if (selected && "uid" in selected) {
      if (!game.equip(selected.uid)) logLines.push("Pas assez de place dans le sac pour \xE9changer.");
    } else if (selected && "slot" in selected) {
      if (!game.unequip(selected.slot)) logLines.push("Pas assez de place dans le sac.");
    }
    selected = null;
    aimShown = "";
    renderLog();
    renderBag();
  });
  button("open-bag", () => {
    bagOpen = true;
    selected = null;
    $("bag").hidden = false;
    renderBag();
  });
  button("bag-close", () => {
    bagOpen = false;
    $("bag").hidden = true;
  });
  function showScreen(screen) {
    menuOpen = screen !== null;
    menu.hidden = !menuOpen;
    for (const name of ["main", "new", "settings"]) $(`screen-${name}`).hidden = screen !== name;
    $("detail").hidden = true;
    $("menu-resume").hidden = !started || game.over;
    $("settings-sound").textContent = `Sons : ${options.sound ? "activ\xE9s" : "d\xE9sactiv\xE9s"}`;
    if (screen === "new") renderCards();
  }
  var signedBonus = (n) => n >= 0 ? `+${n}` : `${n}`;
  function raceCard(r) {
    return {
      id: r.id,
      name: r.name,
      available: r.available,
      tagline: r.tagline,
      basics: [`PV ${signedBonus(r.hpBonus)}`, `Vue ${r.darkVision} / ${r.sight}`],
      details: [
        r.tagline,
        `Points de vie : ${signedBonus(r.hpBonus)}`,
        `Vue dans le noir : ${r.darkVision} cases`,
        `Vue des zones \xE9clair\xE9es : ${r.sight} cases`,
        `Trait \u2014 ${r.trait}`
      ]
    };
  }
  function classCard(c) {
    const gear = c.startingItems.map((g) => ({ def: ITEMS[g.item], count: g.count }));
    const weapons = gear.filter((g) => g.def.kind === "melee" || g.def.kind === "ranged");
    const armorClass = gear.find((g) => g.def.armorClass)?.def.armorClass ?? UNARMORED_AC;
    return {
      id: c.id,
      name: c.name,
      available: c.available,
      tagline: c.tagline,
      basics: [`PV ${c.hp} \xB7 CA ${armorClass}`, weapons.map((g) => g.def.name).join(" \xB7 ")],
      details: [
        c.tagline,
        `Points de vie : ${c.hp}`,
        `Crocheter une serrure : d20 ${signedBonus(c.lockpickBonus)}`,
        `Enfoncer une porte : d20 ${signedBonus(c.breakBonus)}`,
        "\xC9quipement de d\xE9part :",
        ...gear.map((g) => {
          const d = g.def;
          if (d.armorClass) return `\u2022 ${d.name} : classe d'armure ${d.armorClass}`;
          if (d.attackBonus === void 0 || !d.damage) return `\u2022 ${d.name} \xD7${g.count}`;
          return `\u2022 ${d.name} : d20 ${signedBonus(d.attackBonus)}, d\xE9g\xE2ts ${diceLabel(d.damage)}${d.range ? `, port\xE9e ${d.range} cases` : ""}`;
        }),
        `Style \u2014 ${c.trait}`
      ]
    };
  }
  function el(tag, className, text = "") {
    const node = document.createElement(tag);
    node.className = className;
    node.textContent = text;
    return node;
  }
  function buildCards(container, cards, selectedId, onSelect) {
    container.replaceChildren(
      ...cards.map((card) => {
        const node = el("div", `card${card.available ? "" : " locked"}${card.id === selectedId ? " selected" : ""}`);
        const more = el("button", "more", "+");
        more.setAttribute("aria-label", `D\xE9tail : ${card.name}`);
        more.addEventListener("click", (e) => {
          e.stopPropagation();
          sfx.play("click");
          showDetail(card);
        });
        node.append(more, el("div", "card-name", card.name), ...card.basics.map((line) => el("div", "card-info", line)));
        if (!card.available) node.append(el("div", "card-soon", "Bient\xF4t"));
        node.addEventListener("click", () => {
          if (!card.available) return;
          sfx.play("click");
          onSelect(card.id);
          renderCards();
        });
        return node;
      })
    );
  }
  function renderCards() {
    buildCards($("race-cards"), Object.values(RACES).map(raceCard), chosenRace.id, (id) => {
      chosenRace = RACES[id];
    });
    buildCards($("class-cards"), Object.values(CLASSES).map(classCard), chosenClass.id, (id) => {
      chosenClass = CLASSES[id];
    });
  }
  function showDetail(card) {
    $("detail-title").textContent = card.name;
    const lines = card.available ? card.details : [...card.details, "Pas encore jouable : valeurs provisoires."];
    $("detail-body").replaceChildren(...lines.map((line) => el("div", "", line)));
    $("detail").hidden = false;
  }
  button("open-menu", () => showScreen("main"));
  button("menu-resume", () => showScreen(null));
  button("menu-new", () => showScreen("new"));
  button("menu-settings", () => showScreen("settings"));
  button("new-back", () => showScreen("main"));
  button("settings-back", () => showScreen("main"));
  button("detail-close", () => {
    $("detail").hidden = true;
  });
  button("new-start", () => {
    newRun();
    started = true;
    showScreen(null);
  });
  button("settings-sound", () => {
    options.sound = !options.sound;
    sfx.enabled = options.sound;
    saveOptions();
    sfx.play("click");
    showScreen("settings");
  });
  var last = performance.now();
  function frame(now) {
    const dt = Math.min(now - last, 100);
    last = now;
    advanceCues(dt);
    dieIdle = cue || queue.length > 0 ? 0 : dieIdle + dt;
    if (dieIdle >= DIE_CLEAR_MS && die.textContent !== "") clearDie();
    if (stepping) {
      stepTime += dt;
      if (stepTime >= stepMs) {
        stepTime -= stepMs;
        stepping = false;
        if (game.takeStairs()) {
          renderer.snapTo(game);
          collectEvents();
        }
      }
    }
    if (!stepping && !cue && queue.length === 0 && !menuOpen && !bagOpen) {
      shownHp = game.hero.hp;
      if (game.visibleMonsters().length > 0) stepMs = Math.max(stepMs, COMBAT_STEP_MS);
      const before = { x: game.hero.x, y: game.hero.y };
      if (game.tick()) {
        stepping = true;
        if (game.hero.x !== before.x || game.hero.y !== before.y) sfx.play("step");
        collectEvents();
      } else {
        stepTime = 0;
      }
    }
    if (!menuOpen) sfx.crackle(game.light[game.map.index(game.hero.x, game.hero.y)], dt);
    const aimRange = aimMode && game.arrows() > 0 ? game.weapon("ranged")?.range ?? null : null;
    renderer.draw(game, stepping ? Math.min(stepTime / stepMs, 1) : 1, dt, ghosts, aimRange);
    hudText.textContent = `\xC9tage ${game.depth} \xB7 PV ${shownHp}/${game.hero.maxHp} \xB7 CA ${game.hero.armorClass} \xB7 Tour ${game.turn}`;
    hpFill.style.width = `${100 * shownHp / game.hero.maxHp}%`;
    const doorOptions = game.doorOptions();
    doorActions.hidden = doorOptions.length === 0 || game.over || cue !== null;
    $("door-key").hidden = !doorOptions.includes("key");
    $("door-pick").hidden = !doorOptions.includes("pick");
    $("door-break").hidden = !doorOptions.includes("break");
    if (game.pendingDoor && !doorWasPending) {
      renderer.addSlash(game.hero.id, game.hero.x, game.hero.y, game.pendingDoor.x, game.pendingDoor.y, "", false);
      sfx.play("knock");
    }
    doorWasPending = game.pendingDoor !== null;
    $("recenter").hidden = !renderer.isPanned();
    const bow = game.weapon("ranged");
    const aim = $("aim");
    aim.hidden = !bow;
    if (!bow) aimMode = false;
    if (aimMode && game.isThreatened()) {
      aimMode = false;
      logLines.push("Ennemi au contact : vous reprenez votre arme de corps \xE0 corps.");
      renderLog();
    }
    const aimKey = `${bow?.id}|${game.arrows()}`;
    if (aimKey !== aimShown) {
      aimShown = aimKey;
      const ranged = game.equipment.ranged;
      aim.replaceChildren(...ranged ? [itemIcon(ranged.defId)] : [], document.createTextNode(`\xD7${game.arrows()}`));
    }
    aim.classList.toggle("active", aimMode);
    requestAnimationFrame(frame);
  }
  newRun();
  showScreen("main");
  requestAnimationFrame(frame);
  window.leutenheim = { game: () => game };
})();

</script>
</body>
</html>
