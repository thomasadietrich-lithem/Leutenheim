Amulet",Artefact:"Artifact",Cimeterre:"Scimitar",Caract\u00E9ristiques:"Abilities","\xC0 chaque niveau, un point \xE0 placer dans l'une d'elles (hors combat).":"Each level, one point to put into one of them (out of combat).","+4 points de vie maximum par point.":"+4 max hit points per point.","+1 d\xE9g\xE2t au corps \xE0 corps par point.":"+1 melee damage per point.","Aide \xE0 pousser, \xE0 enfoncer une porte et \xE0 d\xE9chirer une toile.":"Helps shove, break down doors and tear webs.","+1 au tir par point.":"+1 to shooting per point.","+1 classe d'armure tous les 2 points.":"+1 armor class every 2 points.","Aide \xE0 se d\xE9gager, \xE0 crocheter une serrure et \xE0 \xE9viter un pi\xE8ge.":"Helps break free, pick locks and dodge traps.","La magie. Pas encore en jeu.":"Magic. Not in the game yet.","Les qu\xEAtes et les marchands. Pas encore en jeu.":"Quests and merchants. Not in the game yet.","Avantage et d\xE9savantage":"Advantage and disadvantage","Une action se joue au d20 : le d\xE9, plus un bonus, doit atteindre un seuil.":"Actions are rolled on a d20: the die plus a bonus must reach a target.",Avantage:"Advantage","On lance deux d20 et on garde le meilleur.":"Roll two d20 and keep the higher.","Contre un monstre qui ne vous a pas remarqu\xE9, ou pris dans une porte.":"Against a monster that hasn't noticed you, or one caught in a doorway.","Jamais deux fois de suite contre la m\xEAme cible.":"Never twice in a row against the same target.","On lance deux d20 et on garde le pire.":"Roll two d20 and keep the lower.","Tirer avec un ennemi au contact, ou sur une cible qu'on ne voit pas.":"Shooting with an enemy next to you, or at a target you can't see.","Une pierre de fronde contre un h\xE9ros abrit\xE9 derri\xE8re une colonne ou un meuble.":"A sling stone against a hero sheltered behind a pillar or furniture.","Les deux \xE0 la fois":"Both at once","Ils s'annulent : un seul d20.":"They cancel out: a single d20.",Manuel:"Manual","\xAB Ah ! Enfin quelqu'un de gentil. \xBB":"\u201CAh! Finally someone nice.\u201D","\xAB Mon sac de pommes ? Perdu en fuyant les autres. Ram\xE8ne-le-moi, on partagera. \xBB":"\u201CMy apple sack? Lost it running from the others. Bring it back and we'll share.\u201D","(Sa salle appara\xEEt sur la carte.)":"(Its room appears on your map.)","\xAB March\xE9 conclu : un secret. La statue de pierre, sur cet \xE9tage\u2026 elle sonne creux. Un bon coup, et hop ! \xBB":"\u201CDeal: a secret. The stone statue on this floor\u2026 it sounds hollow. One good hit, and presto!\u201D","\xAB Reviens me dire ce qu'il y avait dedans. \xBB":"\u201CCome back and tell me what was inside.\u201D","\xAB Punissez-les. Puis revenez me raconter. \xBB":"\u201CPunish them. Then come back and tell me.\u201D","\xAB Deux de mes anciens camarades me cherchent. Tiens, les voil\xE0. \xBB":"\u201CTwo of my old comrades are after me. Oh look, here they come.\u201D","(Deux Kobolds accourent.)":"(Two Kobolds come running.)","\xAB Ma cache ? Dans une autre salle. Pourquoi je te le dis ? \u2026 Je ne peux pas m'en emp\xEAcher. \xBB":"\u201CMy stash? In another room. Why am I telling you? \u2026 I can't help it.\u201D","\xAB Rapporte-la-moi, on partage. \xBB":"\u201CBring it back and we'll share.\u201D","(La salle du magot appara\xEEt sur la carte.)":"(The stash's room appears on your map.)","C'est fait !":"Done!","Plus tard":"Later","Sac de pommes de Gluck":"Gluck's apple sack","Un sac de toile plein de pommes. \xC0 rapporter \xE0 Gluck.":"A canvas sack full of apples. Bring it back to Gluck.","Magot de Krik":"Krik's stash","Un coffret lourd qui tinte. \xC0 rapporter \xE0 Krik\u2026 ou pas.":"A heavy little box that jingles. Bring it back to Krik\u2026 or don't.","Objet de qu\xEAte":"Quest item","Retrouver le sac de Gluck":"Find Gluck's sack","Rendre le sac \xE0 Gluck":"Return the sack to Gluck","\xAB Mon sac est quelque part sur l'\xE9tage. Je t'attends ici. Je ne bouge pas. Promis. \xBB":"\u201CMy sack is somewhere on this floor. I'll wait here. I won't move. Promise.\u201D","\xAB MON SAC ! Tu l'as rapport\xE9 ! \xBB":"\u201CMY SACK! You brought it back!\u201D","\xAB On partage : trois pour toi. Bon\u2026 deux. Allez, trois. \xBB":"\u201CLet's share: three for you. Well\u2026 two. Oh fine, three.\u201D","(Il laisse 3 pommes.)":"(He leaves 3 apples.)","Quelque part au-dessus, Gluck attend toujours son sac de pommes.":"Somewhere above, Gluck is still waiting for his apple sack.","Briser la statue creuse":"Smash the hollow statue","Revoir Gluck":"Back to Gluck","\xAB La statue ! Un bon coup, et hop ! Moi, je surveille. \xBB":"\u201CThe statue! One good hit, and presto! I'll keep watch.\u201D","\xAB Alors ? Il y avait quoi ? \u2026 Garde tout. Les cailloux, \xE7a me fait peur. \xBB":"\u201CSo? What was in it? \u2026 Keep it all. Rocks scare me.\u201D","\xAB Une pomme pour le travail, une pour le courage. \xBB":"\u201COne apple for the work, one for the courage.\u201D","(Il laisse 2 pommes.)":"(He leaves 2 apples.)","Gluck ne saura jamais ce que cachait la statue.":"Gluck will never know what the statue was hiding.","Punir des Kobolds {0}/{1}":"Punish Kobolds {0}/{1}","Punir des Kobolds":"Punish Kobolds","Revoir S\u0153ur Osseuse":"Back to Sister Bones","\xAB Je compte. Vous, vous frappez. \xBB":"\u201CI count. You strike.\u201D","\xAB J'ai entendu leurs cris d'ici. C'\xE9tait\u2026 \xE9difiant. \xBB":"\u201CI heard their screams from here. Most\u2026 edifying.\u201D","\xAB Allez en paix, mon enfant. Et avec un peu de chance. \xBB":"\u201CGo in peace, my child. And with a little luck.\u201D","(Protection : +1 classe d'armure pendant 150 tours. Chance : vos 3 prochains 1 au d\xE9 seront relanc\xE9s.)":"(Protection: +1 armor class for 150 turns. Luck: your next 3 rolls of 1 will be rerolled.)","S\u0153ur Osseuse attendait le r\xE9cit de votre croisade. Elle ne l'aura pas.":"Sister Bones was waiting for the tale of your crusade. She won't get it.","Retrouver le magot de Krik":"Find Krik's stash","Rendre le magot \xE0 Krik":"Return the stash to Krik","\xAB Le magot est l\xE0 o\xF9 je l'ai dit. Je ne mens pas : je ne peux pas. \xBB":"\u201CThe stash is where I said. I'm not lying: I can't.\u201D","\xAB Tout est l\xE0 ! M\xEAme la pi\xE8ce tordue. \xBB":"\u201CIt's all there! Even the bent coin.\u201D","\xAB Moiti\xE9-moiti\xE9. Ta moiti\xE9 est plus grosse. C'est vrai, je l'ai mesur\xE9e. \xBB":"\u201CHalf and half. Your half is bigger. It's true, I measured it.\u201D","(Il laisse de l'or et un objet.)":"(He leaves gold and an item.)","Vous gardez le magot de Krik : +{0} or. Quelque part, un Kobold qui ne sait pas mentir raconte partout que vous \xEAtes un voleur.":"You keep Krik's stash: +{0} gold. Somewhere, a Kobold who can't lie is telling everyone you're a thief.","Chasser les traqueurs {0}/{1}":"Drive off the trackers {0}/{1}","Chasser les traqueurs":"Drive off the trackers","Revoir Krik":"Back to Krik","\xAB Ils sont encore l\xE0. Je les entends. C'est vrai. \xBB":"\u201CThey're still here. I can hear them. It's true.\u201D","\xAB Ils sont partis ? Vraiment ? \u2026 Je te crois. Je n'ai pas le choix, mais je te crois. \xBB":"\u201CThey're gone? Really? \u2026 I believe you. I have no choice, but I believe you.\u201D","\xAB Mes camarades dorment l\xE0, l\xE0 et l\xE0. \xBB":"\u201CMy comrades sleep there, there and there.\u201D","(Les repaires des Kobolds de l'\xE9tage apparaissent sur la carte. Il laisse une pomme et un objet.)":"(The Kobold lairs on this floor appear on your map. He leaves an apple and an item.)","Krik a d\xFB fuir seul. Il racontera que vous l'avez abandonn\xE9. C'est vrai.":"Krik had to flee alone. He'll tell everyone you abandoned him. It's true.","Nouvelle qu\xEAte !":"New quest!","Objectif rempli !":"Objective complete!","Qu\xEAte perdue : la personne qui l'avait donn\xE9e s'est enfuie.":"Quest lost: the one who gave it ran away.","Nouvelle qu\xEAte \u2014 {0}.":"New quest \u2014 {0}.","Krik attendra son magot longtemps.":"Krik will be waiting a long time for his stash.","Attaque d'opportunit\xE9":"Attack of opportunity","S'\xE9loigner d'un monstre qui vous a rep\xE9r\xE9 lui offre un coup gratuit, et votre d\xE9placement s'arr\xEAte.":"Moving away from a monster that has spotted you gives it a free hit, and stops your move.","Passer une porte":"Going through a door","En y entrant ou en en sortant : pas de coup.":"Stepping into or out of a doorway: no free hit.","Dans la barre d'actions : un saut de deux cases, sans coup. Il faut r\xE9ussir un jet d'Agilit\xE9.":"In the action bar: a two-square leap, no free hit. It takes a successful Agility roll.","\xC9tage {0} \xB7 Niv {1}":"Floor {0} \xB7 Lv {1}","Derni\xE8re partie : {0}":"Last played: {0}","Sauvegarde illisible.":"Unreadable save.",Supprimer:"Delete","S\xFBr ?":"Sure?","Aucune sauvegarde.":"No saves.",Sauvegardes:"Saves","Cloches et alerte":"Bells and alert","Chaque \xE9tage a son niveau d'alerte : la cloche en haut de l'\xE9cran. Le temps et le bruit le font monter.":"Each floor has its alert level: the bell at the top of the screen. Time and noise make it rise.","Le bruit":"Noise","Une porte enfonc\xE9e, le gravier, l'eau, les coups \xE9chang\xE9s.":"A door broken down, gravel, water, blows exchanged.","Les paliers":"Stages","La cloche sonne \xE0 chaque palier.":"The bell rings at each stage.","Agit\xE9, puis Alerte : des renforts arrivent, de plus en plus vite.":"Restless, then Alert: reinforcements arrive, faster and faster.","Traque : tout l'\xE9tage sait o\xF9 vous \xEAtes.":"Hunted: the whole floor knows where you are.","La cloche d'alarme":"The alarm bell","Sur certains \xE9tages, une cloche sur son support. La sonner : l'alerte grimpe d'un palier et les monstres alentour accourent.":"On some floors, a bell on its stand. Ring it: the alert goes up a stage and nearby monsters come running.","Toucher la cloche du haut":"Tapping the top bell","Elle dit ce que fait le palier en cours.":"It tells you what the current stage does.","Potion de brouillard":"Fog potion","Noire et \xE9paisse. \xC0 lancer : une nappe de brouillard en losange, cinq cases de large. Personne n'y voit : de quoi fuir.":"Black and thick. To throw: a diamond of fog five squares wide. Nobody can see in it: time to run.","Potion d'oursin":"Urchin potion","Brune et piquante. Pendant 40 tours, 15 % des d\xE9g\xE2ts re\xE7us au contact reviennent \xE0 l'attaquant.":"Brown and prickly. For 40 turns, 15% of melee damage you take goes back to the attacker.","\u0152il de chauve-souris":"Bat eye","Dess\xE9ch\xE9, il palpite encore. Vous devinez l'ombre des monstres hors de vue : \xE0 10 cases, et \xE0 3 \xE0 travers un mur ou une porte.":"Dried, yet still twitching. You sense the shadow of monsters out of sight: up to 10 squares, and 3 through a wall or door.","Fl\xFBte de pan":"Pan flute","Quelques roseaux li\xE9s. En combat, de temps en temps, un air doux endort l'ennemi le plus proche.":"A few tied reeds. In combat, now and then, a soft tune puts the nearest enemy to sleep.","Piqu\xE9 ! \u2212{0}":"Pricked! \u2212{0}","\u266A Zzz":"\u266A Zzz",Oursin:"Urchin","15 % des d\xE9g\xE2ts re\xE7us au contact reviennent \xE0 l'attaquant. Encore {0} tours.":"15% of melee damage you take goes back to the attacker. {0} turns left.","Des piquants vous h\xE9rissent la peau : qui vous frappe s'y pique.":"Spines bristle on your skin: whoever hits you gets pricked.","{0} se pique : {1} d\xE9g\xE2t{2}.":"{0} gets pricked: {1} damage.","Quelques notes de fl\xFBte\u2026 {0} s'endort.":"A few flute notes\u2026 {0} falls asleep.","Sac \xE0 ranger":"Tidy your bag","Pas de place d'un seul tenant : {0}{1} tombe par terre. Rangez le sac pour lui faire un trou.":"No room in one piece: {0}{1} falls to the ground. Tidy your bag to make a gap.","Il reste de la place, mais pas d'un seul tenant : rangez le sac (touchez un objet, puis une case libre).":"There's room left, but not in one piece: tidy your bag (tap an item, then an empty square).","Points \xE0 attribuer : {0}":"Points to spend: {0}","Comp\xE9tences \xE0 attribuer : {0}":"Skill points to spend: {0}","Pas en combat":"Not in combat","Kobold mouill\xE9":"Wet Kobold","SPLASH !":"SPLASH!","Scrrratch !":"Scrrratch!","Clac !":"Thwack!","AU SECOURS !":"HELP!","SPLASH ! Le Kobold bondit hors de son bain, couvert de mousse, une serviette \xE0 la main.":"SPLASH! The Kobold leaps out of his bath, covered in foam, towel in hand.","Scrrratch ! Le disque s'arr\xEAte. Dans la baignoire, quelqu'un grogne.":"Scrrratch! The record stops. In the tub, someone grumbles.","Un coup de serviette en pleine figure : votre prochain coup sera moins pr\xE9cis.":"A towel slap right in the face: your next blow will be less accurate.","\xAB AU SECOURS ! ON M'ATTAQUE DANS MON BAIN ! \xBB Le Kobold s'enfuit en glissant.":"\u201CHELP! I'M BEING ATTACKED IN MY BATH!\u201D The Kobold slips and slides away.","{0} ne craint pas le poison.":"{0} is immune to poison.",Immunis\u00E9e:"Immune","Il fuit !":"Fleeing!","{0} d\xE9tale, la queue entre les jambes !":"{0} bolts, tail between its legs!","Artefacts et bibelots":"Artifacts and trinkets","Un Kobold d\xE9serteur, p\xE2le et peureux, qui ne pense qu'aux pommes. Selon ce qu'on lui dit, il vend, donne, investit\u2026 ou confie une t\xE2che.":"A pale, timid Kobold deserter who only thinks about apples. Depending on what you say, he sells, gives, invests\u2026 or hands you a task.","Une nonne squelette tr\xE8s digne, qui ignore qu'elle est morte. Les Kobolds lui ont vol\xE9 sa cloche. Elle b\xE9nit, ou maudit.":"A very dignified skeleton nun who doesn't know she's dead. The Kobolds stole her bell. She blesses, or curses.","Un Kobold qui ne peut plus mentir depuis une exp\xE9rience rat\xE9e. Il a trahi ses camarades et vend leur butin.":"A Kobold who can't lie anymore since a failed experiment. He betrayed his comrades and sells their loot.","Un marchand vo\xFBt\xE9, un par section. Il ach\xE8te et vend, et dispara\xEEt quand le donjon s'agite trop.":"A hunched merchant, one per section. He buys and sells, and vanishes when the dungeon gets too restless.","Le Kobold qui compte":"The Counting Kobold","Derri\xE8re une porte perc\xE9e d'un trou, il r\xE9p\xE8te son nombre. Ne regardez pas par le trou.":"Behind a door with a hole in it, he repeats his number. Don't look through the hole.","Le Kobold du bain":"The Bathing Kobold","Il dort dans sa baignoire, en musique. R\xE9veill\xE9, il se bat \xE0 la serviette, puis s'enfuit en criant.":"He sleeps in his tub, with music. Woken up, he fights with his towel, then runs off screaming.","Des pointes jaillissent de la dalle. Un bond d'Agilit\xE9 permet parfois de l'\xE9viter. Certains pi\xE8ges sont cach\xE9s, de plus en plus en descendant : une fouille r\xE9ussie de la salle les r\xE9v\xE8le.":"Spikes shoot out of the flagstone. An Agility leap sometimes avoids them. Some traps are hidden, more and more as you go down: a successful search of the room reveals them.","La dalle c\xE8de : on tombe, on se blesse, et il faut un tour pour remonter.":"The flagstone gives way: you fall, get hurt, and need a turn to climb out.","Une aiguille empoisonn\xE9e : une piq\xFBre, puis le poison pendant quelques tours.":"A poisoned needle: a prick, then poison for a few turns.","Un nuage vert s'\xE9chappe de la grille : qui s'y tient est empoisonn\xE9.":"A green cloud escapes from the grate: whoever stands in it is poisoned.","On perd des PV \xE0 chaque tour, pendant quelques tours.":"You lose HP every turn, for a few turns.","1d4 d\xE9g\xE2ts par tour. Sortir des flammes, ou marcher dans l'eau.":"1d4 damage per turn. Get out of the flames, or step into water.","Englu\xE9 ou ralenti":"Stuck or slowed","Le prochain pas sert \xE0 se d\xE9gager ; un monstre ralenti ne joue qu'un tour sur deux.":"The next step is spent breaking free; a slowed monster only acts every other turn.",Sonn\u00E9:"Stunned","Le monstre perd son prochain tour.":"The monster loses its next turn.","Les monstres ne vous remarquent qu'au contact. Premi\xE8re attaque avec l'avantage.":"Monsters only notice you up close. First attack with advantage.","Vous \xE9clairez autour de vous, mais on vous voit venir.":"You light up your surroundings, but they see you coming.","Vos coups qui portent empoisonnent.":"Your hits that land poison.","La pomme dor\xE9e de l'autel : +1 \xE0 l'attaque et +1 classe d'armure.":"The altar's golden apple: +1 to attack and +1 armor class.","La b\xE9n\xE9diction de S\u0153ur Osseuse : +1 classe d'armure.":"Sister Bones' blessing: +1 armor class.","Le poison dure moiti\xE9 moins longtemps, sur l'\xE9tage.":"Poison lasts half as long, on this floor.","+2 d\xE9g\xE2ts contre les Kobolds, sur l'\xE9tage.":"+2 damage against Kobolds, on this floor.","Vos prochains 1 au d\xE9 sont relanc\xE9s.":"Your next rolls of 1 are rerolled.","Une part des d\xE9g\xE2ts re\xE7us au contact revient \xE0 l'attaquant.":"Part of the melee damage you take goes back to the attacker.","Chaque attaque au contact frappe deux fois.":"Every melee attack strikes twice.","Un coup qui vous tuerait vous laisse debout.":"A blow that would kill you leaves you standing.",Personnages:"Characters",Pi\u00E8ges:"Traps",Pi\u00E8ge:"Trap",\u00C9tats:"States",\u00C9tat:"State","Dans le brouillard, {0} et {1} se cognent\u2026 et se battent !":"In the fog, {0} and {1} bump into each other\u2026 and start fighting!","N\u0153ud papillon de Kobold":"Kobold bow tie","Rouge \xE0 pois blancs, un peu froiss\xE9. Tr\xE8s chic. +8 en Charisme.":"Red with white polka dots, a bit crumpled. Very chic. +8 Charisma.","Statue ou p\xE9trifi\xE9":"Statue or petrified","Potion de pierre":"Stone potion","Potion de discorde":"Discord potion","Rose et p\xE9tillante. \xC0 lancer : les monstres de la case et des quatre voisines se battent entre eux.":"Pink and fizzy. To throw: monsters on the square and its four neighbors fight each other.","P\xE9trifi\xE9 !":"Petrified!","Crac !":"Crack!",Statue:"Statue","Rien ne vous blesse, mais vous ne pouvez rien faire. Encore {0} tours.":"Nothing can hurt you, but you can't do anything. {0} turns left.","La potion de discorde \xE9clate : {0} et {1} se jettent l'un sur l'autre !":"The discord potion bursts: {0} and {1} leap at each other!","Votre peau se fige\u2026 vous voil\xE0 statue. Les monstres ne vous voient plus.":"Your skin hardens\u2026 you're a statue now. Monsters no longer see you.","La pierre se fissure : vous pouvez de nouveau bouger.":"The stone cracks: you can move again.","{0} se change en pierre.":"{0} turns to stone.","{0} redevient chair et os.":"{0} is flesh and bone again.","Grise et lourde. Bue : vous devenez statue 10 tours ; les monstres perdent votre trace et ne vous blessent plus, mais vous ne pouvez rien faire. Lanc\xE9e : le monstre touch\xE9 est p\xE9trifi\xE9 10 tours, et sert d'abri pour se cacher.":"Grey and heavy. Drunk: you become a statue for 10 turns; monsters lose your trail and can't hurt you, but you can't do anything. Thrown: the monster hit is petrified for 10 turns, and makes cover to hide behind.","Potion de pierre : bue, rien ne vous blesse mais vous ne pouvez rien faire ; lanc\xE9e, le monstre ne bouge plus et sert d'abri.":"Stone potion: drunk, nothing hurts you but you can't act; thrown, the monster freezes and makes cover.",Tout:"All","vous d\xE9couvrez une cache et un pi\xE8ge cach\xE9 !":"you find a cache and a hidden trap!","vous rep\xE9rez un pi\xE8ge cach\xE9 !":"you spot a hidden trap!","\xAB Halte. On ne court pas devant une religieuse. M\xEAme loin de sa chapelle. \xBB":"\u201CHalt. No running in front of a nun. Even far from her chapel.\u201D","Reprendre le trajet":"Resume the walk","Depuis que quelqu'un, ou quelque chose, a vol\xE9 la cloche, Leutenheim ne se r\xE9veille plus \xE0 l'heure.":"Ever since someone, or something, stole the bell, Leutenheim no longer wakes up on time.","Le boulanger dort. Le coq a d\xE9missionn\xE9.":"The baker sleeps in. The rooster has resigned.","Certains jurent l'entendre sonner la nuit, sous leurs pieds.":"Some swear they hear it ringing at night, beneath their feet.","On vous a donn\xE9 une \xE9p\xE9e, dix fl\xE8ches et une tape dans le dos.":"You were given a sword, ten arrows and a pat on the back.","La cave est par l\xE0.":"The cellar is that way.",Descendre:"Go down","Le poulet":"The chicken","Un poulet, seul, dans le donjon. Il ne faut pas lui parler : il panique, d\xE9tale, et fonce droit dans la porte qu'aucune serrure ni aucun coup n'ouvre.":"A chicken, alone in the dungeon. Don't talk to it: it panics, bolts, and charges straight into the door no lock or blow can open.","Cuisse de poulet":"Chicken leg","Encore ti\xE8de. Le poulet n'a pas souffert longtemps. Rend 8 PV.":"Still warm. The chicken didn't suffer long. Restores 8 HP.","C\xF4\xF4t ?!":"Bawk?!","Plof !":"Splat!","{0} : {1} \u2014 rien. Elle ne bouge pas d'un pouce. On dirait qu'elle attend quelque chose.":"{0}: {1} \u2014 nothing. It doesn't budge an inch. It seems to be waiting for something.","Le poulet prend peur, file \xE0 travers le donjon, d\xE9fonce la porte et s'\xE9crase contre le mur du fond dans un nuage de plumes.":"The chicken panics, dashes across the dungeon, smashes through the door and crashes into the far wall in a cloud of feathers.","Le poulet prend peur et d\xE9tale\u2026 Au loin, un fracas. Un poulet semble s'\xEAtre viand\xE9 contre un mur ; il faudrait peut-\xEAtre investiguer.":"The chicken panics and bolts\u2026 A crash, far away. A chicken seems to have splattered itself against a wall; maybe worth investigating.","Utilis\xE9e, elle se range sous l'arc et \xE9claire autour de vous pendant 300 tours (sa jauge baisse). On peut l'\xE9teindre et la rallumer. Mais on vous voit venir.":"Once used, it goes under the bow and lights your surroundings for 300 turns (its gauge drops). You can put it out and relight it. But they see you coming.","Outils de voleur":"Thieves' tools","Une trousse de crochets et de tensionneurs. Port\xE9e en artefact, toute serrure c\xE8de : le crochetage r\xE9ussit \xE0 coup s\xFBr.":"A kit of picks and tension wrenches. Worn as an artifact, every lock gives: lockpicking always succeeds.","Sur certains \xE9tages, une cloche sur son support. Ce n'est pas la cloche vol\xE9e de Leutenheim : une simple cloche \xE0 vache. La sonner : l'alerte grimpe d'un palier et les monstres alentour accourent.":"On some floors, a bell on its stand. It isn't Leutenheim's stolen bell: just a cowbell. Ringing it: the alarm climbs one stage and nearby monsters come running.","CLONC !":"CLONK!","Torche \xE9teinte : touchez pour la rallumer":"Torch out: tap to relight it","Torche : touchez pour l'\xE9teindre":"Torch: tap to put it out","Torche : utilisez-en une depuis le sac":"Torch: use one from the bag","Pas de torche : utilisez-en une depuis le sac.":"No torch: use one from the bag.","Vous \xE9teignez la torche.":"You put out the torch.","Vous rallumez la torche.":"You relight the torch.","Impossible de rallumer la torche avec une arme \xE0 deux mains.":"You can't relight the torch with a two-handed weapon.",Utiliser:"Use","CLONC ! Ce n'est pas la cloche de Leutenheim : c'est une cloche \xE0 vache. Tout l'\xE9tage vous a quand m\xEAme entendu.":"CLONK! That's not Leutenheim's bell: it's a cowbell. The whole floor heard you anyway.","CLONC ! Fausse joie : une cloche \xE0 vache. Les Kobolds, eux, ont bien entendu.":"CLONK! False alarm: a cowbell. The Kobolds heard it just fine.","CLONC ! Toujours pas la bonne cloche.":"CLONK! Still not the right bell.","CLONC ! Quelque part, une vache r\xE9pond.":"CLONK! Somewhere, a cow answers.","CLONC ! Les Kobolds accourent, d\xE9\xE7us que ce ne soit que vous.":"CLONK! The Kobolds come running, disappointed it's only you.","CLONC ! Le donjon applaudit votre sens de la discr\xE9tion.":"CLONK! The dungeon applauds your sense of discretion.","CLONC ! La vraie, elle, sonne sous vos pieds. Celle-ci sonne surtout l'alerte.":"CLONK! The real one rings beneath your feet. This one mostly rings the alarm.","Encore ti\xE8de. Rend 8 PV.":"Still warm. Restores 8 HP.","Masse d'arme":"Mace","Une t\xEAte de fer \xE0 ailettes au bout d'un manche de ch\xEAne. Elle cabosse les armures et assomme : sur un 17 ou plus au d\xE9, l'ennemi touch\xE9 perd son prochain tour.":"A flanged iron head on an oak haft. It dents armor and stuns: on a 17 or more on the die, the enemy hit loses its next turn.","Lui dire qu'on l'entend sonner, la nuit, sous le village":"Tell her it can be heard ringing at night, beneath the village","\xAB Sous nos pieds ? Alors elle n'est pas fondue. Elle est en bas. Quelque part. \xBB":"\u201CBeneath our feet? Then it hasn't been melted down. It's down there. Somewhere.\u201D","\xAB Descendez, mon enfant. Et \xE9coutez bien. \xBB":"\u201CGo down, my child. And listen carefully.\u201D","\xAB Des racontars de boulanger. Il dort, il r\xEAve, il entend des cloches. \xBB":"\u201CBaker's gossip. He sleeps, he dreams, he hears bells.\u201D","Une nonne squelette tr\xE8s digne, qui ignore qu'elle est morte. Les Kobolds lui ont vol\xE9 sa cloche, celle qui r\xE9veillait Leutenheim. Elle b\xE9nit, ou maudit.":"A very dignified skeleton nun who doesn't know she's dead. The Kobolds stole her bell, the one that woke Leutenheim. She blesses, or curses.","\xAB Parce que je suis contrari\xE9e. Les Kobolds ont vol\xE9 ma cloche. MA cloche. Celle qui r\xE9veillait Leutenheim. \xBB":"\u201CBecause I am upset. The Kobolds stole my bell. MY bell. The one that woke Leutenheim.\u201D","\xAB Depuis, le boulanger fait la grasse matin\xE9e. C'est un scandale. \xBB":"\u201CSince then, the baker sleeps in. It's a scandal.\u201D"};var Mo="fr",Hs=new Map,Rs=new Set;function Cs(n){Mo=n,Hs.clear()}var Ws=null,Fc=["{0} \u2014 {1}","{0} \xB7 {1}","{0}, {1}","{0} et {1}"];function Oc(){let n=[];for(let[e,a]of Object.entries(Fn)){if(!/\{\d\}/.test(e))continue;let t=e.split(/(\{\d\})/),s=[],r="^",o=!1;for(let l of t){if(l==="")continue;let b=/^\{(\d)\}$/.exec(
