<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Leutenheim — démo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c0b12; color: #d8d4e6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; }
  .col { position: relative; width: min(100%, calc((100vh - 215px) * 9 / 13), 420px); display: flex; flex-direction: column; gap: 6px; }
  #hud-text { font-size: 13px; font-variant-numeric: tabular-nums; text-align: center; }
  .hp { height: 6px; background: #3a1520; border-radius: 3px; overflow: hidden; }
  #hp-fill { height: 100%; width: 100%; background: #e05060; transition: width 0.2s; }
  .frame { position: relative; aspect-ratio: 9 / 13; border: 2px solid #3a3550; border-radius: 10px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  .overlay { position: absolute; inset: 0; background: rgba(12,11,18,0.86); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; font-size: 16px; }
  .overlay[hidden], #door-actions[hidden], button[hidden] { display: none; }
  #menu { background: rgba(12,11,18,0.94); border-radius: 10px; z-index: 2; }
  #menu h1 { margin: 0; font-size: 34px; letter-spacing: 0.06em; color: #e0b040; font-weight: 700; }
  #menu p { margin: 0 0 14px; font-size: 13px; color: #9a94b0; }
  #menu button { width: 200px; padding: 12px; font-size: 15px; }
  #door-actions { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  #door-actions button { background: #5a3817; border: 1px solid #e0b040; }
  .panel { display: flex; gap: 8px; align-items: stretch; min-height: 76px; }
  .dice { flex: 0 0 60px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .die { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;
    border: 2px solid #5a5475; border-radius: 12px; background: #1c1a28; color: #9a94b0; font-variant-numeric: tabular-nums; }
  .die.hit { border-color: #5fd38d; color: #5fd38d; }
  .die.miss { border-color: #77718f; color: #c9c4dc; }
  .die.crit { border-color: #ffd75e; color: #ffd75e; box-shadow: 0 0 14px rgba(255,215,94,0.6); }
  .die.foe { background: #3a1722; }
  .die.rolling { border-color: #ffffff; color: #ffffff; animation: roll 0.16s linear infinite; }
  .die.land { animation: land 0.24s ease-out; }
  @keyframes roll {
    0% { transform: rotate(-14deg) scale(1.08); } 25% { transform: rotate(11deg) translateY(-4px) scale(1.12); }
    50% { transform: rotate(-9deg) scale(1.06); } 75% { transform: rotate(13deg) translateY(3px) scale(1.1); }
    100% { transform: rotate(-14deg) scale(1.08); }
  }
  @keyframes land { 0% { transform: scale(1.55) rotate(8deg); } 55% { transform: scale(0.9); } 100% { transform: scale(1); } }
  #die-who { font-size: 10px; color: #9a94b0; height: 12px; }
  #log { flex: 1; font-size: 11.5px; line-height: 1.35; color: #9a94b0; display: flex; flex-direction: column; justify-content: flex-end; }
  #log div:last-child { color: #e6e2f4; }
  .bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #77718f; }
  .bar span { margin-left: auto; }
  button { background: #3a3550; color: #f0ecff; border: 0; border-radius: 8px; padding: 8px 14px;
    font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #4b4560; }
</style>
</head>
<body>
<div class="col">
  <div id="hud-text"></div>
  <div class="hp"><div id="hp-fill"></div></div>
  <div class="frame">
    <canvas id="game"></canvas>
    <div id="door-actions" hidden>
      <button id="door-pick" type="button"></button>
      <button id="door-break" type="button"></button>
    </div>
    <div id="over" class="overlay" hidden>
      <div id="over-text"></div>
      <button id="over-new-run" type="button">Nouvelle partie</button>
    </div>
  </div>
  <div class="panel">
    <div class="dice"><div id="die" class="die">d20</div><div id="die-who"></div></div>
    <div id="log"></div>
  </div>
  <div class="bar">
    <button id="wait" type="button">Attendre</button>
    <button id="open-menu" type="button">Menu</button>
    <span id="seed"></span>
  </div>
  <div id="menu" class="overlay">
    <h1>LEUTENHEIM</h1>
    <p>Démo de travail</p>
    <button id="menu-play" type="button">Jouer</button>
    <button id="menu-new" type="button" hidden>Nouvelle partie</button>
    <button id="menu-sound" type="button">Sons : activés</button>
  </div>
</div>
<script>
"use strict";
(() => {
  // src/audio/sfx.ts
  var Sfx = class {
    constructor() {
      this.enabled = true;
      this.ctx = null;
    }
    /** À appeler depuis un geste du joueur (toucher, clic) : les navigateurs n'autorisent le son qu'ainsi. */
    unlock() {
      try {
        if (!this.ctx) {
          const Ctor = window.AudioContext ?? window.webkitAudioContext;
          this.ctx = new Ctor();
        }
        if (this.ctx.state === "suspended") void this.ctx.resume();
      } catch {
        this.ctx = null;
      }
    }
    tone(from, to, duration, wave, volume, delay = 0) {
      const ctx = this.ctx;
      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t + duration);
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(1e-3, t + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.02);
    }
    noise(duration, volume, cutoff, delay = 0) {
      const ctx = this.ctx;
      const t = ctx.currentTime + delay;
      const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = cutoff;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(1e-3, t + duration);
      src.connect(filter).connect(gain).connect(ctx.destination);
      src.start(t);
    }
    play(name) {
      if (!this.enabled || !this.ctx || this.ctx.state !== "running") return;
      try {
        switch (name) {
          case "step":
            this.noise(0.04, 0.05, 700);
            break;
          case "dice":
            for (let i = 0; i < 6; i++) this.noise(0.03, 0.12, 2400 - i * 150, i * 0.06);
            break;
          case "hit":
            this.tone(170, 60, 0.13, "triangle", 0.3);
            this.noise(0.06, 0.15, 1500);
            break;
          case "miss":
            this.noise(0.14, 0.1, 900);
            break;
          case "crit":
            this.tone(170, 50, 0.18, "triangle", 0.35);
            this.tone(880, 1320, 0.22, "sine", 0.18, 0.03);
            break;
          case "hurt":
            this.tone(230, 90, 0.16, "square", 0.12);
            break;
          case "kill":
            this.tone(300, 80, 0.2, "sawtooth", 0.1);
            break;
          case "death":
            [330, 262, 196, 131].forEach((f, i) => this.tone(f, f * 0.97, 0.3, "triangle", 0.2, i * 0.18));
            break;
          case "notice":
            this.tone(520, 880, 0.09, "square", 0.07);
            break;
          case "door":
            this.tone(110, 75, 0.2, "sawtooth", 0.08);
            break;
          case "unlock":
            this.tone(1200, 1200, 0.03, "square", 0.08);
            this.tone(1600, 1600, 0.04, "square", 0.08, 0.09);
            break;
          case "break":
            this.noise(0.3, 0.4, 1200);
            this.tone(120, 40, 0.25, "square", 0.2);
            break;
          case "thud":
            this.noise(0.15, 0.3, 500);
            this.tone(100, 50, 0.12, "sine", 0.25);
            break;
          case "descend":
            [392, 330, 262].forEach((f, i) => this.tone(f, f, 0.12, "sine", 0.15, i * 0.09));
            break;
          case "click":
            this.tone(700, 700, 0.03, "square", 0.05);
            break;
        }
      } catch {
      }
    }
  };

  // src/data/classes.ts
  var CLASSES = {
    guerrier: {
      id: "guerrier",
      name: "Guerrier",
      hp: 10,
      armorClass: 15,
      attackBonus: 4,
      damage: { count: 1, sides: 6, bonus: 2 },
      lockpickBonus: 0,
      breakBonus: 4
    }
  };

  // src/data/floors.ts
  var DEFAULT_FLOOR = {
    width: 32,
    height: 32,
    roomAttempts: 40,
    minRooms: 4,
    roomMinSize: 4,
    roomMaxSize: 8,
    extraLinks: 2,
    wideCorridorChance: 0.3,
    doorChance: 0.6,
    lockChance: 0.5,
    torchChance: 0.5,
    torchRadius: 6
  };

  // src/data/monsters.ts
  var MONSTERS = {
    schrat: {
      id: "schrat",
      name: "Schrat",
      family: "schrats",
      hp: 7,
      armorClass: 12,
      attackBonus: 2,
      damage: { count: 1, sides: 4, bonus: 0 },
      vision: 6,
      noticeChance: 0.4,
      color: "#d9763a"
    }
  };
  function spawnsForDepth(depth) {
    return {
      roomChance: Math.min(0.3 + depth * 0.05, 0.7),
      entries: [{ monster: "schrat", weight: 1, packMin: 1, packMax: Math.min(1 + Math.floor(depth / 2), 4) }]
    };
  }

  // src/data/races.ts
  var RACES = {
    humain: { id: "humain", name: "Humain", hpBonus: 2, darkVision: 4, sight: 11 }
  };

  // src/data/rules.ts
  var RULES = {
    /** Crocheter une serrure : d20 + bonus de classe contre cette difficulté. Silencieux. */
    lockpickDc: 12,
    /** Enfoncer une porte : d20 + bonus de classe contre cette difficulté. Bruyant, réussite ou non. */
    breakDc: 11,
    /** Le bruit d'une porte enfoncée alerte les monstres jusqu'à cette distance (en cases). */
    noiseRadius: 10,
    /** Un monstre remarque plus facilement un héros éclairé par une torche, moins facilement dans le noir. */
    noticeInLight: 1.5,
    noticeInDark: 0.6,
    /** Nombre de pas sur lesquels on « devine » les passages au-delà de ce qu'on voit. */
    senseDepth: 3
  };

  // src/world/fov.ts
  function hasLineOfSight(map, from, to) {
    let x = from.x;
    let y = from.y;
    const dx = Math.abs(to.x - x);
    const dy = Math.abs(to.y - y);
    const sx = x < to.x ? 1 : -1;
    const sy = y < to.y ? 1 : -1;
    let err = dx - dy;
    while (x !== to.x || y !== to.y) {
      if ((x !== from.x || y !== from.y) && map.blocksSight(x, y)) return false;
      const e2 = 2 * err;
      const stepX = e2 > -dy;
      const stepY = e2 < dx;
      if (stepX && stepY && map.blocksSight(x + sx, y) && map.blocksSight(x, y + sy)) return false;
      if (stepX) {
        err -= dy;
        x += sx;
      }
      if (stepY) {
        err += dx;
        y += sy;
      }
    }
    return true;
  }
  function computeFov(map, origin, nearRadius, farRadius = nearRadius, light) {
    const visible = new Uint8Array(map.width * map.height);
    const nearLimit = nearRadius * nearRadius + nearRadius;
    const farLimit = farRadius * farRadius + farRadius;
    for (let y = origin.y - farRadius; y <= origin.y + farRadius; y++) {
      for (let x = origin.x - farRadius; x <= origin.x + farRadius; x++) {
        if (!map.inBounds(x, y)) continue;
        const i = map.index(x, y);
        const d2 = (x - origin.x) ** 2 + (y - origin.y) ** 2;
        const near = d2 <= nearLimit;
        const litAndFar = d2 <= farLimit && light !== void 0 && light[i] > 0;
        if (!near && !litAndFar) continue;
        if (hasLineOfSight(map, origin, { x, y })) visible[i] = 1;
      }
    }
    return visible;
  }
  function computeLight(map, sources) {
    const light = new Float32Array(map.width * map.height);
    for (const s of sources) {
      for (let y = s.y - s.radius; y <= s.y + s.radius; y++) {
        for (let x = s.x - s.radius; x <= s.x + s.radius; x++) {
          if (!map.inBounds(x, y)) continue;
          const d = Math.hypot(x - s.x, y - s.y);
          if (d > s.radius + 0.5 || !hasLineOfSight(map, s, { x, y })) continue;
          const i = map.index(x, y);
          light[i] = Math.max(light[i], 1 - d / (s.radius + 1));
        }
      }
    }
    return light;
  }

  // src/core/rng.ts
  var Rng = class {
    constructor(seed) {
      this.state = seed >>> 0;
    }
    /** Nombre dans [0, 1). */
    next() {
      this.state = this.state + 1831565813 >>> 0;
      let t = this.state;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    /** Entier entre min et max inclus. */
    int(min, max) {
      return min + Math.floor(this.next() * (max - min + 1));
    }
    chance(probability) {
      return this.next() < probability;
    }
  };
  function floorSeed(runSeed, depth) {
    return (runSeed ^ Math.imul(depth, 2654435761)) >>> 0;
  }

  // src/world/map.ts
  var Tile = {
    Wall: 0,
    Floor: 1,
    StairsDown: 2,
    DoorClosed: 3,
    DoorOpen: 4,
    DoorLocked: 5
  };
  var GameMap = class {
    constructor(width, height) {
      this.width = width;
      this.height = height;
      this.tiles = new Uint8Array(width * height);
    }
    index(x, y) {
      return y * this.width + x;
    }
    inBounds(x, y) {
      return x >= 0 && y >= 0 && x < this.width && y < this.height;
    }
    get(x, y) {
      return this.inBounds(x, y) ? this.tiles[this.index(x, y)] : Tile.Wall;
    }
    set(x, y, tile) {
      this.tiles[this.index(x, y)] = tile;
    }
    /** On peut y marcher. Une porte fermée s'ouvre en y entrant ; une porte verrouillée bloque. */
    isWalkable(x, y) {
      const t = this.get(x, y);
      return t !== Tile.Wall && t !== Tile.DoorLocked;
    }
    /** Bloque la vue et la lumière : murs et portes non ouvertes. */
    blocksSight(x, y) {
      const t = this.get(x, y);
      return t === Tile.Wall || t === Tile.DoorClosed || t === Tile.DoorLocked;
    }
    isDoor(x, y) {
      const t = this.get(x, y);
      return t === Tile.DoorClosed || t === Tile.DoorOpen || t === Tile.DoorLocked;
    }
  };

  // src/world/pathfinding.ts
  var DIRS = [
    { x: 0, y: -1 },
    { x: 1, y: 0 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 1, y: -1 },
    { x: 1, y: 1 },
    { x: -1, y: 1 },
    { x: -1, y: -1 }
  ];
  function canStep(map, x, y, dx, dy) {
    if (!map.isWalkable(x + dx, y + dy)) return false;
    if (dx !== 0 && dy !== 0) {
      return map.isWalkable(x + dx, y) && map.isWalkable(x, y + dy);
    }
    return true;
  }
  function distanceField(map, from, allowed) {
    const dist = new Int32Array(map.width * map.height).fill(-1);
    const queue2 = [map.index(from.x, from.y)];
    dist[queue2[0]] = 0;
    for (let head = 0; head < queue2.length; head++) {
      const cur = queue2[head];
      const cx = cur % map.width;
      const cy = (cur - cx) / map.width;
      for (const d of DIRS) {
        if (!canStep(map, cx, cy, d.x, d.y)) continue;
        if (allowed && !allowed(cx + d.x, cy + d.y)) continue;
        const next = map.index(cx + d.x, cy + d.y);
        if (dist[next] !== -1) continue;
        dist[next] = dist[cur] + 1;
        queue2.push(next);
      }
    }
    return dist;
  }
  function findPath(map, from, to, allowed) {
    if (!map.isWalkable(to.x, to.y)) return null;
    if (allowed && !allowed(to.x, to.y)) return null;
    const dist = distanceField(map, to, allowed);
    if (dist[map.index(from.x, from.y)] === -1) return null;
    const path = [];
    let x = from.x;
    let y = from.y;
    while (x !== to.x || y !== to.y) {
      const here = dist[map.index(x, y)];
      let moved = false;
      for (const d of DIRS) {
        if (!canStep(map, x, y, d.x, d.y)) continue;
        if (dist[map.index(x + d.x, y + d.y)] === here - 1) {
          x += d.x;
          y += d.y;
          path.push({ x, y });
          moved = true;
          break;
        }
      }
      if (!moved) return null;
    }
    return path;
  }

  // src/world/generator.ts
  function center(r) {
    return { x: r.x + Math.floor(r.w / 2), y: r.y + Math.floor(r.h / 2) };
  }
  function tooClose(a, b) {
    return a.x - 1 < b.x + b.w && a.x + a.w + 1 > b.x && a.y - 1 < b.y + b.h && a.y + a.h + 1 > b.y;
  }
  function carveCorridor(map, rng, a, b, wideChance) {
    const horizontalFirst = rng.chance(0.5);
    const wide = rng.chance(wideChance);
    const dig = (cx, cy) => {
      const size = wide ? 2 : 1;
      for (let oy = 0; oy < size; oy++) {
        for (let ox = 0; ox < size; ox++) {
          if (cx + ox <= map.width - 2 && cy + oy <= map.height - 2) map.set(cx + ox, cy + oy, Tile.Floor);
        }
      }
    };
    let { x, y } = a;
    const walkX = () => {
      while (x !== b.x) {
        dig(x, y);
        x += Math.sign(b.x - x);
      }
    };
    const walkY = () => {
      while (y !== b.y) {
        dig(x, y);
        y += Math.sign(b.y - y);
      }
    };
    if (horizontalFirst) {
      walkX();
      walkY();
    } else {
      walkY();
      walkX();
    }
    dig(x, y);
  }
  function generateFloor(seed, cfg) {
    const rng = new Rng(seed);
    const map = new GameMap(cfg.width, cfg.height);
    const rooms = [];
    for (let i = 0; (i < cfg.roomAttempts || rooms.length < cfg.minRooms) && i < 2e3; i++) {
      const w = rng.int(cfg.roomMinSize, cfg.roomMaxSize);
      const h = rng.int(cfg.roomMinSize, cfg.roomMaxSize);
      const room = {
        x: rng.int(1, cfg.width - w - 1),
        y: rng.int(1, cfg.height - h - 1),
        w,
        h
      };
      if (rooms.some((r) => tooClose(r, room))) continue;
      rooms.push(room);
    }
    for (const r of rooms) {
      for (let y = r.y; y < r.y + r.h; y++) {
        for (let x = r.x; x < r.x + r.w; x++) map.set(x, y, Tile.Floor);
      }
    }
    const linked = [rooms[0]];
    const pending = rooms.slice(1);
    while (pending.length > 0) {
      let best = { p: 0, l: 0, d: Infinity };
      pending.forEach((pr, p) => {
        linked.forEach((lr, l) => {
          const a = center(pr);
          const b = center(lr);
          const d = Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
          if (d < best.d) best = { p, l, d };
        });
      });
      const room = pending.splice(best.p, 1)[0];
      carveCorridor(map, rng, center(room), center(linked[best.l]), cfg.wideCorridorChance);
      linked.push(room);
    }
    for (let i = 0; i < cfg.extraLinks && rooms.length > 2; i++) {
      const a = rooms[rng.int(0, rooms.length - 1)];
      const b = rooms[rng.int(0, rooms.length - 1)];
      if (a !== b) carveCorridor(map, rng, center(a), center(b), cfg.wideCorridorChance);
    }
    const start = center(rooms[0]);
    const dist = distanceField(map, start);
    let stairs = start;
    let far = 0;
    for (const r of rooms.slice(1)) {
      const c = center(r);
      const d = dist[map.index(c.x, c.y)];
      if (d > far) {
        far = d;
        stairs = c;
      }
    }
    map.set(stairs.x, stairs.y, Tile.StairsDown);
    const torches = [];
    rooms.forEach((room, index) => {
      const ring = ringCells(room);
      const entrances = ring.filter((c) => map.get(c.x, c.y) !== Tile.Wall);
      const doorways = entrances.filter(
        (c) => map.get(c.x + c.tx, c.y + c.ty) === Tile.Wall && map.get(c.x - c.tx, c.y - c.ty) === Tile.Wall
      );
      const hasStairs = stairs.x >= room.x && stairs.x < room.x + room.w && stairs.y >= room.y && stairs.y < room.y + room.h;
      const deadEnd = index > 0 && !hasStairs && entrances.length === 1 && doorways.length === 1;
      if (deadEnd && map.get(doorways[0].x, doorways[0].y) === Tile.Floor && rng.chance(cfg.lockChance)) {
        map.set(doorways[0].x, doorways[0].y, Tile.DoorLocked);
      } else {

      const flicker = 0.85 + 0.1 * Math.sin(this.time / 110) + 0.05 * Math.sin(this.time / 37);
      ctx.fillStyle = COLORS.background;
      ctx.fillRect(0, 0, this.width, this.height);
      const x0 = Math.floor(-ox / tile);
      const y0 = Math.floor(-oy / tile);
      const x1 = Math.ceil((this.width - ox) / tile);
      const y1 = Math.ceil((this.height - oy) / tile);
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          if (!game2.map.inBounds(x, y)) continue;
          const sx = ox + x * tile;
          const sy = oy + y * tile;
          if (!game2.isExplored(x, y)) {
            if (game2.isSensed(x, y)) {
              ctx.fillStyle = COLORS.sensed;
              ctx.fillRect(sx + tile * 0.12, sy + tile * 0.12, tile * 0.76, tile * 0.76);
            }
            continue;
          }
          const t = game2.map.get(x, y);
          ctx.fillStyle = t === Tile.Wall ? COLORS.wall : COLORS.floor;
          ctx.fillRect(sx + 0.5, sy + 0.5, tile - 1, tile - 1);
          this.drawFeature(t, sx, sy);
          if (game2.isVisible(x, y)) {
            const lit = game2.light[game2.map.index(x, y)];
            const glow = Math.max(0, 1 - Math.hypot(x - hero.x, y - hero.y) / (game2.race.darkVision + 1.5));
            const brightness = Math.min(1, Math.max(lit * flicker, glow));
            ctx.fillStyle = `rgba(12,11,18,${((1 - brightness) * 0.55).toFixed(3)})`;
            ctx.fillRect(sx, sy, tile, tile);
            if (lit > 0) {
              ctx.fillStyle = `rgba(255,150,60,${(lit * flicker * 0.2).toFixed(3)})`;
              ctx.fillRect(sx, sy, tile, tile);
            }
          } else {
            ctx.fillStyle = "rgba(12,11,18,0.72)";
            ctx.fillRect(sx, sy, tile, tile);
          }
        }
      }
      for (const torch of game2.torches) {
        if (!game2.isExplored(torch.x, torch.y)) continue;
        const cx = ox + (torch.x + 0.5) * tile;
        const cy = oy + (torch.y + 0.5) * tile;
        ctx.fillStyle = "#ff8a2a";
        ctx.beginPath();
        ctx.arc(cx, cy, tile * 0.2 * flicker, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffe08a";
        ctx.beginPath();
        ctx.arc(cx, cy + tile * 0.03, tile * 0.1 * flicker, 0, Math.PI * 2);
        ctx.fill();
      }
      if (game2.pendingDoor) {
        ctx.strokeStyle = COLORS.lock;
        ctx.lineWidth = 2;
        ctx.strokeRect(ox + game2.pendingDoor.x * tile + 1, oy + game2.pendingDoor.y * tile + 1, tile - 2, tile - 2);
      }
      ctx.fillStyle = COLORS.path;
      game2.path.forEach((p, i) => {
        const last2 = i === game2.path.length - 1;
        ctx.beginPath();
        ctx.arc(ox + (p.x + 0.5) * tile, oy + (p.y + 0.5) * tile, tile * (last2 ? 0.22 : 0.08), 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const m of [...game2.visibleMonsters(), ...ghosts2]) {
        const p = shown(m);
        const cx = ox + (p.x + 0.5) * tile;
        const cy = oy + (p.y + 0.5) * tile;
        const r = tile * 0.36;
        ctx.fillStyle = MONSTERS[m.defId]?.color ?? "#c04040";
        ctx.beginPath();
        ctx.moveTo(cx, cy - r);
        ctx.lineTo(cx + r, cy);
        ctx.lineTo(cx, cy + r);
        ctx.lineTo(cx - r, cy);
        ctx.closePath();
        ctx.fill();
        if (!m.alerted) {
          ctx.fillStyle = "#ffffff";
          ctx.font = `bold ${Math.round(tile * 0.36)}px system-ui, sans-serif`;
          ctx.fillText("z", cx + tile * 0.3, cy - tile * 0.3);
        }
        if (m.hp < m.maxHp) {
          ctx.fillStyle = COLORS.hpBack;
          ctx.fillRect(cx - tile * 0.35, cy - tile * 0.48, tile * 0.7, tile * 0.08);
          ctx.fillStyle = COLORS.hpFill;
          ctx.fillRect(cx - tile * 0.35, cy - tile * 0.48, tile * 0.7 * Math.max(0, m.hp / m.maxHp), tile * 0.08);
        }
      }
      ctx.fillStyle = COLORS.hero;
      ctx.strokeStyle = COLORS.heroEdge;
      ctx.lineWidth = Math.max(2, tile * 0.08);
      ctx.beginPath();
      ctx.arc(ox + (hero.x + 0.5) * tile, oy + (hero.y + 0.5) * tile, tile * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.font = `bold ${Math.round(Math.max(13, tile * 0.42))}px system-ui, sans-serif`;
      this.floats = this.floats.filter((f) => (f.age += dt) < FLOAT_MS);
      for (const f of this.floats) {
        const t = f.age / FLOAT_MS;
        ctx.globalAlpha = 1 - t * t;
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(0,0,0,0.7)";
        const fx = ox + (f.x + 0.5) * tile;
        const fy = oy + (f.y + 0.1 - t * 0.8) * tile;
        ctx.strokeText(f.text, fx, fy);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, fx, fy);
      }
      ctx.globalAlpha = 1;
    }
    /** Escalier et portes, dessinés par-dessus le sol. */
    drawFeature(t, sx, sy) {
      const { ctx, tile } = this;
      if (t === Tile.StairsDown) {
        ctx.fillStyle = COLORS.stairs;
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(sx + tile * 0.15, sy + tile * (0.2 + i * 0.22), tile * (0.3 + i * 0.2), tile * 0.14);
        }
      } else if (t === Tile.DoorClosed || t === Tile.DoorLocked) {
        ctx.fillStyle = COLORS.door;
        ctx.fillRect(sx + tile * 0.1, sy + tile * 0.1, tile * 0.8, tile * 0.8);
        ctx.fillStyle = COLORS.doorEdge;
        ctx.fillRect(sx + tile * 0.47, sy + tile * 0.1, tile * 0.06, tile * 0.8);
        if (t === Tile.DoorLocked) {
          ctx.fillStyle = COLORS.lock;
          ctx.fillRect(sx + tile * 0.36, sy + tile * 0.38, tile * 0.28, tile * 0.24);
          ctx.fillStyle = COLORS.doorEdge;
          ctx.fillRect(sx + tile * 0.47, sy + tile * 0.45, tile * 0.06, tile * 0.12);
        }
      } else if (t === Tile.DoorOpen) {
        ctx.fillStyle = COLORS.door;
        ctx.fillRect(sx + 0.5, sy + 0.5, tile * 0.14, tile - 1);
        ctx.fillRect(sx + tile * 0.86, sy + 0.5, tile * 0.14 - 0.5, tile - 1);
      }
    }
  };

  // src/main.ts
  function stepDuration(pathLength) {
    if (pathLength <= 3) return 180;
    if (pathLength <= 7) return 125;
    return 80;
  }
  var KEYBOARD_STEP_MS = 140;
  var COMBAT_STEP_MS = 170;
  var ROLL_MS = 420;
  var HOLD_HERO_MS = 240;
  var HOLD_FOE_MS = 520;
  var LOG_LINES = 3;
  var OPTIONS_KEY = "leutenheim.options";
  var $ = (id) => document.getElementById(id);
  var canvas = $("game");
  var hudText = $("hud-text");
  var hpFill = $("hp-fill");
  var die = $("die");
  var dieWho = $("die-who");
  var log = $("log");
  var over = $("over");
  var overText = $("over-text");
  var seedLabel = $("seed");
  var doorActions = $("door-actions");
  var menu = $("menu");
  var options = { sound: true };
  try {
    Object.assign(options, JSON.parse(localStorage.getItem(OPTIONS_KEY) ?? "{}"));
  } catch {
  }
  function saveOptions() {
    try {
      localStorage.setItem(OPTIONS_KEY, JSON.stringify(options));
    } catch {
    }
  }
  var sfx = new Sfx();
  sfx.enabled = options.sound;
  var renderer = new Renderer(canvas);
  var game;
  var logLines = [];
  var menuOpen = true;
  var started = false;
  var shownHp = 0;
  var queue = [];
  var cue = null;
  var ghosts = [];
  var stepMs = 125;
  var stepping = false;
  var stepTime = 0;
  function newRun() {
    game = new Game(Math.floor(Math.random() * 4294967295));
    stepping = false;
    queue = [];
    cue = null;
    ghosts = [];
    shownHp = game.hero.hp;
    logLines = [`Vous incarnez un ${game.hero.name}. Touchez un monstre pour l'attaquer.`];
    renderLog();
    die.textContent = "d20";
    die.className = "die";
    dieWho.textContent = "";
    over.hidden = true;
    seedLabel.textContent = `Graine ${game.runSeed}`;
    renderer.snapTo(game);
  }
  function renderLog() {
    logLines = logLines.slice(-LOG_LINES);
    log.replaceChildren(
      ...logLines.map((line) => {
        const p = document.createElement("div");
        p.textContent = line;
        return p;
      })
    );
  }
  var isRoll = (e) => e.type === "attack" || e.type === "door";
  var byFoe = (e) => e.type === "attack" && e.attacker.kind === "monster";
  function describeAttack(e) {
    const r = e.result;
    const who = e.attacker.kind === "hero" ? `Vous attaquez ${e.target.name}` : `${e.attacker.name} vous attaque`;
    const outcome = r.critical ? `coup critique, ${r.damage} d\xE9g\xE2ts` : r.hit ? `touch\xE9, ${r.damage} d\xE9g\xE2ts` : r.d20 === 1 ? "\xE9chec critique" : "rat\xE9";
    const mode = r.mode === "advantage" ? ` (avantage : ${r.rolls.join(" et ")})` : "";
    return `${who} : ${r.d20} + ${r.bonus} = ${r.total} contre CA ${r.targetAc}${mode} \u2014 ${outcome}`;
  }
  function describeDoor(e) {
    const what = e.action === "pick" ? "Vous crochetez la serrure" : "Vous enfoncez la porte";
    const outcome = e.action === "pick" ? e.success ? "elle s'ouvre" : "rat\xE9" : e.success ? "elle c\xE8de" : "elle r\xE9siste";
    const noise = e.action === "break" ? e.alerted > 0 ? ` Le vacarme alerte ${e.alerted} monstre${e.alerted > 1 ? "s" : ""}.` : " Le vacarme r\xE9sonne, sans r\xE9ponse." : "";
    return `${what} : ${e.d20} + ${e.bonus} = ${e.total} contre ${e.dc} \u2014 ${outcome}.${noise}`;
  }
  function startRoll(e) {
    die.className = `die rolling${byFoe(e) ? " foe" : ""}`;
    dieWho.textContent = e.type === "attack" && e.attacker.kind === "monster" ? e.attacker.name : "Vous";
    sfx.play("dice");
  }
  function landDie(value, outcome, foe) {
    die.textContent = String(value);
    die.className = `die land ${outcome}${foe ? " foe" : ""}`;
  }
  function reveal(e) {
    if (e.type === "attack") {
      const r = e.result;
      const foe = e.attacker.kind === "monster";
      logLines.push(describeAttack(e));
      landDie(r.d20, r.critical ? "crit" : r.hit ? "hit" : "miss", foe);
      renderer.addFloatingText(
        e.target.x,
        e.target.y,
        r.hit ? `-${r.damage}` : "Rat\xE9",
        r.critical ? "#ffd75e" : r.hit ? foe ? "#ff6b7a" : "#ffffff" : "#a8a2c0"
      );
      if (foe) shownHp = Math.max(0, shownHp - r.damage);
      sfx.play(r.critical ? "crit" : r.hit ? foe ? "hurt" : "hit" : "miss");
    } else if (e.type === "door") {
      logLines.push(describeDoor(e));
      landDie(e.d20, e.success ? "hit" : "miss", false);
      if (e.action === "break") {
        renderer.addFloatingText(e.x, e.y, e.success ? "CRAC !" : "BOUM", "#ffd75e");
        sfx.play(e.success ? "break" : "thud");
      } else {
        sfx.play(e.success ? "unlock" : "click");
      }
    } else if (e.type === "death") {
      if (e.actor.kind === "hero") {
        overText.textContent = `Vous \xEAtes mort \xE0 l'\xE9tage ${game.depth}, au tour ${game.turn}.`;
        over.hidden = false;
        sfx.play("death");
      } else {
        ghosts = ghosts.filter((g) => g !== e.actor);
        logLines.push(`${e.actor.name} est vaincu.`);
        sfx.play("kill");
      }
    } else if (e.type === "noticed") {
      renderer.addFloatingText(e.actor.x, e.actor.y, "!", "#ffd75e");
      sfx.play("notice");
    } else if (e.type === "descend") {
      logLines.push(`\xC9tage ${game.depth}.${e.healed > 0 ? ` Vous r\xE9cup\xE9rez ${e.healed} PV.` : ""}`);
      shownHp = game.hero.hp;
      sfx.play("descend");
    } else if (e.type === "opened") {
      sfx.play("door");
    }
    renderLog();
  }
  function advanceCues(dt) {
    for (let guard = 0; guard < 16; guard++) {
      if (!cue) {
        const event = queue.shift();
        if (!event) return;
        cue = { event, time: 0, revealed: false, lastFace: 0 };
        if (isRoll(event)) startRoll(event);
      } else {
        cue.time += dt;
      }
      const roll = isRoll(cue.event) ? ROLL_MS : 0;
      if (!cue.revealed && cue.time < roll) {
        if (cue.time - cue.lastFace >= 55) {
          cue.lastFace = cue.time;
          die.textContent = String(1 + Math.floor(Math.random() * 20));
        }
        return;
      }
      if (!cue.revealed) {
        reveal(cue.event);
        cue.revealed = true;
      }
      const hold = isRoll(cue.event) ? byFoe(cue.event) ? HOLD_FOE_MS : HOLD_HERO_MS : 0;
      if (cue.time < roll + hold) return;
      cue = null;
    }
  }
  function collectEvents() {
    for (const e of game.events) {
      if (e.type === "death" && e.actor.kind === "monster") ghosts.push(e.actor);
      queue.push(e);
    }
    game.events.length = 0;
  }
  bindInput(canvas, {
    onTap(px, py) {
      if (menuOpen) return;
      const t = renderer.screenToTile(px, py);
      if (game.setDestination(t.x, t.y)) stepMs = stepDuration(game.path.length);
    },
    onMove(dx, dy) {
      if (menuOpen) return;
      if (game.path.length === 0 && game.moveBy(dx, dy)) stepMs = KEYBOARD_STEP_MS;
    },
    onZoom(factor) {
      renderer.zoomBy(factor);
    }
  });
  window.addEventListener("pointerdown", () => sfx.unlock(), true);
  window.addEventListener("resize", () => renderer.resize());
  function button(id, action) {
    $(id).addEventListener("click", () => {
      sfx.unlock();
      sfx.play("click");
      action();
    });
  }
  button("wait", () => {
    game.wait();
    stepMs = COMBAT_STEP_MS;
  });
  button("over-new-run", newRun);
  var doorButton = (id, action) => button(id, () => game.actOnDoor(action));
  doorButton("door-pick", "pick");
  doorButton("door-break", "break");
  function renderMenu() {
    menu.hidden = !menuOpen;
    $("menu-play").textContent = started ? "Reprendre" : "Jouer";
    $("menu-new").hidden = !started;
    $("menu-sound").textContent = `Sons : ${options.sound ? "activ\xE9s" : "d\xE9sactiv\xE9s"}`;
  }
  button("open-menu", () => {
    menuOpen = true;
    renderMenu();
  });
  button("menu-play", () => {
    menuOpen = false;
    started = true;
    renderMenu();
  });
  button("menu-new", () => {
    newRun();
    menuOpen = false;
    renderMenu();
  });
  button("menu-sound", () => {
    options.sound = !options.sound;
    sfx.enabled = options.sound;
    saveOptions();
    sfx.play("click");
    renderMenu();
  });
  var last = performance.now();
  function frame(now) {
    const dt = Math.min(now - last, 100);
    last = now;
    advanceCues(dt);
    if (stepping) {
      stepTime += dt;
      if (stepTime >= stepMs) {
        stepTime -= stepMs;
        stepping = false;
        if (game.descendIfOnStairs()) {
          renderer.snapTo(game);
          collectEvents();
        }
      }
    }
    if (!stepping && !cue && queue.length === 0 && !menuOpen) {
      shownHp = game.hero.hp;
      if (game.visibleMonsters().length > 0) stepMs = Math.max(stepMs, COMBAT_STEP_MS);
      const before = { x: game.hero.x, y: game.hero.y };
      if (game.tick()) {
        stepping = true;
        if (game.hero.x !== before.x || game.hero.y !== before.y) sfx.play("step");
        collectEvents();
      } else {
        stepTime = 0;
      }
    }
    renderer.draw(game, stepping ? Math.min(stepTime / stepMs, 1) : 1, dt, ghosts);
    hudText.textContent = `\xC9tage ${game.depth} \xB7 PV ${shownHp}/${game.hero.maxHp} \xB7 CA ${game.hero.armorClass} \xB7 Tour ${game.turn}`;
    hpFill.style.width = `${100 * shownHp / game.hero.maxHp}%`;
    doorActions.hidden = !game.pendingDoor || game.over || cue !== null;
    requestAnimationFrame(frame);
  }
  $("door-pick").textContent = `Crocheter (d20 + ${new Game(1).heroClass.lockpickBonus} contre ${RULES.lockpickDc})`;
  $("door-break").textContent = `Enfoncer (d20 + ${new Game(1).heroClass.breakBonus} contre ${RULES.breakDc}) \u2014 bruyant`;
  newRun();
  renderMenu();
  requestAnimationFrame(frame);
  window.leutenheim = { game: () => game };
})();

</script>
</body>
</html>
